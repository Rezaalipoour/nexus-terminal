<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusMail</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23818cf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='4' width='20' height='16' rx='2'/><path d='M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'/></svg>"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ══════════════════════════════════════
   DARK TOKENS
══════════════════════════════════════ */
:root {
  --bg:      #09090f;
  --s1:      #111118;   /* panel bg */
  --s2:      #16161e;   /* inner surface */
  --s3:      #1c1c26;   /* hover */

  --a:       #818cf8;           /* indigo accent */
  --a-dim:   rgba(129,140,248,.09);
  --a-soft:  rgba(129,140,248,.18);
  --a-glow:  rgba(129,140,248,.28);

  --bd:      rgba(129,140,248,.10);
  --bd-h:    rgba(129,140,248,.32);

  --tx:      #eeeeff;
  --tx2:     #6b7280;
  --tx3:     #374151;

  --ok:      #34d399;
  --err:     #f87171;

  --rad:     13px;
  --rads:    8px;
}

/* ══════════════════════════════════════
   LIGHT TOKENS
══════════════════════════════════════ */
[data-theme="light"] {
  --bg:      #f4f4f6;
  --s1:      #ffffff;
  --s2:      #f9f9fb;
  --s3:      #f0f0f4;

  --a:       #6366f1;
  --a-dim:   rgba(99,102,241,.07);
  --a-soft:  rgba(99,102,241,.14);
  --a-glow:  rgba(99,102,241,.20);

  --bd:      rgba(99,102,241,.11);
  --bd-h:    rgba(99,102,241,.38);

  --tx:      #111827;
  --tx2:     #6b7280;
  --tx3:     #d1d5db;

  --ok:      #059669;
  --err:     #dc2626;
}

/* ══════════════════════════════════════
   BASE
══════════════════════════════════════ */
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--tx);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: background .35s, color .25s;
}

/* ══════════════════════════════════════
   WRAPPER — single card that holds all
══════════════════════════════════════ */
.wrap {
  width: 100%;
  max-width: 420px;
}

/* ══════════════════════════════════════
   PANEL — the single container
══════════════════════════════════════ */
.panel {
  background: var(--s1);
  border: 1px solid var(--bd);
  border-radius: 20px;
  overflow: hidden;
  box-shadow:
    0 1px 0 rgba(255,255,255,.03) inset,
    0 24px 64px rgba(0,0,0,.45);
}

[data-theme="light"] .panel {
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 8px 32px rgba(0,0,0,.07);
}

/* ══════════════════════════════════════
   PANEL HEADER (logo + theme toggle)
══════════════════════════════════════ */
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px;
  border-bottom: 1px solid var(--bd);
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;
}

.logo-box {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: var(--a-dim);
  border: 1px solid var(--bd-h);
  display: flex; align-items: center; justify-content: center;
  color: var(--a);
  font-size: 13px;
}

.logo-text {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.4px;
  color: var(--tx);
}

.icon-btn {
  width: 32px; height: 32px;
  background: var(--s2);
  border: 1px solid var(--bd);
  border-radius: var(--rads);
  color: var(--tx2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  transition: all .18s;
}
.icon-btn:hover { border-color: var(--bd-h); color: var(--tx); }

/* ══════════════════════════════════════
   LOGIN VIEW
══════════════════════════════════════ */
.login-view {
  padding: 44px 24px 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
}

.login-glyph {
  width: 56px; height: 56px;
  background: var(--a-dim);
  border: 1px solid var(--bd-h);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--a);
  font-size: 22px;
}

.login-txt { text-align: center; }
.login-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.4px;
  margin-bottom: 6px;
}
.login-sub {
  font-size: 13px;
  color: var(--tx2);
  line-height: 1.6;
}

.g-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 11px 18px;
  background: var(--s2);
  border: 1px solid var(--bd);
  border-radius: var(--rad);
  color: var(--tx);
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .18s;
  letter-spacing: -0.2px;
}
.g-btn:hover {
  border-color: var(--bd-h);
  background: var(--s3);
  box-shadow: 0 4px 16px rgba(0,0,0,.2);
  transform: translateY(-1px);
}
.g-btn:active { transform: scale(.98); }
.g-icon { width: 17px; height: 17px; }

/* ══════════════════════════════════════
   STATUS ROW
══════════════════════════════════════ */
.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  background: var(--s2);
  border-bottom: 1px solid var(--bd);
}

.s-left {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ok);
  flex-shrink: 0;
  animation: dot-pulse 2.8s infinite;
}
.dot.off { background: var(--err); animation: none; }

@keyframes dot-pulse {
  0%,100% { opacity: .55; }
  50%      { opacity: 1; box-shadow: 0 0 0 3px rgba(52,211,153,.18); }
}

.s-email {
  font-size: 11px;
  color: var(--tx2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 200px;
  font-weight: 400;
}

.signout {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: var(--tx2);
  background: none; border: none;
  cursor: pointer;
  transition: color .15s;
  flex-shrink: 0;
}
.signout:hover { color: var(--err); }

/* ══════════════════════════════════════
   MAIN BODY
══════════════════════════════════════ */
.body-inner {
  padding: 16px 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ══════════════════════════════════════
   EMAIL ROW
══════════════════════════════════════ */
.email-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 10px 10px 14px;
  background: var(--s2);
  border: 1px solid var(--bd);
  border-radius: var(--rad);
  cursor: pointer;
  transition: all .18s;
  user-select: none;
}
.email-row:hover { border-color: var(--bd-h); background: var(--s3); }
.email-row:active { transform: scale(.995); }

.email-str {
  flex: 1;
  font-size: 12.5px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: -0.1px;
}
.email-str.loading { color: var(--tx2); animation: fade 1.4s infinite; }
@keyframes fade { 0%,100%{opacity:.3} 50%{opacity:.8} }

.copy-chip {
  width: 32px; height: 32px;
  border-radius: var(--rads);
  background: var(--a-dim);
  border: 1px solid var(--bd);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  color: var(--a);
  flex-shrink: 0;
  transition: all .18s;
}
.email-row:hover .copy-chip {
  background: var(--a);
  color: #fff;
  border-color: var(--a);
}

/* ══════════════════════════════════════
   ACTION BUTTONS
══════════════════════════════════════ */
.actions { display: flex; gap: 8px; }

.act {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px;
  background: var(--s2);
  border: 1px solid var(--bd);
  border-radius: var(--rad);
  color: var(--tx2);
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .18s;
  letter-spacing: -0.1px;
}
.act i { font-size: 11px; color: var(--a); }
.act:hover { border-color: var(--bd-h); color: var(--tx); background: var(--s3); }
.act:active { transform: scale(.97); }
.act.spinning i { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════
   SECTION HEADER
══════════════════════════════════════ */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1px;
}

.section-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--tx2);
}

.scan-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  font-weight: 500;
  color: var(--a);
  letter-spacing: .3px;
}
.scan-pip {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--a);
  animation: pip 2.2s infinite;
}
@keyframes pip { 0%,100%{opacity:.4} 50%{opacity:1} }

/* ══════════════════════════════════════
   INBOX LIST
══════════════════════════════════════ */
.inbox {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 68px;
  max-height: 248px;
  overflow-y: auto;
}
.inbox::-webkit-scrollbar { width: 3px; }
.inbox::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 3px; }

.empty-state {
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--tx2);
  gap: 7px;
}

/* ══════════════════════════════════════
   MESSAGE CARD
══════════════════════════════════════ */
.msg-card {
  background: var(--s2);
  border: 1px solid var(--bd);
  border-radius: var(--rad);
  overflow: hidden;
  animation: slide-up .28s cubic-bezier(.16,1,.3,1);
}
@keyframes slide-up {
  from { opacity:0; transform:translateY(-5px) scale(.99); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}

.msg-from {
  padding: 9px 14px 0;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--tx2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── code display ── */
.code-display {
  margin: 8px 10px 10px;
  background: var(--s1);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 16px 12px;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.code-display:hover {
  border-color: var(--bd-h);
  background: var(--s3);
}
.code-display:active { transform: scale(.985); }

/* digits row */
.digits {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.digit {
  width: 38px; height: 46px;
  background: var(--s2);
  border: 1px solid var(--bd);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  font-weight: 600;
  color: var(--a);
  letter-spacing: 0;
  transition: border-color .2s;
  font-variant-numeric: tabular-nums;
}
.code-display:hover .digit {
  border-color: var(--bd-h);
}

.code-hint {
  text-align: center;
  margin-top: 9px;
  font-size: 10.5px;
  color: var(--tx2);
  font-weight: 400;
  letter-spacing: .2px;
}

.no-code {
  padding: 10px 14px 12px;
  font-size: 11.5px;
  color: var(--tx2);
  text-align: center;
}

/* ══════════════════════════════════════
   TOKEN WARNING
══════════════════════════════════════ */
.token-warn {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 10px 13px;
  background: rgba(248,113,113,.06);
  border: 1px solid rgba(248,113,113,.18);
  border-radius: var(--rad);
  font-size: 11.5px;
  color: #fca5a5;
}
.token-warn.visible { display: flex; }
.reauth-btn {
  margin-left: auto;
  background: rgba(248,113,113,.13);
  border: none;
  color: #fca5a5;
  padding: 4px 10px;
  border-radius: 6px;
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.reauth-btn:hover { background: rgba(248,113,113,.26); }

/* ══════════════════════════════════════
   TOAST
══════════════════════════════════════ */
#toast {
  position: fixed;
  top: 18px; left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: var(--s1);
  border: 1px solid var(--bd-h);
  color: var(--tx);
  font-size: 12px;
  font-weight: 500;
  padding: 8px 18px;
  border-radius: 24px;
  opacity: 0;
  pointer-events: none;
  transition: all .22s cubic-bezier(.16,1,.3,1);
  white-space: nowrap;
  z-index: 999;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body data-theme="dark">

<div id="toast"></div>

<div class="wrap">
<div class="panel">

  <!-- ── PANEL HEADER ── -->
  <div class="panel-head">
    <div class="logo">
      <div class="logo-box">
        <i class="fa-regular fa-envelope"></i>
      </div>
      <span class="logo-text">NexusMail</span>
    </div>
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">
      <i class="fa-regular fa-moon" id="themeIcon"></i>
    </button>
  </div>

  <!-- ── LOGIN VIEW ── -->
  <div class="login-view" id="loginView">
    <div class="login-glyph">
      <i class="fa-regular fa-envelope"></i>
    </div>
    <div class="login-txt">
      <div class="login-title">Connect your inbox</div>
      <div class="login-sub">Link Gmail to catch verification codes<br>the moment they arrive.</div>
    </div>
    <button class="g-btn" onclick="startLogin()">
      <svg class="g-icon" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>
  </div>

  <!-- ── MAIN VIEW ── -->
  <div id="mainView" style="display:none;">

    <div class="status-row">
      <div class="s-left">
        <div class="dot" id="statusDot"></div>
        <span class="s-email" id="statusEmail">—</span>
      </div>
      <button class="signout" onclick="logout()">Sign out</button>
    </div>

    <div class="body-inner">

      <!-- token warning -->
      <div class="token-warn" id="tokenWarning">
        <i class="fa-solid fa-triangle-exclamation" style="font-size:11px;"></i>
        Session expired
        <button class="reauth-btn" onclick="silentRefresh()">Refresh</button>
      </div>

      <!-- email -->
      <div class="email-row" onclick="copyEmail()" title="Click to copy">
        <span class="email-str loading" id="emailDisplay">Generating…</span>
        <div class="copy-chip" id="copyInner">
          <i class="fa-regular fa-copy" id="copyIcon"></i>
        </div>
      </div>

      <!-- actions -->
      <div class="actions">
        <button class="act" id="refreshBtn" onclick="doRefresh()">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
        <button class="act" onclick="newEmail()">
          <i class="fa-solid fa-plus"></i> New Email
        </button>
      </div>

      <!-- section header -->
      <div class="section-head">
        <span class="section-label">Verification Codes</span>
        <div class="scan-badge">
          <div class="scan-pip" id="scanDot"></div>
          <span id="scanText">Scanning</span>
        </div>
      </div>

      <!-- inbox -->
      <div class="inbox" id="inbox">
        <div class="empty-state">
          <i class="fa-regular fa-clock"></i>
          Awaiting emails…
        </div>
      </div>

    </div><!-- /body-inner -->
  </div><!-- /mainView -->

</div><!-- /panel -->
</div><!-- /wrap -->

<script>
const CLIENT_ID = '159808029273-ml37999iis48lr4ev5m2u9vesj62fouv.apps.googleusercontent.com';
const SCOPES    = 'https://www.googleapis.com/auth/gmail.readonly';

let accessToken   = null;
let tokenExpiry   = 0;
let baseGmail     = null;
let currentAlias  = null;
let currentSuffix = null;
let pollTimer     = null;
let refreshTimer  = null;
let knownIds      = new Set();
let firstCopied   = false;
let tokenClient   = null;

/* ── theme ── */
function toggleTheme() {
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  document.body.setAttribute('data-theme', next);
  document.getElementById('themeIcon').className = isDark ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
  localStorage.setItem('theme', next);
}
(function initTheme() {
  const t = localStorage.getItem('theme') || 'dark';
  document.body.setAttribute('data-theme', t);
  document.getElementById('themeIcon').className = t === 'dark' ? 'fa-regular fa-moon' : 'fa-regular fa-sun';
})();

/* ── sound: soft click for copy email ── */
function playClick() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.06, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      // filtered noise burst → tactile click feel
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 4) * 0.35;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    // slight high-pass feel via biquad
    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = 3200;
    filt.Q.value = 0.8;
    src.connect(filt);
    filt.connect(ctx.destination);
    src.start();
  } catch(e) {}
}

/* ── notification chime for new code ── */
function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [
      { freq: 880,  start: 0,    dur: 0.10, vol: 0.14 },
      { freq: 1108, start: 0.09, dur: 0.14, vol: 0.09 },
    ].forEach(n => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = n.freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + n.start);
      gain.gain.linearRampToValueAtTime(n.vol, ctx.currentTime + n.start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + n.start + n.dur);
      osc.start(ctx.currentTime + n.start);
      osc.stop(ctx.currentTime + n.start + n.dur + 0.04);
    });
  } catch(e) {}
}

/* ── auth ── */
function initTokenClient() {
  if (tokenClient) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES, prompt: '',
    callback: handleTokenResponse
  });
}

function handleTokenResponse(resp) {
  if (resp.error) {
    document.getElementById('tokenWarning').classList.add('visible');
    setStatus(false); return;
  }
  accessToken = resp.access_token;
  tokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
  localStorage.setItem('gToken', accessToken);
  localStorage.setItem('gExpiry', tokenExpiry);
  document.getElementById('tokenWarning').classList.remove('visible');
  scheduleTokenRefresh();
}

function startLogin() {
  const tc = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES, prompt: 'select_account',
    callback: async (resp) => {
      if (resp.error) { showToast('Login cancelled'); return; }
      accessToken = resp.access_token;
      tokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
      localStorage.setItem('gToken', accessToken);
      localStorage.setItem('gExpiry', tokenExpiry);
      await fetchProfile();
      initTokenClient(); scheduleTokenRefresh();
    }
  });
  tc.requestAccessToken({ prompt: 'select_account' });
}

function silentRefresh() {
  if (!tokenClient) initTokenClient();
  tokenClient.requestAccessToken({ prompt: '' });
}

function scheduleTokenRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  const ms = tokenExpiry - Date.now();
  if (ms > 0) refreshTimer = setTimeout(silentRefresh, ms);
}

async function fetchProfile() {
  try {
    const r = await fetch('https://www.googleapis.com/gmail/v1/users/me/profile', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const d = await r.json();
    baseGmail = d.emailAddress;
    localStorage.setItem('gEmail', baseGmail);
    document.getElementById('statusEmail').innerText = baseGmail;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display  = 'block';
    setStatus(true); newEmail();
  } catch(e) { showToast('Profile error'); }
}

function logout() {
  clearInterval(pollTimer); clearTimeout(refreshTimer);
  accessToken = tokenClient = null;
  ['gToken','gExpiry','gEmail'].forEach(k => localStorage.removeItem(k));
  document.getElementById('mainView').style.display  = 'none';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('inbox').innerHTML = emptyState();
}

window.addEventListener('load', () => {
  const tok = localStorage.getItem('gToken');
  const exp = parseInt(localStorage.getItem('gExpiry') || '0');
  const em  = localStorage.getItem('gEmail');
  if (tok && em && Date.now() < exp) {
    accessToken = tok; tokenExpiry = exp; baseGmail = em;
    document.getElementById('statusEmail').innerText = em;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display  = 'block';
    setStatus(true); initTokenClient(); scheduleTokenRefresh(); newEmail();
  }
});

/* ── email ── */
function randStr(n = 6) {
  const c = 'abcdefghijklmnopqrstuvwxyz0123456789';
  return Array.from({length: n}, () => c[Math.random() * c.length | 0]).join('');
}

function newEmail() {
  if (!baseGmail) return;
  clearInterval(pollTimer); knownIds.clear(); firstCopied = false;
  currentSuffix = randStr(6);
  const [local, domain] = baseGmail.split('@');
  currentAlias = `${local}+${currentSuffix}@${domain}`;
  const el = document.getElementById('emailDisplay');
  el.innerText = currentAlias;
  el.classList.remove('loading');
  document.getElementById('inbox').innerHTML = emptyState();
  document.getElementById('scanText').innerText = 'Scanning';
  pollTimer = setInterval(poll, 5000);
}

/* ── polling ── */
async function poll() {
  if (!accessToken || !currentAlias) return;
  if (Date.now() > tokenExpiry) { silentRefresh(); return; }
  try {
    const q   = encodeURIComponent(`to:${currentAlias}`);
    const res = await fetch(
      `https://www.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=15`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (res.status === 401) { silentRefresh(); return; }
    const data = await res.json();
    for (const m of (data.messages || [])) {
      if (!knownIds.has(m.id)) {
        knownIds.add(m.id);
        if (document.querySelector('.empty-state')) {
          document.getElementById('inbox').innerHTML = '';
        }
        fetchMsg(m.id);
      }
    }
  } catch(e) {}
}

async function fetchMsg(id) {
  try {
    const res = await fetch(
      `https://www.googleapis.com/gmail/v1/users/me/messages/${id}?format=full`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    const msg = await res.json();
    const hdrs = msg.payload.headers || [];
    const from = (hdrs.find(h => h.name === 'From') || {}).value || '';
    const subj = (hdrs.find(h => h.name === 'Subject') || {}).value || '';
    let body = '';
    function exB(p) {
      if (p.mimeType === 'text/plain' && p.body?.data)
        body += atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/'));
      else if (p.mimeType === 'text/html' && p.body?.data && !body)
        body += atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/')).replace(/<[^>]*>/g,' ');
      if (p.parts) p.parts.forEach(exB);
    }
    if (msg.payload.parts) msg.payload.parts.forEach(exB);
    else if (msg.payload.body?.data)
      body = atob(msg.payload.body.data.replace(/-/g,'+').replace(/_/g,'/'));
    const code   = extractCode(subj + ' ' + body);
    const sender = from.replace(/<.*>/,'').trim() || from.split('@')[0];
    renderMsg(sender, code);
    if (code && !firstCopied) {
      firstCopied = true;
      navigator.clipboard.writeText(code).catch(() => {});
      showToast('Code copied');
      playChime();
    }
  } catch(e) {}
}

function extractCode(text) {
  const pats = [
    /(?:verification|confirm|code|otp|pin)[^\d]*(\d{4,8})/i,
    /(\d{4,8})(?:[^\d]|$).*(?:verification|confirm|code|otp|pin)/i,
    /\b(\d{6})\b/, /\b(\d{4,8})\b/
  ];
  for (const p of pats) {
    const m = text.match(p);
    if (m) {
      const code = m[1] || m[0];
      const n = parseInt(code);
      if (n >= 1000 && n <= 99999999 && !(n >= 2020 && n <= 2030)) return code;
    }
  }
  return null;
}

/* ── render message with digit cards ── */
function renderMsg(sender, code) {
  const inbox = document.getElementById('inbox');
  const card  = document.createElement('div');
  card.className = 'msg-card';

  let codeHTML = '';
  if (code) {
    const digits = code.split('').map(d =>
      `<div class="digit">${d}</div>`
    ).join('');
    codeHTML = `
      <div class="code-display" onclick="copyCode('${code}')" title="Click to copy">
        <div class="digits">${digits}</div>
        <div class="code-hint">Tap to copy</div>
      </div>`;
  } else {
    codeHTML = `<div class="no-code">No code detected — check Gmail</div>`;
  }

  card.innerHTML = `<div class="msg-from">${esc(sender)}</div>${codeHTML}`;
  inbox.prepend(card);
}

function emptyState() {
  return `<div class="empty-state"><i class="fa-regular fa-clock"></i> Awaiting emails…</div>`;
}

async function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning'); await poll();
  setTimeout(() => btn.classList.remove('spinning'), 600);
}

function copyEmail() {
  if (!currentAlias) return;
  playClick();
  navigator.clipboard.writeText(currentAlias).then(() => {
    showToast('Email copied');
    const icon = document.getElementById('copyIcon');
    icon.className = 'fa-solid fa-check';
    setTimeout(() => icon.className = 'fa-regular fa-copy', 1400);
  });
}

function copyCode(code) {
  playClick();
  navigator.clipboard.writeText(code).then(() => showToast('Code copied'));
}

function setStatus(ok) {
  document.getElementById('statusDot').className = ok ? 'dot' : 'dot off';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
