<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Gmail Mail</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='4' width='20' height='16' rx='2'></rect><path d='M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'></path></svg>" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --bg-body: #020204;
            --card-bg: rgba(8, 8, 14, 0.88);
            --card-border: rgba(99, 102, 241, 0.14);
            --text-primary: #f0f2ff;
            --text-secondary: #8892b0;
            --accent: #6366f1;
            --box-bg: rgba(6, 6, 12, 0.85);
            --btn-border: rgba(255, 255, 255, 0.10);
            --code-bg: rgba(99, 102, 241, 0.14);
            --shadow: 0 24px 50px rgba(0,0,0,0.85), 0 0 0 1px rgba(99,102,241,0.06);
            --grid-color: rgba(99, 102, 241, 0.04);
            --grid-line: rgba(140, 145, 255, 0.055);
            --grid-dot: rgba(99, 102, 241, 0.42);
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.06);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #4f46e5;
            --box-bg: rgba(241, 245, 249, 0.8);
            --btn-border: rgba(0, 0, 0, 0.08);
            --code-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
            --grid-color: rgba(79, 70, 229, 0.015);
            --grid-line: rgba(0, 0, 0, 0.04);
            --grid-dot: rgba(79, 70, 229, 0.12);
        }
        [data-theme="light"] body,
        body[data-theme="light"] {
            background-image: none;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-weight: 400; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body);
            background-image:
                radial-gradient(ellipse 120% 80% at 20% 20%, rgba(55, 10, 100, 0.28) 0%, transparent 55%),
                radial-gradient(ellipse 100% 90% at 80% 80%, rgba(60, 62, 180, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse 80% 60% at 50% 100%, rgba(90, 50, 180, 0.12) 0%, transparent 60%);
            color: var(--text-primary);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        [data-theme="light"] body { background-image: none; }

        .bg-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-grid::before {
            content: '';
            position: absolute;
            inset: -10%;
            background-image:
                linear-gradient(var(--grid-line) 0.5px, transparent 0.5px),
                linear-gradient(90deg, var(--grid-line) 0.5px, transparent 0.5px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse 90% 85% at 50% 50%, black 20%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 90% 85% at 50% 50%, black 20%, transparent 100%);
            animation: gridDrift 30s linear infinite;
        }

        .bg-grid::after {
            content: '';
            position: absolute;
            inset: -10%;
            background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 0%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 0%, transparent 100%);
            animation: gridDrift 30s linear infinite;
        }

        @keyframes gridDrift {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(64px) translateX(0); }
        }

        .bg-glow, .bg-glow-2, .bg-orb { display: none; }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 22px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex; flex-direction: column; gap: 14px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
        .header h1 span { color: var(--accent); font-weight: 700; }

        .theme-btn {
            background: transparent; border: none;
            color: var(--text-secondary); font-size: 18px;
            cursor: pointer; transition: color 0.2s ease;
        }
        .theme-btn:hover { color: var(--accent); }

        /* --- LOGIN SECTION --- */
        .login-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 16px 0 8px;
        }

        .login-icon {
            width: 48px; height: 48px;
            background: var(--code-bg);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            color: var(--accent);
        }

        .login-desc {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.7;
        }

        .google-login-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--box-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            justify-content: center;
        }
        .google-login-btn:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.08);
        }
        .google-login-btn:active { transform: scale(0.97); }

        .google-icon { width: 20px; height: 20px; }

        /* --- MAIN SECTION --- */
        .main-section { display: none; flex-direction: column; gap: 14px; }
        .main-section.visible { display: flex; }

        .user-info-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
            width: 100%;
        }

        /* User badge - Outlined & Centered */
        .user-badge {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            padding: 8px 14px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            min-width: 0;
        }
        .user-badge:hover {
            background: rgba(99, 102, 241, 0.05);
            border-color: rgba(99, 102, 241, 0.5);
        }

        #userEmail {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: 0.2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Logout btn - Icon Only */
        .logout-btn {
            flex-shrink: 0;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .logout-btn i { margin: 0; }
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.18);
            color: var(--text-primary);
        }
        .logout-btn:active { transform: scale(0.95); }

        .session-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
        }
        .session-tag i {
            font-size: 8px;
            color: var(--accent);
            animation: sessionIconPulse 2s ease-in-out infinite;
        }
        .session-tag::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 1.5px solid rgba(99, 102, 241, 0.4);
            animation: sessionRing 2s ease-in-out infinite;
        }
        @keyframes sessionIconPulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        @keyframes sessionRing {
            0% { transform: scale(0.85); opacity: 0.6; }
            50% { transform: scale(1.25); opacity: 0; }
            100% { transform: scale(0.85); opacity: 0; }
        }

        /* Generated Email Box - With Subtle Color */
        .email-display-group {
            background: rgba(99, 102, 241, 0.22);
            border: 1px solid rgba(99, 102, 241, 0.5) !important;
            border-radius: 14px;
            padding: 6px 6px 6px 14px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.1s ease;
        }
        .email-display-group:hover {
            border-color: var(--accent) !important;
            background: rgba(99, 102, 241, 0.18);
        }
        .email-display-group:active { transform: scale(0.98); }

        .email-text {
            font-size: 13px; font-weight: 600; letter-spacing: 0.2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--text-primary);
        }
        .email-text.loading { color: var(--text-secondary); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .action-icon-btn {
            background: var(--btn-border); border: none;
            width: 36px; height: 36px;
            border-radius: 10px;
            color: var(--text-primary); cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 14px;
            pointer-events: none;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .email-display-group:hover .action-icon-btn {
            background: var(--accent); color: #fff;
        }

        .controls { display: flex; gap: 10px; }
        .btn {
            flex: 1; background: transparent; border: 1px solid var(--btn-border);
            color: var(--text-primary); padding: 7px; border-radius: 12px;
            font-family: inherit; font-size: 12px; font-weight: 400; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 6px;
            border-color: rgba(99, 102, 241, 0.2) !important;
            transition: background-color 0.15s ease, border-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
        }
        .btn:hover {
            background: rgba(99, 102, 241, 0.08) !important;
            border-color: rgba(99, 102, 241, 0.45) !important;
            box-shadow: 0 0 14px rgba(99, 102, 241, 0.1);
        }
        .btn:active { transform: scale(0.96); }
        .spin i { animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .divider { height: 1px; background: var(--btn-border); width: 100%; margin: 2px 0; }

        .inbox-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; font-weight: 400; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 1.5px;
        }

        .radar { display: flex; align-items: center; gap: 6px; }
        .dot {
            width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
            animation: blink 2s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; box-shadow: 0 0 8px var(--accent); } }

        /* Timer bar */
        .timer-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .timer-label {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            white-space: nowrap;
            min-width: 38px;
            text-align: right;
        }
        .timer-bar-track {
            flex: 1;
            height: 3px;
            background: rgba(99, 102, 241, 0.12);
            border-radius: 4px;
            overflow: hidden;
        }
        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #6366f1, #a78bfa);
            border-radius: 4px;
            transition: width 1s linear, background 0.5s ease;
        }
        .timer-bar-fill.warning {
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
        }

        .inbox-list {
            display: flex; flex-direction: column; gap: 12px;
            min-height: 80px;
            max-height: 250px;
            overflow-y: auto; padding-right: 4px;
        }

        .inbox-list::-webkit-scrollbar { width: 4px; }
        .inbox-list::-webkit-scrollbar-thumb { background: var(--btn-border); border-radius: 4px; }

        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 80px; gap: 8px; color: var(--text-secondary); font-size: 12px; font-weight: 300; letter-spacing: 0.3px;
        }

        .message {
            background: var(--box-bg);
            border: 1px solid var(--btn-border);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeUp 0.3s ease forwards;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .msg-sender {
            font-size: 10px;
            font-weight: 400;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: left;
            width: 100%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding-left: 2px;
        }

        .extracted-code {
            background: var(--code-bg);
            color: var(--accent);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 12px;
            padding: 8px 20px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 8px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: all 0.2s ease;
            will-change: transform;
        }

        .extracted-code:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .extracted-code:active {
            transform: scale(0.97);
            box-shadow: none;
        }

        .link-block {
            background: var(--box-bg);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            padding: 10px 14px;
        }

        .login-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 400;
            font-family: 'Outfit', sans-serif;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .login-link-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--text-primary); color: var(--bg-body);
            font-size: 13px; font-weight: 400;
            padding: 10px 20px; border-radius: 20px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: var(--shadow); z-index: 100;
            display: flex; align-items: center; gap: 8px;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .toast-icon { font-size: 14px; }

        .launchers { display: flex; gap: 10px; }
        .launch-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
            padding: 7px 8px; border-radius: 14px; border: 1px solid var(--btn-border);
            background: var(--box-bg); color: var(--text-secondary); font-family: inherit;
            font-size: 10px; font-weight: 400; cursor: pointer; text-decoration: none;
            transition: all 0.2s ease; letter-spacing: 0.4px; text-transform: uppercase;
            position: relative; overflow: hidden;
        }
        .launch-btn svg { flex-shrink: 0; }
        .launch-btn:hover { transform: translateY(-2px); }
        .launch-btn:active { transform: scale(0.96); }

        .launch-btn.nana { border-color: rgba(99, 102, 241, 0.3); color: #818cf8; }
        .launch-btn.nana:hover { background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.55); box-shadow: 0 0 16px rgba(99, 102, 241, 0.15); color: #a5b4fc; }
        .launch-btn.v03 { border-color: rgba(99, 102, 241, 0.3); color: #818cf8; }
        .launch-btn.v03:hover { background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.55); box-shadow: 0 0 16px rgba(99, 102, 241, 0.15); color: #a5b4fc; }

        .launch-btn.pulse-ready { animation: sitePulse 1.2s ease-in-out 4; }
        .launch-btn.nana.pulse-ready, .launch-btn.v03.pulse-ready { border-color: rgba(99, 102, 241, 0.8); background: rgba(99, 102, 241, 0.12); color: #a5b4fc; }
        @keyframes sitePulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.25); } 50% { box-shadow: 0 0 0 7px rgba(99,102,241,0); } }
        .launch-btn.v03.pulse-ready { animation-name: sitePulse; }

        .launch-dot { position: absolute; top: 7px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: #22c55e; opacity: 0; transition: opacity 0.3s; }
        .launch-btn.pulse-ready .launch-dot { opacity: 1; }

        #pendingCopyBanner {
            display: none; align-items: center; justify-content: space-between;
            background: rgba(234, 179, 8, 0.08); border: 1px solid rgba(234, 179, 8, 0.35);
            border-radius: 14px; padding: 10px 14px; gap: 10px; cursor: pointer;
            transition: background 0.2s ease; animation: fadeUp 0.35s ease forwards;
        }
        #pendingCopyBanner:hover { background: rgba(234, 179, 8, 0.16); }
        #pendingCopyBanner:active { transform: scale(0.98); }
        .pending-banner-left { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #fbbf24; }
        .pending-banner-code { font-size: 20px; font-weight: 700; letter-spacing: 5px; color: #fcd34d; }
        .pending-banner-tap { font-size: 10px; font-weight: 400; color: #fbbf24; background: rgba(234, 179, 8, 0.18); border: 1px solid rgba(234, 179, 8, 0.35); border-radius: 8px; padding: 4px 10px; white-space: nowrap; letter-spacing: 0.5px; }

        .card { box-shadow: var(--shadow), 0 0 0 1px rgba(99, 102, 241, 0.08), 0 0 40px rgba(99, 102, 241, 0.04); }
        .header h1 { font-size: 21px; font-weight: 600; letter-spacing: 0.3px; }
        .header h1 span { font-weight: 700; background: linear-gradient(135deg, #6366f1, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    </style>
</head>
<body data-theme="dark">

    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div id="toast">
        <span class="toast-icon" id="toastIcon">✓</span>
        <span id="toastMsg">Copied!</span>
    </div>

    <div class="container">
        <div class="card">

            <div class="header">
                <h1>Nexus<span>Mail</span></h1>
                <button class="theme-btn" onclick="toggleTheme()" title="Switch Theme">
                    <i class="fa-regular fa-sun" id="themeIcon"></i>
                </button>
            </div>

            <!-- LOGIN SECTION -->
            <div class="login-section" id="loginSection">
                <div class="login-icon"><i class="fa-regular fa-envelope"></i></div>
                <p class="login-desc">
                    Sign in with your Gmail account.<br>
                    One login per browser is enough.
                </p>
                <button class="google-login-btn" onclick="startGoogleLogin()">
                    <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Login with Google
                </button>
            </div>

            <!-- MAIN SECTION (after login) -->
            <div class="main-section" id="mainSection">

                <div id="reauthBanner" style="display:none; align-items:center; justify-content:space-between; background:rgba(234,179,8,0.08); border:1px solid rgba(234,179,8,0.25); border-radius:12px; padding:8px 14px; gap:10px;">
                    <span style="font-size:12px; color:#fbbf24; display:flex; align-items:center; gap:6px;">

    <script>
        const CLIENT_ID = '159808029273-ml37999iis48lr4ev5m2u9vesj62fouv.apps.googleusercontent.com';

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playEmailClick() {
            try {
                const ctx = getAudioCtx();
                const now = ctx.currentTime;
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();
                const filter = ctx.createBiquadFilter();

                osc1.type = 'sine'; osc1.frequency.setValueAtTime(880, now); osc1.frequency.exponentialRampToValueAtTime(1200, now + 0.06);
                osc2.type = 'sine'; osc2.frequency.setValueAtTime(1320, now); osc2.frequency.exponentialRampToValueAtTime(1760, now + 0.05);
                filter.type = 'bandpass'; filter.frequency.value = 1200; filter.Q.value = 1.5;

                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.12, now + 0.01); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
                osc1.start(now); osc1.stop(now + 0.2); osc2.start(now); osc2.stop(now + 0.15);
            } catch(e) {}
        }

        function playIncomingEmail() {

            } catch(e) {}
        }

        function playChimeNote(ctx, startTime, freq, vol) {
            const osc = ctx.createOscillator(); const gainNode = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(freq, startTime);
            gainNode.gain.setValueAtTime(0, startTime); gainNode.gain.linearRampToValueAtTime(vol, startTime + 0.015); gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.55);
            
            const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
            osc2.type = 'sine'; osc2.frequency.setValueAtTime(freq * 2, startTime);
            gain2.gain.setValueAtTime(0, startTime); gain2.gain.linearRampToValueAtTime(vol * 0.3, startTime + 0.01); gain2.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
            
            osc.connect(gainNode); osc2.connect(gain2); gainNode.connect(ctx.destination); gain2.connect(ctx.destination);
            osc.start(startTime); osc.stop(startTime + 0.6); osc2.start(startTime); osc2.stop(startTime + 0.3);
        }

        function playCopyCode() {
            try {
                const ctx = getAudioCtx(); const now = ctx.currentTime;
                [1046.5, 1318.5].forEach((freq, i) => {

                    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t); osc.frequency.exponentialRampToValueAtTime(freq * 0.98, t + 0.08);
                    gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.1, t + 0.008); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                    osc.connect(gain); gain.connect(ctx.destination); osc.start(t); osc.stop(t + 0.15);
                });
            } catch(e) {}
        }

        function playNanaSound() {

        function playV03Sound() {

                    const t = now + delay;
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t);
                    gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.11, t + 0.012); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
                    osc.connect(gain); gain.connect(ctx.destination); osc.start(t); osc.stop(t + 0.7);

                    const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
                    osc2.type = 'sine'; osc2.frequency.setValueAtTime(freq * 2, t);
                    gain2.gain.setValueAtTime(0, t); gain2.gain.linearRampToValueAtTime(0.028, t + 0.008); gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.28);

        let lastCodeSite = null;

        function detectSite(fromRaw) {

        }

        let accessToken = null; let baseGmail = null; let currentSuffix = null; let currentAlias = null;
        let checkInterval = null; let knownMessageIds = new Set(); let tokenRefreshTimer = null;
        let pendingAutoCopyCode = null; let pendingAutoCopySite = null;

        function tryPendingCopy() {
            if (!pendingAutoCopyCode) return;

            pendingAutoCopyCode = null; pendingAutoCopySite = null;

                if (site === 'nana') { playNanaSound(); triggerSiteReady('nana'); }
                else if (site === 'v03') { playV03Sound(); triggerSiteReady('v03'); }
                else { playNanaSound(); triggerSiteReady('nana'); triggerSiteReady('v03'); }
            }).catch(() => {
                showPendingBanner(code, site);
                pendingAutoCopyCode = code; pendingAutoCopySite = site;
            });
        }
        function showPendingBanner(code, site) {
            const banner = document.getElementById('pendingCopyBanner'); const bannerCode = document.getElementById('pendingBannerCode');
            if (banner && bannerCode) { bannerCode.textContent = code; banner.style.display = 'flex'; }
        }
        function hidePendingBanner() {
            const banner = document.getElementById('pendingCopyBanner'); if (banner) banner.style.display = 'none';
        }
        function commitPendingCopy() {
            if (!pendingAutoCopyCode) return;
            const code = pendingAutoCopyCode; const site = pendingAutoCopySite;
            pendingAutoCopyCode = null; pendingAutoCopySite = null;

                playCopyCode(); showToast('Code Copied!', '⚡');
                if (site === 'nana') { triggerSiteReady('nana'); } else if (site === 'v03') { triggerSiteReady('v03'); } else { triggerSiteReady('nana'); triggerSiteReady('v03'); }
            }).catch(() => {});
        }

        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && pendingAutoCopyCode) tryPendingCopy(); });
        window.addEventListener('focus', () => { if (pendingAutoCopyCode) tryPendingCopy(); });
        document.addEventListener('click', () => { if (pendingAutoCopyCode) tryPendingCopy(); }, true);

        function toggleTheme() {

        }
        if (localStorage.getItem('theme') === 'light') { document.body.setAttribute('data-theme', 'light'); document.getElementById('themeIcon').className = 'fa-regular fa-moon'; }

        let _tokenClient = null;
        function getTokenClient(loginHint, promptMode) {
            return google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, prompt: promptMode || '', login_hint: loginHint || undefined, callback: handleTokenResponse });
        }
        function handleTokenResponse(response) {
            if (response.error) { if (baseGmail) { showReauthBanner(); } return; }
            accessToken = response.access_token; const expiry = Date.now() + (response.expires_in * 1000);
            localStorage.setItem('gAccessToken', accessToken); localStorage.setItem('gTokenExpiry', expiry.toString());
            scheduleTokenRefresh(response.expires_in - 300); hideReauthBanner();
        }
        function startGoogleLogin() {
            const savedEmail = localStorage.getItem('gBaseEmail');
            _tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID, scope: SCOPES, prompt: savedEmail ? '' : 'select_account', login_hint: savedEmail || undefined,
                callback: (response) => {
                    if (response.error) { showToast('Login Failed!', '✕'); return; }
                    accessToken = response.access_token; const expiry = Date.now() + (response.expires_in * 1000);
                    localStorage.setItem('gAccessToken', accessToken); localStorage.setItem('gTokenExpiry', expiry.toString());
                    scheduleTokenRefresh(response.expires_in - 300); onLoginSuccess(false);
                }
            });
            _tokenClient.requestAccessToken();
        }
        function scheduleTokenRefresh(secondsUntilRefresh) {
            if (tokenRefreshTimer) clearTimeout(tokenRefreshTimer);
            const delay = Math.max(secondsUntilRefresh, 10);
            tokenRefreshTimer = setTimeout(doSilentRefresh, delay * 1000);
        }
        function doSilentRefresh() {
            if (!baseGmail) return;
            try {
                const client = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, prompt: '', login_hint: baseGmail,
                    callback: (response) => {
                        if (response.error) { showReauthBanner(); return; }
                        accessToken = response.access_token; const expiry = Date.now() + (response.expires_in * 1000);
                        localStorage.setItem('gAccessToken', accessToken); localStorage.setItem('gTokenExpiry', expiry.toString());
                        scheduleTokenRefresh(response.expires_in - 300); hideReauthBanner();
                    }
                });
                client.requestAccessToken();
            } catch(e) { showReauthBanner(); }
        }
        function showReauthBanner() { let banner = document.getElementById('reauthBanner'); if (banner) banner.style.display = 'flex'; }
        function hideReauthBanner() { let banner = document.getElementById('reauthBanner'); if (banner) banner.style.display = 'none'; }
        function reauthClick() {
            const client = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, prompt: '', login_hint: baseGmail,
                callback: (response) => {
                    if (response.error) { showToast('Re-login required', '🔑'); clearSessionUI(); return; }
                    accessToken = response.access_token; const expiry = Date.now() + (response.expires_in * 1000);
                    localStorage.setItem('gAccessToken', accessToken); localStorage.setItem('gTokenExpiry', expiry.toString());
                    scheduleTokenRefresh(response.expires_in - 300); hideReauthBanner(); showToast('Session Restored!', '⚡');
                }
            });
            client.requestAccessToken();
        }
        async function onLoginSuccess(isRestored) {
            try {
                const res = await fetch('https://www.googleapis.com/gmail/v1/users/me/profile', { headers: { 'Authorization': `Bearer ${accessToken}` } });
                if (res.status === 401) { clearSessionUI(); return; }
                const data = await res.json(); baseGmail = data.emailAddress; localStorage.setItem('gBaseEmail', baseGmail);
                document.getElementById('userEmail').innerText = baseGmail;
                if (isRestored) { document.getElementById('sessionTag').style.display = 'inline-flex'; }
                document.getElementById('loginSection').style.display = 'none'; document.getElementById('mainSection').classList.add('visible');
                generateNewAlias();
            } catch(e) { showToast('Error fetching profile', '✕'); }
        }
        function logout() {
            if (accessToken) { try { google.accounts.oauth2.revoke(accessToken); } catch(e) {} }
            localStorage.removeItem('gBaseEmail'); clearSessionUI();
        }
        function clearSessionUI() {
            accessToken = null; baseGmail = null; currentAlias = null;
            if (checkInterval) clearInterval(checkInterval); if (tokenRefreshTimer) clearTimeout(tokenRefreshTimer);
            localStorage.removeItem('gAccessToken'); localStorage.removeItem('gTokenExpiry');
            document.getElementById('mainSection').classList.remove('visible'); document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('sessionTag').style.display = 'none'; hideReauthBanner();
            document.getElementById('inboxContainer').innerHTML = `<div class="empty-state"><span>Awaiting incoming codes...</span></div>`;
        }

        window.addEventListener('load', () => {
            const savedToken = localStorage.getItem('gAccessToken'); const savedExpiry = localStorage.getItem('gTokenExpiry'); const savedEmail = localStorage.getItem('gBaseEmail');
            if (!savedEmail) return;
            baseGmail = savedEmail; document.getElementById('userEmail').innerText = baseGmail;
            const now = Date.now(); const expiryMs = savedExpiry ? parseInt(savedExpiry) : 0; const secondsLeft = Math.floor((expiryMs - now) / 1000);

            if (savedToken && secondsLeft > 60) {
                accessToken = savedToken; document.getElementById('loginSection').style.display = 'none'; document.getElementById('mainSection').classList.add('visible'); document.getElementById('sessionTag').style.display = 'inline-flex';
                scheduleTokenRefresh(secondsLeft - 300); generateNewAlias();
            } else {
                document.getElementById('loginSection').style.display = 'none'; document.getElementById('mainSection').classList.add('visible'); document.getElementById('sessionTag').style.display = 'inline-flex';
                try {
                    const client = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, prompt: '', login_hint: savedEmail,
                        callback: (response) => {
                            if (response.error) { accessToken = null; showReauthBanner(); generateNewAlias(); return; }
                            accessToken = response.access_token; const expiry = Date.now() + (response.expires_in * 1000);
                            localStorage.setItem('gAccessToken', accessToken); localStorage.setItem('gTokenExpiry', expiry.toString());
                            scheduleTokenRefresh(response.expires_in - 300); hideReauthBanner(); generateNewAlias();
                        }
                    });
                    client.requestAccessToken();
                } catch(e) { accessToken = null; showReauthBanner(); generateNewAlias(); }
            }
        });

        function generateSuffix(length = 6) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789'; let result = '';
            for (let i = 0; i < length; i++) { result += chars.charAt(Math.floor(Math.random() * chars.length)); }
            return result;
        }
        function generateNewAlias() {
            if (!baseGmail) return;
            if (checkInterval) clearInterval(checkInterval); knownMessageIds.clear();
            clearAliasTimer();
            currentSuffix = generateSuffix();
            const localPart = baseGmail.split('@')[0]; const domain = baseGmail.split('@')[1];
            currentAlias = `${localPart}+${currentSuffix}@${domain}`;
            const display = document.getElementById('emailDisplay'); display.innerText = currentAlias; display.classList.remove('loading');
            document.getElementById('inboxContainer').innerHTML = `<div class="empty-state"><span>Awaiting incoming codes...</span></div>`;
            document.getElementById('scanStatus').innerText = 'Scanning'; document.getElementById('radarDot').style.background = 'var(--accent)';
            checkInterval = setInterval(checkInbox, 5000);

        async function checkInbox() {
            if (!accessToken || !currentSuffix) return;
            try {
                const query = encodeURIComponent(`to:${currentAlias}`);
                const res = await fetch(`https://www.googleapis.com/gmail/v1/users/me/messages?q=${query}&maxResults=10`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
                if (res.status === 401) { document.getElementById('scanStatus').innerText = 'Re-login needed'; document.getElementById('radarDot').style.background = '#ef4444'; clearInterval(checkInterval); doSilentRefresh(); return; }
                const data = await res.json(); const messages = data.messages || [];
                for (const msg of messages) { if (!knownMessageIds.has(msg.id)) { knownMessageIds.add(msg.id); fetchMessageDetails(msg.id); } }
            } catch(e) {}
        }

        function isVerificationEmail(subject, bodyText) {
            const fullText = (subject + ' ' + bodyText).toLowerCase();
            const blockPatterns = [ /welcome\s+to\b/i, /welcome\s+aboard/i, /account\s+(has\s+been\s+)?(created|registered|activated|confirmed)/i, /you('ve|re| have)\s+(successfully\s+)?(signed\s+up|registered|joined|created)/i, /thanks?\s+for\s+(joining|signing\s+up|registering|creating)/i, /your\s+account\s+is\s+(ready|active|set\s+up)/i, /get\s+started\s+with/i, /start\s+exploring/i, /unsubscribe/i, /newsletter/i, /\bsale\b.*\b(off|discount|deal)\b/i, /\b(limited\s+time|exclusive\s+offer|special\s+offer|flash\s+sale)\b/i, /you\s+might\s+also\s+like/i, /recommended\s+for\s+you/i, /\bpromo\s+code\b/i, /\b(someone\s+liked|commented\s+on|mentioned\s+you|new\s+follower)\b/i, /\bweekly\s+(digest|summary|report)\b/i, /\bmonthly\s+(digest|summary|report)\b/i, ];
            for (const pattern of blockPatterns) { if (pattern.test(fullText)) return false; }
            const hasNumericCode = /\b\d{4,8}\b/.test(fullText);
            const hasAlphanumericCode = /\b[a-z0-9]{5,12}\b/i.test(fullText) && /(?:code|token|otp|pin|verify|confirmation|secret|key)/i.test(fullText);
            const hasLetterCode = /\b[a-z]{5,10}\b/i.test(fullText) && /(?:code|token|otp|verify|confirmation|secret|key)/i.test(fullText);
            const hasLoginLink = /https?:\/\/[^\s"'<>]+(?:verify|confirm|activate|login|signin|auth|magic|token|access)[^\s"'<>]*/i.test(bodyText);
            const hasVerificationSubject = /(?:verify|verification|confirm|otp|one.time|passcode|login\s+code|sign.in\s+code|access\s+code|security\s+code|your\s+code)/i.test(subject);
            return hasNumericCode || hasAlphanumericCode || hasLetterCode || hasLoginLink || hasVerificationSubject;
        }

        async function fetchMessageDetails(msgId) {
            try {
                const res = await fetch(`https://www.googleapis.com/gmail/v1/users/me/messages/${msgId}?format=full`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
                const msgData = await res.json();
                const headers = msgData.payload.headers || [];
                const fromHeader = headers.find(h => h.name === 'From') || {}; const subjectHeader = headers.find(h => h.name === 'Subject') || {};
                const fromRaw = fromHeader.value || 'Unknown'; const subject = subjectHeader.value || '';
                let bodyText = '';
                function extractBody(part) {
                    if (part.mimeType === 'text/plain' && part.body && part.body.data) { bodyText += atob(part.body.data.replace(/-/g, '+').replace(/_/g, '/')); }
                    if (part.mimeType === 'text/html' && part.body && part.body.data && !bodyText) { const html = atob(part.body.data.replace(/-/g, '+').replace(/_/g, '/')); bodyText += html.replace(/<[^>]*>/g, ' '); }
                    if (part.parts) part.parts.forEach(extractBody);
                }
                if (msgData.payload.parts) { msgData.payload.parts.forEach(extractBody); } else if (msgData.payload.body && msgData.payload.body.data) { bodyText = atob(msgData.payload.body.data.replace(/-/g, '+').replace(/_/g, '/')); }
                if (!isVerificationEmail(subject, bodyText)) { return; }
                const site = detectSite(fromRaw);
                if (document.querySelector('.empty-state')) { document.getElementById('inboxContainer').innerHTML = ''; }
                const fullText = subject + ' ' + bodyText; const extractedCode = extractCode(fullText); const extractedLink = extractLoginLink(bodyText);
                const senderName = fromRaw.replace(/<.*>/, '').trim() || fromRaw.split('@')[0];
                const inbox = document.getElementById('inboxContainer'); const msgEl = document.createElement('div'); msgEl.className = 'message';
                let html = `<div class="msg-sender">${escapeHtml(senderName)}</div>`;

                if (extractedCode) {
                    html += `<div class="extracted-code" onclick="copyCode('${escapeHtml(extractedCode)}')">${escapeHtml(extractedCode)}</div>`;
                    const doCopy = (code, siteId) => {
                        navigator.clipboard.writeText(code).then(() => {
                            playCopyCode(); showToast('Code Auto-Copied!', '⚡');
                            if (siteId === 'nana') { playNanaSound(); triggerSiteReady('nana'); } else if (siteId === 'v03') { playV03Sound(); triggerSiteReady('v03'); } else { playNanaSound(); triggerSiteReady('nana'); triggerSiteReady('v03'); }
                        }).catch(() => { pendingAutoCopyCode = code; pendingAutoCopySite = siteId; });
                    };
                    if (document.visibilityState === 'visible') { doCopy(extractedCode, site); } else {
                        pendingAutoCopyCode = extractedCode; pendingAutoCopySite = site;
                        if (site === 'nana') { playNanaSound(); triggerSiteReady('nana'); } else if (site === 'v03') { playV03Sound(); triggerSiteReady('v03'); } else { playNanaSound(); triggerSiteReady('nana'); triggerSiteReady('v03'); }
                    }
                    if (window._autoRotateTimer) clearTimeout(window._autoRotateTimer);
                    if (window._autoRotateInterval) clearInterval(window._autoRotateInterval);
                    startAliasTimer();
                } else if (extractedLink) {
                    html += `<div class="link-block"><span style="font-size:11px;color:var(--text-secondary);display:block;margin-bottom:6px;">Login Link</span><a href="${escapeHtml(extractedLink)}" target="_blank" rel="noopener noreferrer" class="login-link-btn"><i class="fa-solid fa-arrow-up-right-from-square" style="font-size:12px;"></i> Open Login Link</a></div>`;
                } else { html += `<div style="font-size: 11px; color: var(--text-secondary); padding: 4px;">Code not found — check Gmail</div>`; }
                msgEl.innerHTML = html; inbox.prepend(msgEl);
                if (site === 'nana') { playNanaSound(); } else if (site === 'v03') { playV03Sound(); } else { playIncomingEmail(); }
            } catch(e) {}
        }

        function extractLoginLink(bodyText) { const linkPattern = /https?:\/\/[^\s"'<>]+(?:verify|confirm|activate|login|signin|auth|magic|token|access|click)[^\s"'<>]*/i; const match = bodyText.match(linkPattern); return match ? match[0] : null; }

        const ALIAS_TIMER_SECONDS = 120;
        function startAliasTimer() {
            clearAliasTimer();
            const row = document.getElementById('timerRow');
            const fill = document.getElementById('timerBarFill');
            const label = document.getElementById('timerLabel');
            if (row) row.style.display = 'flex';
            let remaining = ALIAS_TIMER_SECONDS;
            function updateTimer() {
                if (!fill || !label) return;
                const pct = (remaining / ALIAS_TIMER_SECONDS) * 100;
                fill.style.width = pct + '%';
                fill.classList.toggle('warning', remaining <= 30);
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                label.textContent = m + ':' + String(s).padStart(2, '0');
            }
            updateTimer();
            window._autoRotateInterval = setInterval(() => {
                remaining--;
                updateTimer();
                if (remaining <= 0) {
                    clearAliasTimer();
                    showToast('New alias generated ↻', '🔄');
                    generateNewAlias();
                }
            }, 1000);
        }
        function clearAliasTimer() {
            if (window._autoRotateTimer) { clearTimeout(window._autoRotateTimer); window._autoRotateTimer = null; }
            if (window._autoRotateInterval) { clearInterval(window._autoRotateInterval); window._autoRotateInterval = null; }
            const row = document.getElementById('timerRow');
            if (row) row.style.display = 'none';
        }
        function extractCode(text) {
            const patterns = [ /(?:verification|confirm|code|OTP|PIN|passcode|secret)[^\d]*(\d{4,8})/i, /(\d{4,8})(?:[^\d]|$).*(?:verification|confirm|code)/i, /(?:code|token|otp|key)[^\w]*([a-z0-9]{5,12})/i, /\b(\d{6})\b/, /\b(\d{4,8})\b/, ];
            for (const pattern of patterns) { const match = text.match(pattern); if (match) { const code = match[1] || match[0]; const num = parseInt(code); if (num >= 1000 && num <= 99999999 && !(num >= 2020 && num <= 2030)) { return code; } } } return null;
        }

        async function forceRefresh() { const btn = document.getElementById('refreshBtn'); btn.classList.add('spin'); await checkInbox(); setTimeout(() => btn.classList.remove('spin'), 600); }
        function copyEmail() {
            if (currentAlias) { playEmailClick(); navigator.clipboard.writeText(currentAlias).then(() => { showToast('Email Copied!', '✓'); const icon = document.getElementById('copyIcon'); icon.className = 'fa-solid fa-check'; setTimeout(() => icon.className = 'fa-regular fa-copy', 1500); }); }
        }
        function copyCode(code) { playCopyCode(); navigator.clipboard.writeText(code).then(() => { showToast('Code Copied!', '⚡'); if (lastCodeSite) triggerSiteReady(lastCodeSite); }); }
        function showToast(msg, icon = '✓') { const toast = document.getElementById('toast'); const toastMsg = document.getElementById('toastMsg'); const toastIcon = document.getElementById('toastIcon'); toastMsg.innerText = msg; toastIcon.innerText = icon; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800); }
        function escapeHtml(text) { return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    </script>
</body>
</html>
