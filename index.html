<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusMail</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='4' width='20' height='16' rx='2'/><path d='M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'/></svg>"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #16161f;
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(99,102,241,0.4);
            --text: #e2e8f0;
            --muted: #64748b;
            --accent: #6366f1;
            --accent-dim: rgba(99,102,241,0.12);
            --accent-glow: rgba(99,102,241,0.2);
            --green: #22c55e;
            --red: #ef4444;
            --radius: 14px;
            --radius-sm: 8px;
        }

        [data-theme="light"] {
            --bg: #f4f4f8;
            --surface: #ffffff;
            --surface2: #f8f8fc;
            --border: rgba(0,0,0,0.07);
            --border-hover: rgba(99,102,241,0.4);
            --text: #0f172a;
            --muted: #94a3b8;
            --accent: #4f46e5;
            --accent-dim: rgba(79,70,229,0.08);
            --accent-glow: rgba(79,70,229,0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background 0.3s, color 0.3s;
        }

        .app {
            width: 100%;
            max-width: 420px;
        }

        /* ── HEADER ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .logo-dot {
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .header-actions { display: flex; gap: 6px; }

        .icon-btn {
            width: 34px; height: 34px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--muted);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            transition: all 0.15s;
        }
        .icon-btn:hover { color: var(--text); border-color: var(--border-hover); }

        /* ── CARD ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ── LOGIN ── */
        .login-view {
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .login-icon-wrap {
            width: 56px; height: 56px;
            background: var(--accent-dim);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            color: var(--accent);
        }

        .login-title {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
        }

        .login-sub {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            line-height: 1.7;
            margin-top: -10px;
        }

        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 11px 20px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .google-btn:hover {
            border-color: var(--border-hover);
            background: var(--accent-dim);
        }
        .google-btn:active { transform: scale(0.98); }

        .g-icon { width: 18px; height: 18px; }

        /* ── STATUS BAR ── */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--muted);
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse-dot 2s infinite;
        }
        .status-dot.inactive { background: var(--red); animation: none; }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; box-shadow: 0 0 6px var(--green); }
        }

        .logout-link {
            font-size: 11px;
            color: var(--muted);
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.15s;
        }
        .logout-link:hover { color: var(--red); }

        /* ── EMAIL ROW ── */
        .email-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 10px 10px 14px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .email-row:hover { border-color: var(--border-hover); }
        .email-row:active { transform: scale(0.99); }

        .email-addr {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .email-addr.loading { color: var(--muted); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0%,100%{opacity:.4} 50%{opacity:1} }

        .copy-btn-inner {
            width: 32px; height: 32px;
            background: var(--border);
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            color: var(--muted);
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .email-row:hover .copy-btn-inner {
            background: var(--accent);
            color: #fff;
        }

        /* ── ACTIONS ── */
        .actions { display: flex; gap: 8px; }

        .action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .action-btn:hover { border-color: var(--border-hover); background: var(--accent-dim); }
        .action-btn:active { transform: scale(0.97); }
        .action-btn i { font-size: 12px; color: var(--muted); }
        .action-btn.spinning i { animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── DIVIDER ── */
        .section-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted);
        }

        .scan-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 9px;
        }

        .scan-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse-dot 2s infinite;
        }

        /* ── INBOX ── */
        .inbox {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 70px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .inbox::-webkit-scrollbar { width: 3px; }
        .inbox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 70px;
            font-size: 12px;
            color: var(--muted);
            gap: 7px;
        }

        .msg-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: slide-in 0.25s ease;
        }
        @keyframes slide-in {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg-from {
            font-size: 10px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .code-pill {
            background: var(--accent-dim);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 10px;
            padding: 10px 16px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 10px;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }
        .code-pill:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow);
            letter-spacing: 8px;
        }
        .code-pill:active { transform: scale(0.97); }

        .no-code {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            padding: 4px 0;
        }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: var(--text);
            color: var(--bg);
            font-size: 12px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s, transform 0.18s;
            white-space: nowrap;
            z-index: 999;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── TOKEN EXPIRY WARNING ── */
        .token-warning {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: var(--radius);
            font-size: 12px;
            color: #f87171;
        }
        .token-warning.visible { display: flex; }
        .reauth-btn {
            margin-left: auto;
            background: rgba(239,68,68,0.15);
            border: none;
            color: #f87171;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .reauth-btn:hover { background: rgba(239,68,68,0.3); }
    </style>
</head>
<body data-theme="dark">

<div id="toast"></div>

<div class="app">

    <div class="header">
        <div class="logo">
            <div class="logo-dot"></div>
            NexusMail
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme" id="themeBtn">
                <i class="fa-regular fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </div>

    <div class="card">

        <!-- LOGIN VIEW -->
        <div class="login-view" id="loginView">
            <div class="login-icon-wrap">
                <i class="fa-regular fa-envelope"></i>
            </div>
            <div>
                <div class="login-title">Sign in to continue</div>
                <div class="login-sub">Connect your Gmail to receive<br>verification codes automatically.</div>
            </div>
            <button class="google-btn" onclick="startLogin()">
                <svg class="g-icon" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
        </div>

        <!-- MAIN VIEW -->
        <div id="mainView" style="display:none;">

            <div class="status-bar">
                <div class="status-left">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusEmail">—</span>
                </div>
                <button class="logout-link" onclick="logout()">Sign out</button>
            </div>

            <div class="card-body">

                <!-- Token warning -->
                <div class="token-warning" id="tokenWarning">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size:12px;"></i>
                    Session expired
                    <button class="reauth-btn" onclick="silentRefresh()">Refresh</button>
                </div>

                <!-- Email address -->
                <div class="email-row" onclick="copyEmail()" title="Click to copy">
                    <div class="email-addr loading" id="emailDisplay">Generating...</div>
                    <div class="copy-btn-inner" id="copyInner">
                        <i class="fa-regular fa-copy" id="copyIcon"></i>
                    </div>
                </div>

                <!-- Actions -->
                <div class="actions">
                    <button class="action-btn" id="refreshBtn" onclick="doRefresh()">
                        <i class="fa-solid fa-rotate-right"></i> Refresh
                    </button>
                    <button class="action-btn" onclick="newEmail()">
                        <i class="fa-solid fa-plus"></i> New Email
                    </button>
                </div>

                <!-- Inbox -->
                <div class="section-label">
                    <span>Verification Codes</span>
                    <div class="scan-indicator">
                        <div class="scan-dot" id="scanDot"></div>
                        <span id="scanText">Scanning</span>
                    </div>
                </div>

                <div class="inbox" id="inbox">
                    <div class="empty-state">
                        <i class="fa-regular fa-clock"></i>
                        Awaiting emails...
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<script>
// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const CLIENT_ID = '159808029273-ml37999iis48lr4ev5m2u9vesj62fouv.apps.googleusercontent.com';
const SCOPES    = 'https://www.googleapis.com/auth/gmail.readonly';

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let accessToken   = null;
let tokenExpiry   = 0;
let baseGmail     = null;
let currentAlias  = null;
let currentSuffix = null;
let pollTimer     = null;
let refreshTimer  = null;
let knownIds      = new Set();
let firstCopied   = false;
let tokenClient   = null;

// ═══════════════════════════════════════
// THEME
// ═══════════════════════════════════════
function toggleTheme() {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeIcon').className = isDark ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
}
(function initTheme() {
    const t = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', t);
    document.getElementById('themeIcon').className = t === 'dark' ? 'fa-regular fa-moon' : 'fa-regular fa-sun';
})();

// ═══════════════════════════════════════
// SOUND (Web Audio API — no external files)
// ═══════════════════════════════════════
function playNotification() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Two-tone soft chime
        const notes = [
            { freq: 880, start: 0,    dur: 0.12, vol: 0.18 },
            { freq: 1320, start: 0.1, dur: 0.18, vol: 0.12 },
        ];

        notes.forEach(n => {
            const osc  = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.value = n.freq;
            gain.gain.setValueAtTime(0, ctx.currentTime + n.start);
            gain.gain.linearRampToValueAtTime(n.vol, ctx.currentTime + n.start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.start + n.dur);
            osc.start(ctx.currentTime + n.start);
            osc.stop(ctx.currentTime + n.start + n.dur + 0.05);
        });
    } catch(e) {}
}

// ═══════════════════════════════════════
// AUTH
// ═══════════════════════════════════════
function initTokenClient() {
    if (tokenClient) return;
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        prompt: '',
        callback: handleTokenResponse
    });
}

function handleTokenResponse(resp) {
    if (resp.error) {
        // If silent refresh fails, show warning
        document.getElementById('tokenWarning').classList.add('visible');
        setStatus(false);
        return;
    }
    accessToken = resp.access_token;
    tokenExpiry = Date.now() + (resp.expires_in - 60) * 1000; // 60s buffer
    localStorage.setItem('gToken',  accessToken);
    localStorage.setItem('gExpiry', tokenExpiry);
    document.getElementById('tokenWarning').classList.remove('visible');
    scheduleTokenRefresh();
}

function startLogin() {
    // First time — show account picker
    const tc = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        prompt: 'select_account',
        callback: async (resp) => {
            if (resp.error) { showToast('Login cancelled'); return; }
            accessToken = resp.access_token;
            tokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
            localStorage.setItem('gToken',  accessToken);
            localStorage.setItem('gExpiry', tokenExpiry);
            await fetchProfile();
            initTokenClient();
            scheduleTokenRefresh();
        }
    });
    tc.requestAccessToken({ prompt: 'select_account' });
}

function silentRefresh() {
    if (!tokenClient) initTokenClient();
    tokenClient.requestAccessToken({ prompt: '' });
}

function scheduleTokenRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    const msUntilExpiry = tokenExpiry - Date.now();
    if (msUntilExpiry > 0) {
        refreshTimer = setTimeout(() => {
            silentRefresh();
        }, msUntilExpiry);
    }
}

async function fetchProfile() {
    try {
        const r = await fetch('https://www.googleapis.com/gmail/v1/users/me/profile', {
            headers: { Authorization: `Bearer ${accessToken}` }
        });
        const d = await r.json();
        baseGmail = d.emailAddress;
        localStorage.setItem('gEmail', baseGmail);
        document.getElementById('statusEmail').innerText = baseGmail;
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('mainView').style.display  = 'block';
        setStatus(true);
        newEmail();
    } catch(e) {
        showToast('Profile error');
    }
}

function logout() {
    clearInterval(pollTimer);
    clearTimeout(refreshTimer);
    accessToken = tokenClient = null;
    localStorage.removeItem('gToken');
    localStorage.removeItem('gExpiry');
    localStorage.removeItem('gEmail');
    document.getElementById('mainView').style.display  = 'none';
    document.getElementById('loginView').style.display = 'flex';
    document.getElementById('inbox').innerHTML = emptyState();
}

// ═══════════════════════════════════════
// AUTO-RESTORE SESSION ON LOAD
// ═══════════════════════════════════════
window.addEventListener('load', () => {
    const tok    = localStorage.getItem('gToken');
    const expiry = parseInt(localStorage.getItem('gExpiry') || '0');
    const email  = localStorage.getItem('gEmail');

    if (tok && email && Date.now() < expiry) {
        accessToken = tok;
        tokenExpiry = expiry;
        baseGmail   = email;
        document.getElementById('statusEmail').innerText = email;
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('mainView').style.display  = 'block';
        setStatus(true);
        initTokenClient();
        scheduleTokenRefresh();
        newEmail();
    }
});

// ═══════════════════════════════════════
// EMAIL / ALIAS
// ═══════════════════════════════════════
function randStr(n = 6) {
    const c = 'abcdefghijklmnopqrstuvwxyz0123456789';
    return Array.from({length: n}, () => c[Math.random()*c.length|0]).join('');
}

function newEmail() {
    if (!baseGmail) return;
    clearInterval(pollTimer);
    knownIds.clear();
    firstCopied = false;

    currentSuffix = randStr(6);
    const [local, domain] = baseGmail.split('@');
    currentAlias = `${local}+${currentSuffix}@${domain}`;

    const el = document.getElementById('emailDisplay');
    el.innerText = currentAlias;
    el.classList.remove('loading');

    document.getElementById('inbox').innerHTML = emptyState();
    document.getElementById('scanText').innerText = 'Scanning';

    pollTimer = setInterval(poll, 5000);
}

// ═══════════════════════════════════════
// POLLING
// ═══════════════════════════════════════
async function poll() {
    if (!accessToken || !currentAlias) return;

    // Check token expiry
    if (Date.now() > tokenExpiry) {
        silentRefresh();
        return;
    }

    try {
        const q   = encodeURIComponent(`to:${currentAlias}`);
        const res = await fetch(
            `https://www.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=15`,
            { headers: { Authorization: `Bearer ${accessToken}` } }
        );

        if (res.status === 401) { silentRefresh(); return; }

        const data = await res.json();
        for (const m of (data.messages || [])) {
            if (!knownIds.has(m.id)) {
                knownIds.add(m.id);
                if (document.querySelector('.empty-state')) {
                    document.getElementById('inbox').innerHTML = '';
                }
                fetchMsg(m.id);
            }
        }
    } catch(e) {}
}

async function fetchMsg(id) {
    try {
        const res = await fetch(
            `https://www.googleapis.com/gmail/v1/users/me/messages/${id}?format=full`,
            { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const msg = await res.json();

        const hdrs    = msg.payload.headers || [];
        const from    = (hdrs.find(h => h.name === 'From') || {}).value || '';
        const subject = (hdrs.find(h => h.name === 'Subject') || {}).value || '';

        let body = '';
        function extractBody(p) {
            if (p.mimeType === 'text/plain' && p.body?.data)
                body += atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/'));
            else if (p.mimeType === 'text/html' && p.body?.data && !body)
                body += atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/')).replace(/<[^>]*>/g,' ');
            if (p.parts) p.parts.forEach(extractBody);
        }
        if (msg.payload.parts) msg.payload.parts.forEach(extractBody);
        else if (msg.payload.body?.data)
            body = atob(msg.payload.body.data.replace(/-/g,'+').replace(/_/g,'/'));

        const fullText = subject + ' ' + body;
        const code     = extractCode(fullText);
        const sender   = from.replace(/<.*>/,'').trim() || from.split('@')[0];

        renderMsg(sender, code);

        if (code && !firstCopied) {
            firstCopied = true;
            navigator.clipboard.writeText(code).catch(()=>{});
            showToast('Code copied!');
            playNotification();
        }
    } catch(e) {}
}

// ═══════════════════════════════════════
// CODE EXTRACTION
// ═══════════════════════════════════════
function extractCode(text) {
    const patterns = [
        /(?:verification|confirm|code|otp|pin)[^\d]*(\d{4,8})/i,
        /(\d{4,8})(?:[^\d]|$).*(?:verification|confirm|code|otp|pin)/i,
        /\b(\d{6})\b/,
        /\b(\d{4,8})\b/,
    ];
    for (const p of patterns) {
        const m = text.match(p);
        if (m) {
            const code = m[1] || m[0];
            const n    = parseInt(code);
            if (n >= 1000 && n <= 99999999 && !(n >= 2020 && n <= 2030)) return code;
        }
    }
    return null;
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function renderMsg(sender, code) {
    const inbox = document.getElementById('inbox');
    const card  = document.createElement('div');
    card.className = 'msg-card';

    let html = `<div class="msg-from">${esc(sender)}</div>`;
    if (code) {
        html += `<div class="code-pill" onclick="copyCode('${code}')" title="Click to copy">${code}</div>`;
    } else {
        html += `<div class="no-code">No code detected — check Gmail</div>`;
    }
    card.innerHTML = html;
    inbox.prepend(card);
}

function emptyState() {
    return `<div class="empty-state"><i class="fa-regular fa-clock"></i> Awaiting emails...</div>`;
}

// ═══════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════
async function doRefresh() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    await poll();
    setTimeout(() => btn.classList.remove('spinning'), 600);
}

function copyEmail() {
    if (!currentAlias) return;
    navigator.clipboard.writeText(currentAlias).then(() => {
        showToast('Email copied!');
        const icon = document.getElementById('copyIcon');
        icon.className = 'fa-solid fa-check';
        setTimeout(() => icon.className = 'fa-regular fa-copy', 1400);
    });
}

function copyCode(code) {
    navigator.clipboard.writeText(code).then(() => showToast('Code copied!'));
}

function setStatus(ok) {
    document.getElementById('statusDot').className = ok ? 'status-dot' : 'status-dot inactive';
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
}

function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
