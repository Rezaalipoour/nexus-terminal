<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus | Inbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { --bg: #09090b; --card: rgba(24, 24, 27, 0.7); --accent: #6366f1; --text: #f8fafc; }
        body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .bg-grid { position: fixed; inset: 0; z-index: -1; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px; filter: blur(1px); }
        .card { background: var(--card); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; padding: 32px; width: 400px; backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .email-box { background: rgba(0,0,0,0.2); padding: 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); margin: 20px 0; }
        .code-res { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 16px; text-align: center; color: var(--accent); font-size: 32px; font-weight: 800; letter-spacing: 6px; cursor: pointer; }
        button { cursor: pointer; background: var(--accent); border: none; color: white; padding: 12px 20px; border-radius: 12px; font-weight: 500; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="card">
        <div style="display:flex; justify-content:space-between;"><h3>Nexus<span>Mail</span></h3><button onclick="logout()" style="background:transparent"><i class="fa-solid fa-power-off"></i></button></div>
        <div id="loginSection"><button onclick="startGoogleLogin()">Login with Google</button></div>
        <div id="mainSection" style="display:none;">
            <div class="email-box" onclick="copyEmail()"><span id="emailDisplay"></span><i class="fa-regular fa-copy"></i></div>
            <div id="inboxContainer"></div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '159808029273-ml37999iis48lr4ev5m2u9vesj62fouv.apps.googleusercontent.com';
        
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = type === 'code' ? 600 : 300;
            gain.gain.exponentialRampToValueAtTime(0.05, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
        }

        async function startGoogleLogin() {
            const client = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/gmail.readonly',
                callback: (res) => {
                    localStorage.setItem('gToken', res.access_token);
                    localStorage.setItem('gExpiry', Date.now() + (res.expires_in * 1000));
                    initApp(res.access_token);
                }
            });
            client.requestAccessToken();
        }

        async function initApp(token) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainSection').style.display = 'block';
            const res = await fetch('https://www.googleapis.com/gmail/v1/users/me/profile', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            const alias = data.emailAddress.replace('@', `+${Math.random().toString(36).substring(7)}@`);
            document.getElementById('emailDisplay').innerText = alias;
            setInterval(() => checkInbox(token, alias), 5000);
        }

        async function checkInbox(token, alias) {
            const res = await fetch(`https://www.googleapis.com/gmail/v1/users/me/messages?q=to:${alias}`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if(data.messages?.length > 0) {
                const msg = await fetch(`https://www.googleapis.com/gmail/v1/users/me/messages/${data.messages[0].id}`, { headers: { 'Authorization': `Bearer ${token}` } });
                const detail = await msg.json();
                const text = atob(detail.payload.body.data.replace(/-/g, '+').replace(/_/g, '/'));
                const match = text.match(/\b\d{4,8}\b/);
                if(match) {
                    playSound('code');
                    document.getElementById('inboxContainer').innerHTML = `<div class="code-res" onclick="copyCode('${match[0]}')">${match[0]}</div>`;
                }
            }
        }

        function copyEmail() { playSound('click'); navigator.clipboard.writeText(document.getElementById('emailDisplay').innerText); }
        function copyCode(c) { playSound('click'); navigator.clipboard.writeText(c); }
        function logout() { localStorage.clear(); location.reload(); }
        
        window.onload = () => { 
            const t = localStorage.getItem('gToken');
            const e = localStorage.getItem('gExpiry');
            if(t && Date.now() < e) initApp(t); 
        };
    </script>
</body>
</html>
