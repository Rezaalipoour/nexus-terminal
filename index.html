<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Gmail Mail</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --bg-body: #09090b;
            --card-bg: rgba(24, 24, 27, 0.65);
            --accent: #6366f1;
            --text-primary: #f8fafc;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            display: flex; justify-content: center; align-items: center;
        }

        /* پس‌زمینه شبکه محو */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(99, 102, 241, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .main-section { display: none; }
        .visible { display: flex; flex-direction: column; gap: 18px; }
        
        /* استایل‌های قبلی را اینجا حفظ کن، فقط موارد زیر را اضافه کن */
        .extracted-code {
            transition: all 0.2s ease;
        }
        .extracted-code:hover { transform: scale(1.02); }
    </style>
</head>
<body data-theme="dark">

    <div id="toast">Copied!</div>
    <div class="container" id="appContainer" style="opacity: 0;">
        <div class="card" id="mainCard">
            <div id="loginSection" class="login-section">...</div>
            <div id="mainSection" class="main-section">...</div>
        </div>
    </div>

    <script>
        // صداهای مدرن
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            
            if (type === 'copy') { // صدای نرم برای کپی
                osc.type = 'sine'; osc.frequency.value = 600;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            } else { // صدای مدرن برای رسیدن ایمیل
                osc.type = 'triangle'; osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            }
            osc.start(); osc.stop(ctx.currentTime + 0.2);
        }

        // اصلاح منطق لودینگ
        window.addEventListener('load', () => {
            const savedToken = localStorage.getItem('gAccessToken');
            if (savedToken) {
                // نمایش مستقیم بدون پرش
                document.getElementById('appContainer').style.opacity = '1';
                onLoginSuccess(); 
            } else {
                document.getElementById('appContainer').style.opacity = '1';
                document.getElementById('loginSection').style.display = 'flex';
            }
        });

        // بقیه توابع منطقی (login, checkInbox, etc) را اینجا قرار بده
        // در تابع fetchMessageDetails موقع رسیدن ایمیل:
        if (extractedCode) {
            playSound('email'); // صدا برای ایمیل جدید
            // ...
        }

        // در تابع copyText:
        function copyText(text, isCode = false) {
            navigator.clipboard.writeText(text).then(() => {
                if(isCode) playSound('copy'); // صدای نرم برای کپی کد
                showToast(isCode ? 'Code Copied!' : 'Email Copied!');
            });
        }
    </script>
</body>
</html>
