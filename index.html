<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusMail</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300e5ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='4' width='20' height='16' rx='2'/><path d='M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'/></svg>"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─────────────────────────────────────────
   TOKENS — DARK (default)
───────────────────────────────────────── */
:root {
  --c0: #000005;          /* true black bg */
  --c1: #080810;          /* surface */
  --c2: #0d0d18;          /* raised surface */
  --c3: #12121f;          /* hover surface */

  --cyan:       #00e5ff;
  --cyan-dim:   rgba(0, 229, 255, 0.08);
  --cyan-mid:   rgba(0, 229, 255, 0.18);
  --cyan-glow:  rgba(0, 229, 255, 0.30);
  --cyan-hard:  rgba(0, 229, 255, 0.55);

  --violet:     #7c3aed;
  --violet-dim: rgba(124, 58, 237, 0.12);

  --border:       rgba(0, 229, 255, 0.10);
  --border-hover: rgba(0, 229, 255, 0.38);
  --border-lit:   rgba(0, 229, 255, 0.65);

  --text:    #f0f4ff;
  --text-2:  #7a8aaa;
  --text-3:  #3a4460;

  --green:  #00ff88;
  --red:    #ff3366;

  --r:  14px;
  --rs: 9px;
}

/* ─────────────────────────────────────────
   TOKENS — LIGHT
───────────────────────────────────────── */
[data-theme="light"] {
  --c0: #f5f7ff;
  --c1: #ffffff;
  --c2: #f0f2fc;
  --c3: #e8ecf8;

  --cyan:       #0066ff;
  --cyan-dim:   rgba(0, 102, 255, 0.07);
  --cyan-mid:   rgba(0, 102, 255, 0.14);
  --cyan-glow:  rgba(0, 102, 255, 0.22);
  --cyan-hard:  rgba(0, 102, 255, 0.50);

  --violet:     #6d28d9;
  --violet-dim: rgba(109, 40, 217, 0.08);

  --border:       rgba(0, 102, 255, 0.12);
  --border-hover: rgba(0, 102, 255, 0.35);
  --border-lit:   rgba(0, 102, 255, 0.60);

  --text:   #06080f;
  --text-2: #5060a0;
  --text-3: #a0b0d0;

  --green:  #00b050;
  --red:    #e0102a;
}

/* ─────────────────────────────────────────
   BODY
───────────────────────────────────────── */
body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--c0);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: background 0.4s, color 0.3s;
  position: relative;
  overflow: hidden;
}

/* ── background grid ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 0;
}

[data-theme="light"] body::before {
  background-image:
    linear-gradient(rgba(0,102,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,102,255,0.04) 1px, transparent 1px);
}

/* ── glow orbs ── */
.bg-orb {
  position: fixed;
  pointer-events: none;
  border-radius: 50%;
  filter: blur(80px);
  z-index: 0;
}
.bg-orb-1 {
  width: 500px; height: 500px;
  top: -180px; left: 50%;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(0,229,255,0.07) 0%, transparent 70%);
}
.bg-orb-2 {
  width: 350px; height: 350px;
  bottom: -120px; right: -60px;
  background: radial-gradient(circle, rgba(124,58,237,0.09) 0%, transparent 70%);
}
[data-theme="light"] .bg-orb-1 {
  background: radial-gradient(circle, rgba(0,102,255,0.06) 0%, transparent 70%);
}
[data-theme="light"] .bg-orb-2 {
  background: radial-gradient(circle, rgba(109,40,217,0.06) 0%, transparent 70%);
}

/* ─────────────────────────────────────────
   APP SHELL
───────────────────────────────────────── */
.app {
  width: 100%;
  max-width: 400px;
  position: relative;
  z-index: 1;
}

/* ─────────────────────────────────────────
   HEADER
───────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding: 0 2px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-mark {
  position: relative;
  width: 32px; height: 32px;
}
.logo-mark svg {
  position: absolute;
  inset: 0;
}
.logo-name {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.6px;
  color: var(--text);
}
.logo-name span {
  color: var(--cyan);
}

.theme-btn {
  width: 36px; height: 36px;
  background: var(--c1);
  border: 1px solid var(--border);
  border-radius: var(--rs);
  color: var(--text-2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all 0.2s;
}
.theme-btn:hover {
  border-color: var(--border-hover);
  color: var(--cyan);
}

/* ─────────────────────────────────────────
   PANEL — main container
───────────────────────────────────────── */
.panel {
  background: var(--c1);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  /* top edge accent line */
  box-shadow:
    0 0 0 0.5px var(--border),
    0 20px 60px rgba(0,0,0,0.5),
    0 0 40px rgba(0,229,255,0.04) inset;
}

/* ── lit top border ── */
.panel::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan-hard), transparent);
  z-index: 2;
}

[data-theme="light"] .panel {
  box-shadow:
    0 0 0 0.5px var(--border),
    0 20px 60px rgba(0,50,150,0.08),
    0 0 40px rgba(0,102,255,0.03) inset;
}

/* ─────────────────────────────────────────
   LOGIN VIEW
───────────────────────────────────────── */
.login-view {
  padding: 44px 28px 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  text-align: center;
}

.login-icon {
  position: relative;
  width: 68px; height: 68px;
  display: flex; align-items: center; justify-content: center;
}

.login-icon::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 18px;
  background: var(--cyan-dim);
  border: 1px solid var(--border-hover);
}

.login-icon i {
  font-size: 26px;
  color: var(--cyan);
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 0 8px var(--cyan-glow));
}

.login-copy {}
.login-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
}
.login-sub {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.65;
}

.g-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 13px 20px;
  background: var(--c2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: -0.2px;
  position: relative;
  overflow: hidden;
}
.g-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--cyan-dim), transparent 60%);
  opacity: 0;
  transition: opacity 0.2s;
}
.g-btn:hover {
  border-color: var(--border-hover);
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3), 0 0 16px var(--cyan-glow);
}
.g-btn:hover::after { opacity: 1; }
.g-btn:active { transform: scale(0.98) translateY(0); }
.g-icon { width: 18px; height: 18px; position: relative; z-index: 1; }
.g-btn span { position: relative; z-index: 1; }

/* ─────────────────────────────────────────
   STATUS BAR
───────────────────────────────────────── */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--c2);
}

.s-left {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  color: var(--text-2);
  min-width: 0;
  font-family: 'JetBrains Mono', monospace;
}
#statusEmail {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 195px;
  font-size: 11px;
}

.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
  animation: live-pulse 2.5s infinite;
}
.live-dot.off { background: var(--red); animation: none; }

@keyframes live-pulse {
  0%, 100% { opacity: 0.5; box-shadow: none; }
  50% { opacity: 1; box-shadow: 0 0 0 3px rgba(0,255,136,0.2); }
}

.signout-btn {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-3);
  background: none;
  border: none;
  cursor: pointer;
  transition: color 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
  letter-spacing: 0.2px;
}
.signout-btn:hover { color: var(--red); }

/* ─────────────────────────────────────────
   MAIN BODY
───────────────────────────────────────── */
.main-body {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 13px;
}

/* ─────────────────────────────────────────
   EMAIL DISPLAY
───────────────────────────────────────── */
.email-display {
  background: var(--c2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 4px 4px 4px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.email-display::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 2px;
  background: var(--cyan);
  border-radius: 2px;
  box-shadow: 0 0 6px var(--cyan-glow);
  transition: opacity 0.2s;
  opacity: 0.7;
}

.email-display:hover {
  border-color: var(--border-hover);
  background: var(--c3);
}
.email-display:hover::before { opacity: 1; }
.email-display:active { transform: scale(0.995); }

.email-text {
  flex: 1;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  font-weight: 400;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  letter-spacing: -0.2px;
}
.email-text.loading {
  color: var(--text-3);
  animation: blink 1.4s infinite;
}
@keyframes blink { 0%,100%{opacity:.3} 50%{opacity:.8} }

.copy-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--cyan-dim);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  color: var(--cyan);
  flex-shrink: 0;
  transition: all 0.2s;
}
.email-display:hover .copy-btn {
  background: var(--cyan);
  color: #000;
  border-color: var(--cyan);
  box-shadow: 0 0 14px var(--cyan-glow);
}

/* ─────────────────────────────────────────
   ACTION BUTTONS
───────────────────────────────────────── */
.actions { display: flex; gap: 8px; }

.act-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 11px;
  background: var(--c2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text-2);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: -0.2px;
  position: relative;
  overflow: hidden;
}
.act-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--cyan-dim);
  opacity: 0;
  transition: opacity 0.2s;
}
.act-btn:hover {
  border-color: var(--border-hover);
  color: var(--text);
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}
.act-btn:hover::after { opacity: 1; }
.act-btn:active { transform: scale(0.97) translateY(0); }
.act-btn i { font-size: 12px; color: var(--cyan); position: relative; z-index: 1; }
.act-btn span { position: relative; z-index: 1; }
.act-btn.spinning i { animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─────────────────────────────────────────
   INBOX SECTION
───────────────────────────────────────── */
.inbox-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.inbox-label {
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.8px;
  color: var(--text-3);
}

.scan-status {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 9.5px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  color: var(--cyan);
  letter-spacing: 0.5px;
}

.scan-pip {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--cyan);
  animation: pip 2s infinite;
}
@keyframes pip {
  0%,100%{ opacity:0.4; }
  50%{ opacity:1; box-shadow: 0 0 6px var(--cyan); }
}

/* ─────────────────────────────────────────
   INBOX LIST
───────────────────────────────────────── */
.inbox {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 72px;
  max-height: 240px;
  overflow-y: auto;
}
.inbox::-webkit-scrollbar { width: 2px; }
.inbox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.empty {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--text-3);
  gap: 7px;
  font-family: 'JetBrains Mono', monospace;
}

/* ─────────────────────────────────────────
   MESSAGE CARD
───────────────────────────────────────── */
.msg {
  background: var(--c2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 13px 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: appear 0.3s cubic-bezier(0.16,1,0.3,1);
  position: relative;
  overflow: hidden;
}
.msg::before {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--cyan), transparent);
  opacity: 0.5;
}

@keyframes appear {
  from { opacity:0; transform: translateY(-6px); }
  to   { opacity:1; transform: translateY(0); }
}

.msg-sender {
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-3);
  padding-left: 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.code-block {
  background: var(--c0);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 32px;
  font-weight: 500;
  letter-spacing: 12px;
  color: var(--cyan);
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
  text-shadow: 0 0 20px var(--cyan-glow);
  position: relative;
  overflow: hidden;
}
.code-block::before {
  content: 'TAP TO COPY';
  position: absolute;
  inset: 0;
  background: var(--cyan);
  color: #000;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}
.code-block:hover::before { opacity: 1; }
.code-block:hover {
  border-color: var(--cyan);
  box-shadow: 0 0 30px var(--cyan-glow), 0 0 60px rgba(0,229,255,0.1);
}
.code-block:active { transform: scale(0.98); }

.no-code {
  font-size: 11.5px;
  color: var(--text-3);
  text-align: center;
  padding: 4px 0;
  font-family: 'JetBrains Mono', monospace;
}

/* ─────────────────────────────────────────
   TOKEN WARNING
───────────────────────────────────────── */
.token-warn {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 10px 13px;
  background: rgba(255,51,102,0.07);
  border: 1px solid rgba(255,51,102,0.2);
  border-radius: var(--r);
  font-size: 12px;
  color: #ff6680;
}
.token-warn.visible { display: flex; }
.reauth {
  margin-left: auto;
  background: rgba(255,51,102,0.14);
  border: none;
  color: #ff6680;
  padding: 4px 10px;
  border-radius: 6px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
.reauth:hover { background: rgba(255,51,102,0.28); }

/* ─────────────────────────────────────────
   TOAST
───────────────────────────────────────── */
#toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-14px);
  background: var(--c1);
  border: 1px solid var(--cyan-hard);
  color: var(--cyan);
  font-size: 12px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  padding: 9px 22px;
  border-radius: 30px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.22s cubic-bezier(0.16,1,0.3,1);
  white-space: nowrap;
  z-index: 999;
  box-shadow: 0 0 20px var(--cyan-glow), 0 8px 24px rgba(0,0,0,0.4);
  letter-spacing: 0.5px;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body data-theme="dark">

<!-- bg orbs -->
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div id="toast"></div>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="30" height="30" rx="9" fill="#080810" stroke="rgba(0,229,255,0.25)" stroke-width="1"/>
          <rect x="6" y="10" width="20" height="13" rx="2.5" stroke="#00e5ff" stroke-width="1.4"/>
          <path d="M6 13.5L15.1 18.9a1.8 1.8 0 0 0 1.8 0L26 13.5" stroke="#00e5ff" stroke-width="1.4" stroke-linecap="round"/>
          <!-- corner lights -->
          <circle cx="1" cy="1" r="1" fill="rgba(0,229,255,0.5)"/>
          <circle cx="31" cy="1" r="1" fill="rgba(0,229,255,0.5)"/>
        </svg>
      </div>
      <span class="logo-name">Nexus<span>Mail</span></span>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
      <i class="fa-regular fa-moon" id="themeIcon"></i>
    </button>
  </div>

  <!-- PANEL -->
  <div class="panel">

    <!-- LOGIN VIEW -->
    <div class="login-view" id="loginView">
      <div class="login-icon">
        <i class="fa-regular fa-envelope"></i>
      </div>
      <div class="login-copy">
        <div class="login-title">Connect your inbox</div>
        <div class="login-sub">Link Gmail to catch verification codes<br>the instant they arrive.</div>
      </div>
      <button class="g-btn" onclick="startLogin()">
        <svg class="g-icon" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>
    </div>

    <!-- MAIN VIEW -->
    <div id="mainView" style="display:none;">

      <div class="status-bar">
        <div class="s-left">
          <div class="live-dot" id="statusDot"></div>
          <span id="statusEmail">—</span>
        </div>
        <button class="signout-btn" onclick="logout()">Sign out</button>
      </div>

      <div class="main-body">

        <div class="token-warn" id="tokenWarning">
          <i class="fa-solid fa-triangle-exclamation" style="font-size:11px;"></i>
          Session expired
          <button class="reauth" onclick="silentRefresh()">Refresh</button>
        </div>

        <!-- email -->
        <div class="email-display" onclick="copyEmail()" title="Copy alias">
          <div class="email-text loading" id="emailDisplay">Generating...</div>
          <div class="copy-btn" id="copyInner">
            <i class="fa-regular fa-copy" id="copyIcon"></i>
          </div>
        </div>

        <!-- actions -->
        <div class="actions">
          <button class="act-btn" id="refreshBtn" onclick="doRefresh()">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Refresh</span>
          </button>
          <button class="act-btn" onclick="newEmail()">
            <i class="fa-solid fa-plus"></i>
            <span>New Email</span>
          </button>
        </div>

        <!-- inbox -->
        <div class="inbox-header">
          <span class="inbox-label">Verification Codes</span>
          <div class="scan-status">
            <div class="scan-pip" id="scanDot"></div>
            <span id="scanText">SCANNING</span>
          </div>
        </div>

        <div class="inbox" id="inbox">
          <div class="empty">
            <i class="fa-regular fa-clock"></i>
            awaiting_emails...
          </div>
        </div>

      </div>
    </div>

  </div><!-- /panel -->

</div><!-- /app -->

<script>
const CLIENT_ID = '159808029273-ml37999iis48lr4ev5m2u9vesj62fouv.apps.googleusercontent.com';
const SCOPES    = 'https://www.googleapis.com/auth/gmail.readonly';

let accessToken   = null;
let tokenExpiry   = 0;
let baseGmail     = null;
let currentAlias  = null;
let currentSuffix = null;
let pollTimer     = null;
let refreshTimer  = null;
let knownIds      = new Set();
let firstCopied   = false;
let tokenClient   = null;

/* ── theme ── */
function toggleTheme() {
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  document.body.setAttribute('data-theme', next);
  document.getElementById('themeIcon').className = isDark ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
  localStorage.setItem('theme', next);
}
(function initTheme() {
  const t = localStorage.getItem('theme') || 'dark';
  document.body.setAttribute('data-theme', t);
  document.getElementById('themeIcon').className = t === 'dark' ? 'fa-regular fa-moon' : 'fa-regular fa-sun';
})();

/* ── sound ── */
function playNotification() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [{ freq:1046, start:0, dur:0.1, vol:0.15 }, { freq:1318, start:0.1, dur:0.14, vol:0.1 }]
    .forEach(n => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = n.freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + n.start);
      gain.gain.linearRampToValueAtTime(n.vol, ctx.currentTime + n.start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.start + n.dur);
      osc.start(ctx.currentTime + n.start);
      osc.stop(ctx.currentTime + n.start + n.dur + 0.05);
    });
  } catch(e) {}
}

/* ── auth ── */
function initTokenClient() {
  if (tokenClient) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES, prompt: '',
    callback: handleTokenResponse
  });
}

function handleTokenResponse(resp) {
  if (resp.error) {
    document.getElementById('tokenWarning').classList.add('visible');
    setStatus(false); return;
  }
  accessToken = resp.access_token;
  tokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
  localStorage.setItem('gToken', accessToken);
  localStorage.setItem('gExpiry', tokenExpiry);
  document.getElementById('tokenWarning').classList.remove('visible');
  scheduleTokenRefresh();
}

function startLogin() {
  const tc = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES, prompt: 'select_account',
    callback: async (resp) => {
      if (resp.error) { showToast('Login cancelled'); return; }
      accessToken = resp.access_token;
      tokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
      localStorage.setItem('gToken', accessToken);
      localStorage.setItem('gExpiry', tokenExpiry);
      await fetchProfile();
      initTokenClient(); scheduleTokenRefresh();
    }
  });
  tc.requestAccessToken({ prompt: 'select_account' });
}

function silentRefresh() {
  if (!tokenClient) initTokenClient();
  tokenClient.requestAccessToken({ prompt: '' });
}

function scheduleTokenRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  const ms = tokenExpiry - Date.now();
  if (ms > 0) refreshTimer = setTimeout(silentRefresh, ms);
}

async function fetchProfile() {
  try {
    const r = await fetch('https://www.googleapis.com/gmail/v1/users/me/profile', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const d = await r.json();
    baseGmail = d.emailAddress;
    localStorage.setItem('gEmail', baseGmail);
    document.getElementById('statusEmail').innerText = baseGmail;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display  = 'block';
    setStatus(true); newEmail();
  } catch(e) { showToast('Profile error'); }
}

function logout() {
  clearInterval(pollTimer); clearTimeout(refreshTimer);
  accessToken = tokenClient = null;
  ['gToken','gExpiry','gEmail'].forEach(k => localStorage.removeItem(k));
  document.getElementById('mainView').style.display  = 'none';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('inbox').innerHTML = emptyState();
}

window.addEventListener('load', () => {
  const tok = localStorage.getItem('gToken');
  const exp = parseInt(localStorage.getItem('gExpiry') || '0');
  const em  = localStorage.getItem('gEmail');
  if (tok && em && Date.now() < exp) {
    accessToken = tok; tokenExpiry = exp; baseGmail = em;
    document.getElementById('statusEmail').innerText = em;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display  = 'block';
    setStatus(true); initTokenClient(); scheduleTokenRefresh(); newEmail();
  }
});

/* ── email ── */
function randStr(n=6) {
  const c='abcdefghijklmnopqrstuvwxyz0123456789';
  return Array.from({length:n},()=>c[Math.random()*c.length|0]).join('');
}

function newEmail() {
  if (!baseGmail) return;
  clearInterval(pollTimer); knownIds.clear(); firstCopied = false;
  currentSuffix = randStr(6);
  const [local,domain] = baseGmail.split('@');
  currentAlias = `${local}+${currentSuffix}@${domain}`;
  const el = document.getElementById('emailDisplay');
  el.innerText = currentAlias; el.classList.remove('loading');
  document.getElementById('inbox').innerHTML = emptyState();
  document.getElementById('scanText').innerText = 'SCANNING';
  pollTimer = setInterval(poll, 5000);
}

/* ── polling ── */
async function poll() {
  if (!accessToken || !currentAlias) return;
  if (Date.now() > tokenExpiry) { silentRefresh(); return; }
  try {
    const q   = encodeURIComponent(`to:${currentAlias}`);
    const res = await fetch(
      `https://www.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=15`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (res.status === 401) { silentRefresh(); return; }
    const data = await res.json();
    for (const m of (data.messages || [])) {
      if (!knownIds.has(m.id)) {
        knownIds.add(m.id);
        if (document.querySelector('.empty')) document.getElementById('inbox').innerHTML = '';
        fetchMsg(m.id);
      }
    }
  } catch(e) {}
}

async function fetchMsg(id) {
  try {
    const res = await fetch(
      `https://www.googleapis.com/gmail/v1/users/me/messages/${id}?format=full`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    const msg  = await res.json();
    const hdrs = msg.payload.headers || [];
    const from = (hdrs.find(h=>h.name==='From')||{}).value||'';
    const subj = (hdrs.find(h=>h.name==='Subject')||{}).value||'';
    let body = '';
    function exB(p) {
      if (p.mimeType==='text/plain'&&p.body?.data)
        body+=atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/'));
      else if (p.mimeType==='text/html'&&p.body?.data&&!body)
        body+=atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/')).replace(/<[^>]*>/g,' ');
      if (p.parts) p.parts.forEach(exB);
    }
    if (msg.payload.parts) msg.payload.parts.forEach(exB);
    else if (msg.payload.body?.data)
      body=atob(msg.payload.body.data.replace(/-/g,'+').replace(/_/g,'/'));
    const code   = extractCode(subj+' '+body);
    const sender = from.replace(/<.*>/,'').trim()||from.split('@')[0];
    renderMsg(sender,code);
    if (code && !firstCopied) {
      firstCopied=true;
      navigator.clipboard.writeText(code).catch(()=>{});
      showToast('// CODE_COPIED'); playNotification();
    }
  } catch(e) {}
}

function extractCode(text) {
  const pats = [
    /(?:verification|confirm|code|otp|pin)[^\d]*(\d{4,8})/i,
    /(\d{4,8})(?:[^\d]|$).*(?:verification|confirm|code|otp|pin)/i,
    /\b(\d{6})\b/, /\b(\d{4,8})\b/
  ];
  for (const p of pats) {
    const m = text.match(p);
    if (m) {
      const code=m[1]||m[0]; const n=parseInt(code);
      if (n>=1000&&n<=99999999&&!(n>=2020&&n<=2030)) return code;
    }
  }
  return null;
}

function renderMsg(sender, code) {
  const inbox = document.getElementById('inbox');
  const card  = document.createElement('div');
  card.className = 'msg';
  let html = `<div class="msg-sender">${esc(sender)}</div>`;
  if (code) {
    html += `<div class="code-block" onclick="copyCode('${code}')">${code}</div>`;
  } else {
    html += `<div class="no-code">// no_code_detected</div>`;
  }
  card.innerHTML = html;
  inbox.prepend(card);
}

function emptyState() {
  return `<div class="empty"><i class="fa-regular fa-clock"></i> awaiting_emails...</div>`;
}

async function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning'); await poll();
  setTimeout(()=>btn.classList.remove('spinning'),600);
}

function copyEmail() {
  if (!currentAlias) return;
  navigator.clipboard.writeText(currentAlias).then(()=>{
    showToast('// EMAIL_COPIED');
    const icon=document.getElementById('copyIcon');
    icon.className='fa-solid fa-check';
    setTimeout(()=>icon.className='fa-regular fa-copy',1400);
  });
}

function copyCode(code) {
  navigator.clipboard.writeText(code).then(()=>showToast('// CODE_COPIED'));
}

function setStatus(ok) {
  document.getElementById('statusDot').className = ok ? 'live-dot' : 'live-dot off';
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.innerText=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
