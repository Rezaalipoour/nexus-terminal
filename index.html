<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Inbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { --bg: #050505; --card: rgba(255, 255, 255, 0.03); --accent: #6366f1; --text: #f8fafc; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        
        /* Glass Grid Background */
        .bg-grid { position: fixed; inset: 0; z-index: -1; opacity: 0.15; background-image: radial-gradient(circle at 2px 2px, #4f46e5 1px, transparent 0); background-size: 40px 40px; }
        
        .container { width: 100%; max-width: 400px; padding: 20px; }
        .card { background: var(--card); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; padding: 24px; }
        
        .btn-modern { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px 20px; border-radius: 12px; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-modern:hover { background: var(--accent); }
        .email-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin: 15px 0; cursor: pointer; border: 1px dashed var(--accent); text-align: center; font-family: monospace; }
        .code-card { background: rgba(99, 102, 241, 0.1); border-left: 3px solid var(--accent); padding: 15px; margin-top: 10px; border-radius: 4px; text-align: center; font-size: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="container">
        <div class="card">
            <div id="loginArea"><button class="btn-modern" onclick="handleAuthClick()">Connect Gmail</button></div>
            <div id="mainArea" style="display:none;">
                <div class="email-box" onclick="copyEmail()">Click to Copy Email</div>
                <div id="inboxContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '159808029273-ml37999iis48lr4ev5m2u9vesj62fouv.apps.googleusercontent.com';
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'copy') { osc.frequency.value = 600; gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); }
            else { osc.frequency.value = 880; gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); }
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        async function handleAuthClick() {
            const client = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/gmail.readonly',
                callback: (res) => {
                    localStorage.setItem('token', res.access_token);
                    document.getElementById('loginArea').style.display = 'none';
                    document.getElementById('mainArea').style.display = 'block';
                    initApp();
                }
            });
            client.requestAccessToken();
        }

        function copyEmail() { 
            playSound('copy'); 
            navigator.clipboard.writeText(document.getElementById('emailDisplay').innerText); 
        }

        // بررسی خودکار توکن هنگام لود
        window.onload = () => {
            const token = localStorage.getItem('token');
            if(token) { document.getElementById('loginArea').style.display = 'none'; document.getElementById('mainArea').style.display = 'block'; initApp(); }
        }

        function initApp() { /* logic for polling Gmail */ }
    </script>
</body>
</html>
