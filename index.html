<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Temp Mail</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='4' width='20' height='16' rx='2'></rect><path d='M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'></path></svg>" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #09090b;
            --card-bg: rgba(24, 24, 27, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --box-bg: rgba(0, 0, 0, 0.4);
            --btn-border: rgba(255, 255, 255, 0.08);
            --code-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.06);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #4f46e5;
            --box-bg: rgba(241, 245, 249, 0.8);
            --btn-border: rgba(0, 0, 0, 0.08);
            --code-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex; flex-direction: column; gap: 18px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; font-weight: 500; letter-spacing: 0.5px; }
        .header h1 span { color: var(--accent); font-weight: 600; }

        .theme-btn {
            background: transparent; border: none;
            color: var(--text-secondary); font-size: 18px;
            cursor: pointer; transition: color 0.2s ease;
        }
        .theme-btn:hover { color: var(--accent); }

        .email-display-group {
            background: var(--box-bg);
            border: 1px solid var(--btn-border);
            border-radius: 16px;
            padding: 8px 8px 8px 18px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.1s ease;
        }
        .email-display-group:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
        }
        .email-display-group:active { transform: scale(0.98); }

        .email-text {
            font-size: 15px; font-weight: 500; letter-spacing: 0.2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--text-primary);
            flex: 1;
            margin-right: 8px;
        }

        .email-text.loading { color: var(--text-secondary); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .action-icon-btn {
            background: var(--btn-border); border: none;
            width: 42px; height: 42px;
            border-radius: 12px;
            color: var(--text-primary); cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 16px;
            flex-shrink: 0;
            pointer-events: none;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .email-display-group:hover .action-icon-btn {
            background: var(--accent); color: #fff;
        }

        .controls { display: flex; gap: 10px; }
        .btn {
            flex: 1; background: transparent; border: 1px solid var(--btn-border);
            color: var(--text-primary); padding: 12px; border-radius: 12px;
            font-family: inherit; font-size: 13px; font-weight: 400; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 6px;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .btn:hover { background: var(--btn-border); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .spin i { animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .divider { height: 1px; background: var(--btn-border); width: 100%; margin: 2px 0; }

        .inbox-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 1.5px;
        }

        .radar { display: flex; align-items: center; gap: 6px; }
        .dot {
            width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
            animation: blink 2s infinite;
        }
        .dot.inactive { background: var(--text-secondary); animation: none; opacity: 0.5; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; box-shadow: 0 0 8px var(--accent); } }

        .inbox-list {
            display: flex; flex-direction: column; gap: 12px;
            min-height: 80px;
            max-height: 250px;
            overflow-y: auto; padding-right: 4px;
        }

        .inbox-list::-webkit-scrollbar { width: 4px; }
        .inbox-list::-webkit-scrollbar-thumb { background: var(--btn-border); border-radius: 4px; }

        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 80px; gap: 8px; color: var(--text-secondary); font-size: 13px; font-weight: 300;
        }

        .message {
            background: var(--box-bg);
            border: 1px solid var(--btn-border);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeUp 0.3s ease forwards;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .msg-sender {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: left;
            width: 100%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding-left: 2px;
        }

        .extracted-code {
            background: var(--code-bg);
            color: var(--accent);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 12px;
            padding: 8px 20px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 8px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: all 0.2s ease;
            will-change: transform;
        }

        .extracted-code:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .extracted-code:active {
            transform: scale(0.97);
            box-shadow: none;
        }

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--text-primary); color: var(--bg-body);
            font-size: 13px; font-weight: 600;
            padding: 10px 20px; border-radius: 20px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: var(--shadow); z-index: 100;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body data-theme="dark">

    <div id="toast">Copied!</div>

    <div class="container">
        <div class="card">

            <div class="header">
                <h1>Nexus<span>Mail</span></h1>
                <button class="theme-btn" onclick="toggleTheme()" title="Switch Theme">
                    <i class="fa-regular fa-sun" id="themeIcon"></i>
                </button>
            </div>

            <div class="email-display-group" onclick="copyEmail()">
                <div class="email-text loading" id="emailDisplay">Connecting...</div>
                <button class="action-icon-btn" id="copyBtn">
                    <i class="fa-regular fa-copy" id="copyIcon"></i>
                </button>
            </div>

            <div class="controls">
                <button class="btn" id="refreshBtn" onclick="forceRefresh()">
                    <i class="fa-solid fa-rotate-right"></i> Refresh
                </button>
                <button class="btn" id="newEmailBtn" onclick="createNewEmail()">
                    <i class="fa-solid fa-plus"></i> New Email
                </button>
            </div>

            <div class="divider"></div>

            <div class="inbox-header">
                <span>Verification Codes</span>
                <div class="radar">
                    <div class="dot" id="radarDot"></div>
                    <span id="scanStatus" style="font-size: 9px;">Starting...</span>
                </div>
            </div>

            <div class="inbox-list" id="inboxContainer">
                <div class="empty-state">
                    <span>Awaiting incoming codes...</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ===================================================
        //  STATE
        // ===================================================
        let currentEmail = "";
        let authToken = "";
        let checkInterval = null;
        let knownMessageIds = new Set();
        let availableDomains = [];

        // ===================================================
        //  INIT
        // ===================================================
        window.addEventListener('DOMContentLoaded', () => {
            createNewEmail();
        });

        // ===================================================
        //  CREATE NEW EMAIL  (mail.tm API)
        // ===================================================
        async function createNewEmail() {
            const display = document.getElementById('emailDisplay');
            const status = document.getElementById('scanStatus');
            const dot = document.getElementById('radarDot');
            const inbox = document.getElementById('inboxContainer');

            // Reset state
            if (checkInterval) clearInterval(checkInterval);
            knownMessageIds.clear();
            currentEmail = "";
            authToken = "";

            display.className = "email-text loading";
            display.innerText = "Connecting...";
            status.innerText = "Loading...";
            dot.className = "dot inactive";
            inbox.innerHTML = `<div class="empty-state"><span>Setting up mailbox...</span></div>`;

            try {
                // 1. Get available domains
                const domainsRes = await fetch("https://api.mail.tm/domains");
                const domainsData = await domainsRes.json();
                availableDomains = domainsData["hydra:member"];

                if (!availableDomains || availableDomains.length === 0) {
                    throw new Error("No domains available");
                }

                const domain = availableDomains[0].domain;
                const randomStr = Math.random().toString(36).substring(2, 12);
                const email = `${randomStr}@${domain}`;
                const password = Math.random().toString(36).substring(2, 18);

                // 2. Create account
                const createRes = await fetch("https://api.mail.tm/accounts", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ address: email, password: password })
                });

                if (!createRes.ok) {
                    const err = await createRes.json();
                    throw new Error(err["hydra:description"] || "Account creation failed");
                }

                // 3. Get auth token
                const tokenRes = await fetch("https://api.mail.tm/token", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ address: email, password: password })
                });

                if (!tokenRes.ok) throw new Error("Authentication failed");

                const tokenData = await tokenRes.json();
                authToken = tokenData.token;
                currentEmail = email;

                // Update UI
                display.className = "email-text";
                display.innerText = currentEmail;
                status.innerText = "Scanning";
                dot.className = "dot";
                inbox.innerHTML = `<div class="empty-state"><span>Waiting for codes...</span></div>`;

                // Start polling every 4 seconds
                checkInterval = setInterval(checkInbox, 4000);

            } catch (e) {
                console.error("Setup error:", e);
                display.className = "email-text loading";
                display.innerText = "Failed to connect";
                status.innerText = "Error";
                dot.className = "dot inactive";
                inbox.innerHTML = `<div class="empty-state"><span>Connection failed. Try Refresh.</span></div>`;
            }
        }

        // ===================================================
        //  CHECK INBOX
        // ===================================================
        async function checkInbox() {
            if (!currentEmail || !authToken) return;

            try {
                const res = await fetch("https://api.mail.tm/messages", {
                    headers: { "Authorization": `Bearer ${authToken}` }
                });

                if (!res.ok) return;

                const data = await res.json();
                const messages = data["hydra:member"];

                if (!messages || messages.length === 0) return;

                for (const msg of messages) {
                    if (knownMessageIds.has(msg.id)) continue;
                    knownMessageIds.add(msg.id);

                    // Get full message to read the body
                    const fullRes = await fetch(`https://api.mail.tm/messages/${msg.id}`, {
                        headers: { "Authorization": `Bearer ${authToken}` }
                    });

                    if (!fullRes.ok) continue;
                    const fullMsg = await fullRes.json();

                    // Try to extract code from subject first, then body
                    const searchText = (fullMsg.subject || "") + " " + (fullMsg.text || "") + " " + (fullMsg.html || "");
                    const code = extractCodeNumber(searchText);
                    const senderName = fullMsg.from?.address || "Unknown";

                    // Remove empty state if present
                    const inbox = document.getElementById('inboxContainer');
                    if (inbox.querySelector('.empty-state')) {
                        inbox.innerHTML = '';
                    }

                    if (code) {
                        renderMessage(code, senderName);
                    } else {
                        // Show raw subject if no code found
                        renderMessage(fullMsg.subject || "(no subject)", senderName, true);
                    }
                }

            } catch (e) {
                console.error("Inbox check error:", e);
            }
        }

        // ===================================================
        //  EXTRACT VERIFICATION CODE
        //  Finds 4-8 digit codes in text
        // ===================================================
        function extractCodeNumber(text) {
            if (!text) return null;

            // Strip HTML tags for cleaner matching
            const clean = text.replace(/<[^>]*>/g, ' ');

            // Priority 1: Explicit OTP/verification code patterns
            const patterns = [
                /(?:verification|verify|otp|code|کد|رمز|pin)[^\d]{0,20}(\d{4,8})/i,
                /(\d{4,8})(?:[^\d]{0,20})(?:is your|verification|code|کد)/i,
                /\b([A-Z0-9]{6,8})\b(?=[^\w]|$)/,  // Alphanumeric codes like "AB12CD"
                /\b(\d{6})\b/,   // 6-digit code (most common)
                /\b(\d{4})\b/,   // 4-digit code
                /\b(\d{5})\b/,   // 5-digit code
                /\b(\d{7,8})\b/, // 7-8 digit code
            ];

            for (const pattern of patterns) {
                const match = clean.match(pattern);
                if (match) {
                    const candidate = match[1];
                    // Avoid matching years (1900-2099) and phone-looking numbers
                    if (/^(19|20)\d{2}$/.test(candidate)) continue;
                    return candidate;
                }
            }

            return null;
        }

        // ===================================================
        //  RENDER MESSAGE CARD
        // ===================================================
        function renderMessage(code, sender, isSubject = false) {
            const inbox = document.getElementById('inboxContainer');

            const card = document.createElement('div');
            card.className = 'message';

            const senderEl = document.createElement('div');
            senderEl.className = 'msg-sender';
            senderEl.innerText = sender;

            const codeEl = document.createElement('div');
            codeEl.className = 'extracted-code';
            codeEl.innerText = code;
            codeEl.title = "Click to copy";
            codeEl.onclick = () => copyToClipboard(code);

            card.appendChild(senderEl);
            card.appendChild(codeEl);

            // Prepend so newest is on top
            inbox.insertBefore(card, inbox.firstChild);
        }

        // ===================================================
        //  FORCE REFRESH  (manual check)
        // ===================================================
        async function forceRefresh() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spin');
            btn.disabled = true;
            await checkInbox();
            setTimeout(() => {
                btn.classList.remove('spin');
                btn.disabled = false;
            }, 800);
        }

        // ===================================================
        //  COPY EMAIL TO CLIPBOARD
        // ===================================================
        function copyEmail() {
            if (!currentEmail || currentEmail === "Connecting..." || currentEmail === "Failed to connect") return;
            copyToClipboard(currentEmail);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("Copied!");
            }).catch(() => {
                // Fallback for older browsers
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                showToast("Copied!");
            });
        }

        // ===================================================
        //  TOAST NOTIFICATION
        // ===================================================
        let toastTimer;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ===================================================
        //  THEME TOGGLE
        // ===================================================
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                icon.className = 'fa-regular fa-moon';
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.className = 'fa-regular fa-sun';
            }
        }
    </script>
</body>
</html>
