<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Temp Mail</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='4' width='20' height='16' rx='2'></rect><path d='M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'></path></svg>" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #09090b;
            --card-bg: rgba(24, 24, 27, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --box-bg: rgba(0, 0, 0, 0.4);
            --btn-border: rgba(255, 255, 255, 0.08);
            --code-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.06);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #4f46e5;
            --box-bg: rgba(241, 245, 249, 0.8);
            --btn-border: rgba(0, 0, 0, 0.08);
            --code-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex; flex-direction: column; gap: 18px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; font-weight: 500; letter-spacing: 0.5px; }
        .header h1 span { color: var(--accent); font-weight: 600; }

        /* API source badge */
        .api-badge {
            font-size: 9px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--box-bg);
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            padding: 2px 7px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .api-badge.ok { border-color: rgba(34,197,94,0.3); color: #22c55e; background: rgba(34,197,94,0.08); }
        .api-badge.fail { border-color: rgba(239,68,68,0.3); color: #ef4444; background: rgba(239,68,68,0.08); }

        .header-right { display: flex; align-items: center; gap: 8px; }

        .theme-btn {
            background: transparent; border: none;
            color: var(--text-secondary); font-size: 18px;
            cursor: pointer; transition: color 0.2s ease;
        }
        .theme-btn:hover { color: var(--accent); }

        /* Domain selector */
        .domain-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .domain-chip {
            background: var(--box-bg);
            border: 1px solid var(--btn-border);
            border-radius: 10px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        .domain-chip:hover { border-color: var(--accent); color: var(--text-primary); }
        .domain-chip.active {
            border-color: var(--accent);
            background: rgba(99,102,241,0.12);
            color: var(--accent);
            font-weight: 600;
        }

        .email-display-group {
            background: var(--box-bg);
            border: 1px solid var(--btn-border);
            border-radius: 16px;
            padding: 8px 8px 8px 18px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.1s ease;
        }
        .email-display-group:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
        }
        .email-display-group:active { transform: scale(0.98); }

        .email-text {
            font-size: 15px; font-weight: 500; letter-spacing: 0.2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--text-primary);
            flex: 1;
            margin-right: 8px;
        }

        .email-text.loading { color: var(--text-secondary); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .action-icon-btn {
            background: var(--btn-border); border: none;
            width: 42px; height: 42px;
            border-radius: 12px;
            color: var(--text-primary); cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 16px;
            flex-shrink: 0;
            pointer-events: none;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .email-display-group:hover .action-icon-btn {
            background: var(--accent); color: #fff;
        }

        .controls { display: flex; gap: 10px; }
        .btn {
            flex: 1; background: transparent; border: 1px solid var(--btn-border);
            color: var(--text-primary); padding: 12px; border-radius: 12px;
            font-family: inherit; font-size: 13px; font-weight: 400; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 6px;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .btn:hover { background: var(--btn-border); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .spin i { animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .divider { height: 1px; background: var(--btn-border); width: 100%; margin: 2px 0; }

        .inbox-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 1.5px;
        }

        .radar { display: flex; align-items: center; gap: 6px; }
        .dot {
            width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
            animation: blink 2s infinite;
        }
        .dot.inactive { background: var(--text-secondary); animation: none; opacity: 0.5; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; box-shadow: 0 0 8px var(--accent); } }

        .inbox-list {
            display: flex; flex-direction: column; gap: 12px;
            min-height: 80px;
            max-height: 300px;
            overflow-y: auto; padding-right: 4px;
        }

        .inbox-list::-webkit-scrollbar { width: 4px; }
        .inbox-list::-webkit-scrollbar-thumb { background: var(--btn-border); border-radius: 4px; }

        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 80px; gap: 8px; color: var(--text-secondary); font-size: 13px; font-weight: 300;
        }

        .message {
            background: var(--box-bg);
            border: 1px solid var(--btn-border);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeUp 0.3s ease forwards;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .msg-sender {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: left;
            width: 100%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding-left: 2px;
        }

        .msg-subject {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 400;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding-left: 2px;
        }

        .extracted-code {
            background: var(--code-bg);
            color: var(--accent);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 12px;
            padding: 8px 20px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 8px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: all 0.2s ease;
            will-change: transform;
        }

        .extracted-code:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .extracted-code:active {
            transform: scale(0.97);
            box-shadow: none;
        }

        /* Raw message view (no code found) */
        .raw-message {
            background: var(--code-bg);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.6;
            max-height: 80px;
            overflow-y: auto;
        }

        /* Timer bar */
        .timer-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .timer-bar-bg {
            flex: 1;
            height: 3px;
            background: var(--btn-border);
            border-radius: 4px;
            overflow: hidden;
        }
        .timer-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 1s linear;
        }
        .timer-bar-fill.warning { background: #f59e0b; }
        .timer-bar-fill.critical { background: #ef4444; }

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--text-primary); color: var(--bg-body);
            font-size: 13px; font-weight: 600;
            padding: 10px 20px; border-radius: 20px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: var(--shadow); z-index: 100;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body data-theme="dark">

    <div id="toast">Copied!</div>

    <div class="container">
        <div class="card">

            <div class="header">
                <h1>Nexus<span>Mail</span></h1>
                <div class="header-right">
                    <span class="api-badge" id="apiBadge">connecting</span>
                    <button class="theme-btn" onclick="toggleTheme()" title="Switch Theme">
                        <i class="fa-regular fa-sun" id="themeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Domain Chips -->
            <div class="domain-row" id="domainRow">
                <!-- filled by JS -->
            </div>

            <div class="email-display-group" onclick="copyEmail()">
                <div class="email-text loading" id="emailDisplay">Connecting...</div>
                <button class="action-icon-btn" id="copyBtn">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>

            <!-- Expiry timer -->
            <div class="timer-row" id="timerRow" style="display:none">
                <span id="timerLabel">48:00:00</span>
                <div class="timer-bar-bg">
                    <div class="timer-bar-fill" id="timerFill" style="width:100%"></div>
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="refreshBtn" onclick="forceRefresh()">
                    <i class="fa-solid fa-rotate-right"></i> Refresh
                </button>
                <button class="btn" id="newEmailBtn" onclick="createNewEmail()">
                    <i class="fa-solid fa-plus"></i> New Email
                </button>
            </div>

            <div class="divider"></div>

            <div class="inbox-header">
                <span>Verification Codes</span>
                <div class="radar">
                    <div class="dot inactive" id="radarDot"></div>
                    <span id="scanStatus" style="font-size: 9px;">Starting...</span>
                </div>
            </div>

            <div class="inbox-list" id="inboxContainer">
                <div class="empty-state">
                    <span>Awaiting incoming codes...</span>
                </div>
            </div>

        </div>
    </div>

    <script>
    // =========================================================
    //  1secMail API  — free, no key, no registration required
    //  https://www.1secmail.com/api/v1/
    //
    //  Endpoints used:
    //    ?action=genRandomMailbox&count=1          → generate random address
    //    ?action=getDomainList                     → get available domains
    //    ?action=getMessages&login=X&domain=Y      → list inbox messages
    //    ?action=readMessage&login=X&domain=Y&id=Z → read full message body
    //
    //  Emails are stored for 2 days (not 60 min like GuerrillaMail)
    //  CORS: 1secmail.com supports browser fetch without issues
    // =========================================================

    const API = "https://www.1secmail.com/api/v1/";

    // The full domain pool from 1secmail — fetched dynamically + these as fallback
    // These domains are NOT in major block lists (as of mid-2025)
    const FALLBACK_DOMAINS = [
        "1secmail.com",
        "1secmail.net",
        "1secmail.org",
        "esiix.com",
        "wwjmp.com",
        "xojxe.com",
        "yoggm.com",
        "dpptd.com",
        "rteet.com",
        "vjuum.com",
        "laafd.com",
        "txcct.com"
    ];

    let currentEmail   = "";
    let currentLogin   = "";
    let currentDomain  = "";
    let emailCreatedAt = 0;      // unix timestamp (ms)
    let knownIds       = new Set();
    let checkInterval  = null;
    let timerInterval  = null;
    let availableDomains = [...FALLBACK_DOMAINS];
    let selectedDomainIdx = 0;

    // =========================================================
    //  INIT
    // =========================================================
    window.addEventListener('DOMContentLoaded', () => {
        loadDomains().then(() => createNewEmail());
    });

    // =========================================================
    //  FETCH DOMAIN LIST DYNAMICALLY
    // =========================================================
    async function loadDomains() {
        try {
            const res = await fetch(`${API}?action=getDomainList`);
            if (!res.ok) throw new Error();
            const list = await res.json();
            if (Array.isArray(list) && list.length > 0) {
                // Merge with fallback — put lesser-known domains first
                const extra = FALLBACK_DOMAINS.filter(d => !list.includes(d));
                availableDomains = [...extra, ...list];
            }
        } catch(e) {
            // keep fallback list
        }
    }

    // =========================================================
    //  BUILD DOMAIN CHIPS
    // =========================================================
    function buildDomainChips() {
        const row = document.getElementById('domainRow');
        row.innerHTML = '';
        // Show up to 8 domains — show short names
        availableDomains.slice(0, 8).forEach((d, i) => {
            const chip = document.createElement('button');
            chip.className = 'domain-chip' + (i === selectedDomainIdx ? ' active' : '');
            chip.textContent = '@' + d.split('.')[0];
            chip.title = '@' + d;
            chip.onclick = () => switchToDomain(i);
            row.appendChild(chip);
        });
    }

    function switchToDomain(idx) {
        selectedDomainIdx = idx;
        document.querySelectorAll('.domain-chip').forEach((c, j) => {
            c.className = 'domain-chip' + (j === idx ? ' active' : '');
        });
        createNewEmail(availableDomains[idx]);
    }

    // =========================================================
    //  CREATE NEW EMAIL
    //  Either random (no arg) or on a specific domain
    // =========================================================
    async function createNewEmail(forceDomain) {
        const display  = document.getElementById('emailDisplay');
        const status   = document.getElementById('scanStatus');
        const dot      = document.getElementById('radarDot');
        const inbox    = document.getElementById('inboxContainer');
        const timerRow = document.getElementById('timerRow');
        const badge    = document.getElementById('apiBadge');

        // Reset state
        if (checkInterval) clearInterval(checkInterval);
        if (timerInterval) clearInterval(timerInterval);
        knownIds.clear();
        currentEmail = "";
        currentLogin = "";
        currentDomain = "";

        display.className = "email-text loading";
        display.innerText = "Connecting...";
        status.innerText  = "Loading...";
        dot.className     = "dot inactive";
        badge.className   = "api-badge";
        badge.textContent = "connecting";
        timerRow.style.display = "none";
        inbox.innerHTML = `<div class="empty-state"><span>Setting up mailbox...</span></div>`;

        try {
            let email;

            if (forceDomain) {
                // Generate a random username for the chosen domain
                const user = randomUsername();
                email = `${user}@${forceDomain}`;
            } else {
                // Ask API to generate a random one
                const res  = await fetch(`${API}?action=genRandomMailbox&count=1`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data || !data[0]) throw new Error("No address returned");
                email = data[0];

                // Update domain selection to match returned email
                const dom = email.split('@')[1];
                const idx = availableDomains.indexOf(dom);
                if (idx !== -1) selectedDomainIdx = idx;
            }

            const parts    = email.split('@');
            currentLogin   = parts[0];
            currentDomain  = parts[1];
            currentEmail   = email;
            emailCreatedAt = Date.now();

            buildDomainChips();

            display.className = "email-text";
            display.innerText = currentEmail;
            status.innerText  = "Scanning";
            dot.className     = "dot";
            badge.className   = "api-badge ok";
            badge.textContent = "1secmail";
            inbox.innerHTML   = `<div class="empty-state"><span>Waiting for codes...</span></div>`;
            timerRow.style.display = "flex";

            // 1secmail keeps emails for 2 days
            startTimer(48 * 3600);

            // Poll every 5 seconds
            checkInterval = setInterval(checkInbox, 5000);

        } catch(e) {
            console.error("Setup error:", e);
            display.className = "email-text loading";
            display.innerText = "Failed to connect";
            status.innerText  = "Error";
            dot.className     = "dot inactive";
            badge.className   = "api-badge fail";
            badge.textContent = "error";
            inbox.innerHTML   = `<div class="empty-state"><span>Connection failed. Try Refresh or New Email.</span></div>`;
        }
    }

    // =========================================================
    //  RANDOM USERNAME GENERATOR
    // =========================================================
    function randomUsername() {
        const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
        let s = '';
        for (let i = 0; i < 10; i++) s += chars[Math.floor(Math.random() * chars.length)];
        return s;
    }

    // =========================================================
    //  COUNTDOWN TIMER
    //  totalSeconds: how long the email is valid (2 days = 172800s)
    // =========================================================
    function startTimer(totalSeconds) {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => updateTimer(totalSeconds), 1000);
        updateTimer(totalSeconds);
    }

    function updateTimer(totalSeconds) {
        const fill  = document.getElementById('timerFill');
        const label = document.getElementById('timerLabel');
        const elapsed   = Math.floor((Date.now() - emailCreatedAt) / 1000);
        const remaining = Math.max(0, totalSeconds - elapsed);

        const pct = (remaining / totalSeconds) * 100;
        fill.style.width = pct + "%";
        fill.className = "timer-bar-fill" +
            (pct < 5 ? " critical" : pct < 15 ? " warning" : "");

        const h = Math.floor(remaining / 3600);
        const m = Math.floor((remaining % 3600) / 60);
        const s = remaining % 60;
        if (h > 0) {
            label.textContent = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        } else {
            label.textContent = `${m}:${String(s).padStart(2, '0')}`;
        }

        if (remaining === 0) {
            clearInterval(timerInterval);
            clearInterval(checkInterval);
            document.getElementById('scanStatus').innerText = "Expired";
            document.getElementById('radarDot').className = "dot inactive";
        }
    }

    // =========================================================
    //  CHECK INBOX
    // =========================================================
    async function checkInbox() {
        if (!currentLogin || !currentDomain) return;

        try {
            const res = await fetch(
                `${API}?action=getMessages&login=${encodeURIComponent(currentLogin)}&domain=${encodeURIComponent(currentDomain)}`
            );
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const list = await res.json();

            if (!Array.isArray(list) || list.length === 0) return;

            for (const msg of list) {
                const id = String(msg.id);
                if (knownIds.has(id)) continue;
                knownIds.add(id);

                // Fetch full message body
                const fullRes = await fetch(
                    `${API}?action=readMessage&login=${encodeURIComponent(currentLogin)}&domain=${encodeURIComponent(currentDomain)}&id=${id}`
                );
                if (!fullRes.ok) continue;
                const full = await fullRes.json();

                const from    = full.from    || msg.from    || "Unknown";
                const subject = full.subject || msg.subject || "";
                // 1secmail returns htmlBody and textBody
                const bodyHtml = full.htmlBody || "";
                const bodyText = full.textBody || full.body || "";
                const combined = subject + " " + (bodyText || stripHtml(bodyHtml));
                const rawText  = decodeEntities(combined);
                const code     = extractCodeNumber(rawText);

                const inboxEl = document.getElementById('inboxContainer');
                if (inboxEl.querySelector('.empty-state')) inboxEl.innerHTML = '';

                if (code) {
                    renderCode(code, from, subject);
                } else {
                    const preview = bodyText
                        ? bodyText.substring(0, 160)
                        : stripHtml(bodyHtml).substring(0, 160);
                    renderRaw(subject || "(no subject)", from, preview);
                }
            }
        } catch(e) {
            console.error("Inbox error:", e);
        }
    }

    // =========================================================
    //  HELPERS
    // =========================================================
    function stripHtml(html) {
        if (!html) return "";
        return html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function decodeEntities(str) {
        const el = document.createElement('textarea');
        el.innerHTML = str;
        return el.value;
    }

    // =========================================================
    //  EXTRACT VERIFICATION CODE
    //  Priority: contextual keywords → 6-digit → 4-digit fallback
    // =========================================================
    function extractCodeNumber(text) {
        if (!text) return null;

        const patterns = [
            // Contextual: keyword then code
            /(?:verification|verify|otp|code|کد|رمز|pin|token|passcode|activate|confirm|کد تأیید|کدتایید)[^\d]{0,40}(\d{4,8})/i,
            // Code then keyword
            /(\d{4,8})(?:[^\d]{0,20})(?:is your|verification|code|کد|token|confirmation)/i,
            // Alphanumeric codes like AB1234 or 1234AB
            /\b([A-Z]{2,4}[0-9]{4,6}|[0-9]{4,6}[A-Z]{2,4})\b/,
            // Generic 6-char alphanumeric
            /\b([A-Z0-9]{6,8})\b(?=[^\w]|$)/,
            // Pure numeric by length (most common OTP sizes first)
            /\b(\d{6})\b/,
            /\b(\d{4})\b/,
            /\b(\d{5})\b/,
            /\b(\d{7,8})\b/,
        ];

        for (const pattern of patterns) {
            const match = text.match(pattern);
            if (match) {
                const c = match[1];
                if (/^(19|20)\d{2}$/.test(c)) continue;  // Skip years
                if (/^0+$/.test(c)) continue;              // Skip all-zeros
                if (/^\d{10,}$/.test(c)) continue;         // Skip phone-like numbers
                return c;
            }
        }
        return null;
    }

    // =========================================================
    //  RENDER — code card (highlighted, clickable)
    // =========================================================
    function renderCode(code, sender, subject) {
        const inbox = document.getElementById('inboxContainer');
        const card  = document.createElement('div');
        card.className = 'message';

        const fromEl = document.createElement('div');
        fromEl.className = 'msg-sender';
        fromEl.innerText = sender;

        const subEl = document.createElement('div');
        subEl.className = 'msg-subject';
        subEl.innerText = subject;

        const codeEl = document.createElement('div');
        codeEl.className = 'extracted-code';
        codeEl.innerText = code;
        codeEl.title = "Click to copy";
        codeEl.onclick = () => copyToClipboard(code);

        card.appendChild(fromEl);
        if (subject) card.appendChild(subEl);
        card.appendChild(codeEl);
        inbox.insertBefore(card, inbox.firstChild);
    }

    // =========================================================
    //  RENDER — raw card (no code detected)
    // =========================================================
    function renderRaw(subject, sender, excerpt) {
        const inbox = document.getElementById('inboxContainer');
        const card  = document.createElement('div');
        card.className = 'message';

        const fromEl = document.createElement('div');
        fromEl.className = 'msg-sender';
        fromEl.innerText = sender;

        const rawEl = document.createElement('div');
        rawEl.className = 'raw-message';
        rawEl.innerText = subject + (excerpt ? '\n' + excerpt : '');

        card.appendChild(fromEl);
        card.appendChild(rawEl);
        inbox.insertBefore(card, inbox.firstChild);
    }

    // =========================================================
    //  FORCE REFRESH
    // =========================================================
    async function forceRefresh() {
        const btn = document.getElementById('refreshBtn');
        btn.classList.add('spin');
        btn.disabled = true;
        await checkInbox();
        setTimeout(() => {
            btn.classList.remove('spin');
            btn.disabled = false;
        }, 800);
    }

    // =========================================================
    //  COPY EMAIL
    // =========================================================
    function copyEmail() {
        if (!currentEmail || currentEmail === "Connecting..." || currentEmail === "Failed to connect") return;
        copyToClipboard(currentEmail);
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            showToast("Copied!");
        }).catch(() => {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("Copied!");
        });
    }

    // =========================================================
    //  TOAST
    // =========================================================
    let toastTimer;
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // =========================================================
    //  THEME TOGGLE
    // =========================================================
    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById('themeIcon');
        if (body.getAttribute('data-theme') === 'dark') {
            body.setAttribute('data-theme', 'light');
            icon.className = 'fa-regular fa-moon';
        } else {
            body.setAttribute('data-theme', 'dark');
            icon.className = 'fa-regular fa-sun';
        }
    }
    </script>
</body>
