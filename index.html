<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Temp Mail</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#09090b;--card:rgba(24,24,27,.7);--border:rgba(255,255,255,.08);--text:#f8fafc;--muted:#94a3b8;--accent:#6366f1;--box:rgba(0,0,0,.35);--code-bg:rgba(99,102,241,.12);--shadow:0 24px 48px rgba(0,0,0,.6)}
        [data-theme="light"]{--bg:#f1f5f9;--card:rgba(255,255,255,.9);--border:rgba(0,0,0,.07);--text:#0f172a;--muted:#64748b;--accent:#4f46e5;--box:rgba(241,245,249,.8);--code-bg:rgba(79,70,229,.08);--shadow:0 10px 30px rgba(0,0,0,.07)}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px 60px;transition:background .3s,color .3s}
        .wrap{width:100%;max-width:450px}
        .card,.setup-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:26px;box-shadow:var(--shadow);backdrop-filter:blur(20px);display:flex;flex-direction:column;gap:16px}
        .hdr{display:flex;justify-content:space-between;align-items:center}
        .hdr h1{font-size:20px;font-weight:500}
        .hdr h1 span{color:var(--accent);font-weight:700}
        .hdr-r{display:flex;align-items:center;gap:8px}
        .badge{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid var(--border);color:var(--muted);background:var(--box)}
        .badge.ok{color:#22c55e;border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.08)}
        .badge.err{color:#ef4444;border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08)}
        .theme-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
        .theme-btn:hover{color:var(--accent)}
        .email-row{background:var(--box);border:1px solid var(--border);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:border-color .2s,background .2s}
        .email-row:hover{border-color:var(--accent);background:rgba(99,102,241,.06)}
        .email-txt{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .email-txt.loading{color:var(--muted);animation:pulse 1.4s infinite}
        @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
        .copy-icon{width:40px;height:40px;border-radius:10px;background:var(--border);border:none;color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center;pointer-events:none;flex-shrink:0;transition:background .2s,color .2s}
        .email-row:hover .copy-icon{background:var(--accent);color:#fff}
        .timer-row{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted)}
        .tbar{flex:1;height:3px;background:var(--border);border-radius:4px;overflow:hidden}
        .tfill{height:100%;background:var(--accent);border-radius:4px;transition:width 1s linear}
        .tfill.warn{background:#f59e0b}.tfill.crit{background:#ef4444}
        .btns{display:flex;gap:10px}
        .btn{flex:1;background:transparent;border:1px solid var(--border);color:var(--text);padding:11px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,transform .1s}
        .btn:hover{background:var(--border)}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
        .spin i{animation:spin .7s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .div{height:1px;background:var(--border)}
        .inbox-hdr{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
        .radar{display:flex;align-items:center;gap:5px}
        .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 2s infinite}
        .dot.off{background:var(--muted);animation:none;opacity:.4}
        @keyframes blink{0%,100%{opacity:.3}50%{opacity:1;box-shadow:0 0 7px var(--accent)}}
        .inbox{display:flex;flex-direction:column;gap:10px;min-height:90px;max-height:360px;overflow-y:auto;padding-right:2px}
        .inbox::-webkit-scrollbar{width:3px}.inbox::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:90px;color:var(--muted);font-size:13px;font-weight:300;gap:6px}
        .msg{background:var(--box);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;animation:up .3s ease}
        @keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
        .msg-from{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .msg-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .code-box{background:var(--code-bg);border:1px solid rgba(99,102,241,.3);border-radius:12px;padding:12px 16px;font-size:34px;font-weight:700;letter-spacing:12px;color:var(--accent);text-align:center;cursor:pointer;width:100%;transition:all .2s;user-select:none}
        .code-box:hover{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 24px rgba(99,102,241,.35)}
        .code-box:active{transform:scale(.97)}
        .code-hint{font-size:10px;color:var(--muted);text-align:center;margin-top:-2px}
        .raw{font-size:12px;color:var(--muted);line-height:1.6;background:var(--code-bg);border-radius:10px;padding:9px 12px;max-height:72px;overflow-y:auto;white-space:pre-wrap}
        .setup-card h2{font-size:18px;font-weight:600}
        .setup-card p{font-size:13px;color:var(--muted);line-height:1.7}
        .setup-card a{color:var(--accent);text-decoration:none}
        .input-row{display:flex;gap:8px}
        .api-input{flex:1;background:var(--box);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:border-color .2s}
        .api-input:focus{border-color:var(--accent)}.api-input::placeholder{color:var(--muted)}
        .go-btn{background:var(--accent);border:none;color:#fff;padding:11px 20px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;white-space:nowrap}
        .go-btn:hover{opacity:.88}.go-btn:active{transform:scale(.96)}
        .err-msg{font-size:12px;color:#ef4444;display:none}
        #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--text);color:var(--bg);font-size:13px;font-weight:700;padding:9px 22px;border-radius:20px;opacity:0;pointer-events:none;z-index:999;transition:opacity .2s,transform .2s}
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    </style>
</head>
<body data-theme="dark">
<div id="toast"></div>
<div class="wrap">

<div class="setup-card" id="setupScreen" style="display:none">
    <div class="hdr">
        <h1>Nexus<span>Mail</span></h1>
        <button class="theme-btn" onclick="toggleTheme()"><i class="fa-regular fa-sun" id="ti1"></i></button>
    </div>
    <h2>اتصال به addy.io</h2>
    <p>برو به <a href="https://app.addy.io/settings" target="_blank">app.addy.io/settings</a> ← قسمت <strong>API Keys</strong> ← یه key جدید بساز و اینجا وارد کن.</p>
    <div class="input-row">
        <input class="api-input" id="keyInput" type="password" placeholder="addy_io_...">
        <button class="go-btn" onclick="saveKey()">ذخیره</button>
    </div>
    <div class="err-msg" id="keyErr">Key معتبر نیست. دوباره چک کن.</div>
    <p style="font-size:11px">Key فقط روی مرورگر خودت ذخیره می‌شه.</p>
</div>

<div class="card" id="mainApp" style="display:none">
    <div class="hdr">
        <h1>Nexus<span>Mail</span></h1>
        <div class="hdr-r">
            <span class="badge" id="badge">connecting</span>
            <button class="theme-btn" onclick="toggleTheme()"><i class="fa-regular fa-sun" id="ti2"></i></button>
        </div>
    </div>
    <div class="email-row" onclick="copyEmail()">
        <div class="email-txt loading" id="emailTxt">در حال اتصال...</div>
        <button class="copy-icon"><i class="fa-regular fa-copy"></i></button>
    </div>
    <div class="timer-row" id="timerRow" style="display:none">
        <span id="timerLbl">—</span>
        <div class="tbar"><div class="tfill" id="tfill" style="width:100%"></div></div>
    </div>
    <div class="btns">
        <button class="btn" id="refreshBtn" onclick="forceRefresh()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
        <button class="btn" id="newBtn" onclick="newEmail()"><i class="fa-solid fa-plus"></i> New Email</button>
        <button class="btn" onclick="changeKey()" style="flex:0;padding:11px 14px" title="تغییر API Key"><i class="fa-solid fa-key"></i></button>
    </div>
    <div class="div"></div>
    <div class="inbox-hdr">
        <span>Verification Codes</span>
        <div class="radar"><div class="dot off" id="dot"></div><span id="scanLbl" style="font-size:9px">Starting...</span></div>
    </div>
    <div class="inbox" id="inbox"><div class="empty"><span>Waiting for codes...</span></div></div>
</div>

</div>
<script>
const ADDY='https://app.addy.io/api/v1';
const POLL=5000,TTL=3600;
let key='',alias='',aliasId='',createdAt=0,known=new Set(),pT=null,cT=null;

window.addEventListener('DOMContentLoaded',()=>{
    const s=localStorage.getItem('nx_key');
    if(s){key=s;show('mainApp');init();}
    else show('setupScreen');
});

function show(id){
    document.getElementById('setupScreen').style.display='none';
    document.getElementById('mainApp').style.display='none';
    document.getElementById(id).style.display='flex';
    document.getElementById(id).style.flexDirection='column';
}

async function saveKey(){
    const k=document.getElementById('keyInput').value.trim();
    const err=document.getElementById('keyErr');
    err.style.display='none';
    if(!k)return;
    try{
        const r=await af('/account-details',k);
        if(!r.ok)throw 0;
        key=k;localStorage.setItem('nx_key',k);
        show('mainApp');init();
    }catch(e){err.style.display='block';}
}

function changeKey(){stopAll();show('setupScreen');document.getElementById('keyInput').value='';}

async function init(){await newEmail();}

async function newEmail(){
    stopAll();known.clear();alias='';aliasId='';setLoad();
    const domains=['anonaddy.me','addy.io','addymail.com'];
    let ok=false;
    for(const d of domains){
        try{
            const r=await af('/aliases',key,'POST',{domain:d,description:'nexusmail',format:'random_words'});
            if(!r.ok)continue;
            const data=(await r.json()).data;
            alias=data.email;aliasId=data.id;ok=true;break;
        }catch(e){}
    }
    if(!ok){
        setBadge('err','error');setTxt('خطا در اتصال',true);
        document.getElementById('scanLbl').textContent='Error';
        document.getElementById('dot').className='dot off';
        document.getElementById('inbox').innerHTML='<div class="empty"><span>خطا — دکمه New Email رو بزن یا API Key رو چک کن</span></div>';
        return;
    }
    createdAt=Date.now();
    setTxt(alias,false);setBadge('ok','addy.io');
    document.getElementById('dot').className='dot';
    document.getElementById('scanLbl').textContent='Scanning';
    document.getElementById('timerRow').style.display='flex';
    document.getElementById('inbox').innerHTML='<div class="empty"><span>Waiting for codes...</span></div>';
    startTimer(TTL);
    pT=setInterval(poll,POLL);poll();
}

async function poll(){
    if(!aliasId)return;
    try{
        const r=await af('/aliases/'+aliasId+'/emails',key);
        if(!r.ok)return;
        const emails=(await r.json()).data||[];
        for(const e of emails){
            const id=String(e.id);
            if(known.has(id))continue;
            known.add(id);
            const inboxEl=document.getElementById('inbox');
            if(inboxEl.querySelector('.empty'))inboxEl.innerHTML='';
            try{
                const fr=await af('/emails/'+id,key);
                if(fr.ok){const fd=(await fr.json()).data||{};proc(id,fd.from_email||e.from_email||'',fd.subject||e.subject||'',fd.text||'',fd.html||'');}
                else proc(id,e.from_email||'',e.subject||'','','');
            }catch(ex){proc(id,e.from_email||'',e.subject||'','','');}
        }
    }catch(ex){console.warn(ex);}
}

function proc(id,from,subj,txt,html){
    const raw=decode(subj+' '+(txt||strip(html)));
    const code=extract(raw);
    if(code){
        renderCode(code,from,subj);
        if(known.size===1){copy(code);toast('✓ کد کپی شد: '+code);}
    } else if(subj||txt||html){
        renderRaw(subj||'(no subject)',from,(txt||strip(html)).substring(0,180));
    }
}

function extract(t){
    if(!t)return null;
    const pp=[
        /(?:verification|verify|otp|code|کد|رمز|pin|token|passcode|activate|confirm|your code)[^\d]{0,50}(\d{4,8})/i,
        /(\d{4,8})[^\d]{0,25}(?:is your|verification|code|کد|token|confirmation)/i,
        /\b([A-Z]{1,3}\d{4,6}|\d{4,6}[A-Z]{1,3})\b/,
        /\b(\d{6})\b/,/\b(\d{4})\b/,/\b(\d{5})\b/,/\b(\d{7,8})\b/
    ];
    for(const p of pp){const m=t.match(p);if(m){const c=m[1];if(/^(19|20)\d{2}$/.test(c)||/^0+$/.test(c)||/^\d{10,}$/.test(c))continue;return c;}}
    return null;
}

function renderCode(code,from,subj){
    const inbox=document.getElementById('inbox');
    const d=document.createElement('div');d.className='msg';
    d.innerHTML=`<div class="msg-from">${esc(from)}</div>${subj?`<div class="msg-sub">${esc(subj)}</div>`:''}<div class="code-box" onclick="copy('${esc(code)}');toast('✓ کپی شد')">${esc(code)}</div><div class="code-hint">↑ کلیک برای کپی</div>`;
    inbox.insertBefore(d,inbox.firstChild);
}

function renderRaw(subj,from,excerpt){
    const inbox=document.getElementById('inbox');
    const d=document.createElement('div');d.className='msg';
    d.innerHTML=`<div class="msg-from">${esc(from)}</div><div class="raw">${esc(subj+'\n'+excerpt)}</div>`;
    inbox.insertBefore(d,inbox.firstChild);
}

async function forceRefresh(){
    const b=document.getElementById('refreshBtn');
    b.classList.add('spin');b.disabled=true;
    await poll();
    setTimeout(()=>{b.classList.remove('spin');b.disabled=false;},700);
}

function startTimer(total){
    if(cT)clearInterval(cT);
    cT=setInterval(()=>tick(total),1000);tick(total);
}
function tick(total){
    const el=document.getElementById('tfill'),lbl=document.getElementById('timerLbl');
    const rem=Math.max(0,total-Math.floor((Date.now()-createdAt)/1000));
    const pct=(rem/total)*100;
    el.style.width=pct+'%';
    el.className='tfill'+(pct<5?' crit':pct<15?' warn':'');
    const m=Math.floor(rem/60),s=rem%60;
    lbl.textContent=m+':'+String(s).padStart(2,'0');
    if(rem===0){stopAll();document.getElementById('scanLbl').textContent='Expired';document.getElementById('dot').className='dot off';}
}

function stopAll(){if(pT)clearInterval(pT);if(cT)clearInterval(cT);pT=cT=null;}
function af(path,k,method='GET',body=null){
    const o={method,headers:{'Authorization':'Bearer '+k,'Content-Type':'application/json','Accept':'application/json','X-Requested-With':'XMLHttpRequest'}};
    if(body)o.body=JSON.stringify(body);
    return fetch(ADDY+path,o);
}
function setLoad(){setTxt('در حال ساخت آدرس...',true);setBadge('','connecting');document.getElementById('dot').className='dot off';document.getElementById('scanLbl').textContent='Loading...';document.getElementById('timerRow').style.display='none';document.getElementById('inbox').innerHTML='<div class="empty"><span>Setting up...</span></div>';}
function setTxt(t,l){const e=document.getElementById('emailTxt');e.textContent=t;e.className='email-txt'+(l?' loading':'');}
function setBadge(type,label){const b=document.getElementById('badge');b.className='badge'+(type?' '+type:'');b.textContent=label;}
function copyEmail(){if(!alias)return;copy(alias);toast('✓ ایمیل کپی شد');}
function copy(t){navigator.clipboard.writeText(t).catch(()=>{const e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();document.execCommand('copy');document.body.removeChild(e);});}
let tT;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('show'),2200);}
function strip(h){return(h||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();}
function decode(s){const e=document.createElement('textarea');e.innerHTML=s;return e.value;}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toggleTheme(){const b=document.body,d=b.getAttribute('data-theme')==='dark';b.setAttribute('data-theme',d?'light':'dark');const c=d?'fa-regular fa-moon':'fa-regular fa-sun';['ti1','ti2'].forEach(i=>{const el=document.getElementById(i);if(el)el.className=c;});}
</script>
</body>
</html>
