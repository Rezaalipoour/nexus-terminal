<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Dashboard</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2'><rect x='3' y='3' width='7' height='7' rx='1'/><rect x='14' y='3' width='7' height='7' rx='1'/><rect x='3' y='14' width='7' height='7' rx='1'/><rect x='14' y='14' width='7' height='7' rx='1'/></svg>" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --bg-body: #0b0b10;
            --card-bg: rgba(18, 18, 26, 0.80);
            --card-border: rgba(99, 102, 241, 0.14);
            --text-primary: #f0f2ff;
            --text-secondary: #8892b0;
            --accent: #6366f1;
            --accent2: #8b5cf6;
            --box-bg: rgba(12, 12, 20, 0.6);
            --btn-border: rgba(255, 255, 255, 0.10);
            --code-bg: rgba(99, 102, 241, 0.14);
            --shadow: 0 24px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(99,102,241,0.06);
            --grid-line: rgba(140, 145, 255, 0.055);
            --grid-dot: rgba(99, 102, 241, 0.42);
            --green: #22c55e;
            --yellow: #fbbf24;
            --red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Background */
        .bg-grid {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
        }
        .bg-grid::before {
            content: '';
            position: absolute; inset: -10%;
            background-image:
                linear-gradient(var(--grid-line) 0.5px, transparent 0.5px),
                linear-gradient(90deg, var(--grid-line) 0.5px, transparent 0.5px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse 90% 85% at 50% 50%, black 20%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 90% 85% at 50% 50%, black 20%, transparent 100%);
            animation: gridDrift 30s linear infinite;
        }
        .bg-grid::after {
            content: '';
            position: absolute; inset: -10%;
            background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 0%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 0%, transparent 100%);
            animation: gridDrift 30s linear infinite;
        }
        @keyframes gridDrift {
            0% { transform: translateY(0); }
            100% { transform: translateY(64px); }
        }
        .bg-glow {
            position: fixed;
            width: 900px; height: 700px;
            background: radial-gradient(ellipse, rgba(99,102,241,0.08) 0%, transparent 65%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 0;
            animation: glowBreath 10s ease-in-out infinite;
        }
        @keyframes glowBreath {
            0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
        }

        /* Layout */
        .page {
            position: relative; z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }
        .header-left {
            display: flex; align-items: center; gap: 14px;
        }
        .logo { font-size: 20px; font-weight: 500; letter-spacing: 0.5px; }
        .logo span { color: var(--accent); font-weight: 700; }
        .logo small {
            font-size: 11px; color: var(--text-secondary);
            background: var(--code-bg); border: 1px solid rgba(99,102,241,0.2);
            border-radius: 6px; padding: 2px 8px; margin-left: 8px;
            font-weight: 500; letter-spacing: 1px; text-transform: uppercase;
        }
        .header-right {
            display: flex; align-items: center; gap: 10px;
        }
        .nexusmail-link {
            display: flex; align-items: center; gap: 6px;
            background: var(--box-bg); border: 1px solid var(--btn-border);
            color: var(--text-secondary); border-radius: 10px;
            padding: 7px 14px; font-size: 12px; font-weight: 500;
            text-decoration: none; transition: all 0.2s;
        }
        .nexusmail-link:hover { border-color: var(--accent); color: var(--accent); }

        .user-pill {
            display: flex; align-items: center; gap: 8px;
            background: var(--box-bg); border: 1px solid var(--btn-border);
            border-radius: 10px; padding: 7px 14px; font-size: 12px;
            color: var(--text-secondary);
        }
        .user-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

        /* Login screen */
        #loginScreen {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 70vh; gap: 20px;
        }
        .login-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 24px; padding: 36px; width: 100%; max-width: 380px;
            box-shadow: var(--shadow); backdrop-filter: blur(24px);
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            text-align: center;
        }
        .login-icon {
            width: 52px; height: 52px; background: var(--code-bg);
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: var(--accent);
        }
        .login-title { font-size: 18px; font-weight: 600; }
        .login-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
        .google-btn {
            display: flex; align-items: center; gap: 10px;
            background: var(--box-bg); border: 1px solid var(--btn-border);
            color: var(--text-primary); padding: 12px 24px; border-radius: 14px;
            font-family: inherit; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.2s; width: 100%; justify-content: center;
        }
        .google-btn:hover { border-color: var(--accent); background: rgba(99,102,241,0.08); }
        .google-icon { width: 20px; height: 20px; }

        /* Dashboard grid */
        #dashScreen { display: none; }
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        @media (max-width: 680px) {
            .slots-grid { grid-template-columns: 1fr; }
        }

        /* Slot card */
        .slot {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
            display: flex; flex-direction: column; gap: 14px;
            transition: border-color 0.3s;
        }
        .slot.active { border-color: rgba(99,102,241,0.35); }
        .slot.done { border-color: rgba(34,197,94,0.35); }

        .slot-header {
            display: flex; align-items: center; justify-content: space-between;
        }
        .slot-num {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .slot-num-badge {
            width: 26px; height: 26px; border-radius: 8px;
            background: var(--code-bg); border: 1px solid rgba(99,102,241,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: var(--accent);
        }
        .slot-status {
            font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
            border-radius: 6px; padding: 3px 8px; text-transform: uppercase;
        }
        .slot-status.idle { background: rgba(255,255,255,0.05); color: var(--text-secondary); }
        .slot-status.ready { background: rgba(99,102,241,0.12); color: var(--accent); }
        .slot-status.registered { background: rgba(34,197,94,0.1); color: var(--green); }

        /* Email row */
        .email-row {
            display: flex; align-items: center; gap: 8px;
        }
        .email-box {
            flex: 1; background: var(--box-bg); border: 1px solid var(--btn-border);
            border-radius: 10px; padding: 8px 12px;
            font-size: 12px; color: var(--text-primary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-weight: 500;
        }
        .email-box.placeholder { color: var(--text-secondary); font-weight: 400; }
        .icon-btn {
            width: 34px; height: 34px; border-radius: 8px;
            background: var(--box-bg); border: 1px solid var(--btn-border);
            color: var(--text-secondary); cursor: pointer; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }
        .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
        .icon-btn.spin i { animation: spin 0.6s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Code display */
        .code-area {
            background: var(--box-bg); border: 1px solid var(--btn-border);
            border-radius: 10px; padding: 10px 14px;
            min-height: 44px;
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px;
        }
        .code-label {
            font-size: 10px; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .code-value {
            font-size: 22px; font-weight: 700; color: var(--accent);
            letter-spacing: 6px; cursor: pointer;
            transition: color 0.2s;
        }
        .code-value:hover { color: #fff; }
        .code-waiting { font-size: 12px; color: var(--text-secondary); }
        .code-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent); animation: blink 2s infinite; flex-shrink: 0;
        }
        @keyframes blink { 0%,100%{opacity:0.3;} 50%{opacity:1; box-shadow: 0 0 6px var(--accent);} }

        /* Login link button */
        .login-link-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.3);
            color: var(--accent); border-radius: 10px; padding: 9px 14px;
            font-size: 13px; font-weight: 600; font-family: inherit;
            text-decoration: none; cursor: pointer; transition: all 0.2s;
            width: 100%;
        }
        .login-link-btn:hover {
            background: var(--accent); color: #fff;
            box-shadow: 0 4px 15px rgba(99,102,241,0.3);
        }
        .login-link-btn.green {
            background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); color: var(--green);
        }
        .login-link-btn.green:hover { background: var(--green); color: #fff; }
        .login-link-btn:disabled, .login-link-btn.disabled {
            opacity: 0.4; pointer-events: none;
        }

        /* Credits display */
        .credits-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--text-secondary);
        }
        .credits-badge {
            display: flex; align-items: center; gap: 4px;
            background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.25);
            color: var(--yellow); border-radius: 6px; padding: 2px 8px;
            font-size: 11px; font-weight: 700;
        }

        /* Bottom bar */
        .bottom-bar {
            margin-top: 20px;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 14px 20px;
            backdrop-filter: blur(20px);
        }
        .bottom-info { font-size: 12px; color: var(--text-secondary); }
        .bottom-info span { color: var(--accent); font-weight: 600; }
        .reset-btn {
            background: transparent; border: 1px solid var(--btn-border);
            color: var(--text-secondary); border-radius: 8px;
            padding: 6px 14px; font-size: 12px; font-family: inherit;
            cursor: pointer; transition: all 0.2s;
        }
        .reset-btn:hover { border-color: var(--red); color: var(--red); }

        /* Toast */
        #toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--text-primary); color: var(--bg-body);
            font-size: 13px; font-weight: 600;
            padding: 10px 20px; border-radius: 20px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100; display: flex; align-items: center; gap: 8px;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Reauth banner */
        .reauth-bar {
            display: none; align-items: center; justify-content: space-between;
            background: rgba(234,179,8,0.08); border: 1px solid rgba(234,179,8,0.25);
            border-radius: 12px; padding: 10px 16px; margin-bottom: 16px; gap: 10px;
        }
        .reauth-bar span { font-size: 12px; color: var(--yellow); display: flex; align-items: center; gap: 6px; }
        .reauth-bar button {
            background: rgba(234,179,8,0.18); border: 1px solid rgba(234,179,8,0.35);
            color: var(--yellow); border-radius: 8px; padding: 4px 14px;
            font-size: 12px; font-family: inherit; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div id="toast"><span id="toastIcon">✓</span><span id="toastMsg">Copied!</span></div>

    <div class="page">

        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="logo">Nexus<span>Dash</span><small>4-Slot</small></div>
            </div>
            <div class="header-right">
                <a href="index.html" class="nexusmail-link">
                    <i class="fa-regular fa-envelope"></i> NexusMail
                </a>
                <div class="user-pill" id="userPill" style="display:none;">
                    <div class="dot"></div>
                    <span id="userPillEmail">...</span>
                </div>
            </div>
        </div>

        <!-- LOGIN SCREEN -->
        <div id="loginScreen">
            <div class="login-card">
                <div class="login-icon"><i class="fa-solid fa-grid-2"></i></div>
                <div class="login-title">NexusDash</div>
                <div class="login-desc">با همون اکانت Google لاگین کن تا ۴ تا اکانت nanaimage.ai رو مدیریت کنی.</div>
                <button class="google-btn" onclick="doLogin()">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Login with Google
                </button>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashScreen">
            <div class="reauth-bar" id="reauthBar">
                <span><i class="fa-solid fa-rotate"></i> Session expired</span>
                <button onclick="reauthNow()">Refresh</button>
            </div>

            <div class="slots-grid" id="slotsGrid">
                <!-- slots injected by JS -->
            </div>

            <div class="bottom-bar">
                <div class="bottom-info">
                    هر اکانت <span>6 کردیت</span> داره (5 اول + 1 دیلی) &nbsp;|&nbsp;
                    مجموع: <span id="totalCredits">0</span> کردیت
                </div>
                <button class="reset-btn" onclick="resetAll()">
                    <i class="fa-solid fa-trash-can"></i> Reset All
                </button>
            </div>
        </div>

    </div>

    <script>
        const CLIENT_ID = '159808029273-ml37999iis48lr4ev5m2u9vesj62fouv.apps.googleusercontent.com';
        const SCOPES    = 'https://www.googleapis.com/auth/gmail.readonly';
        const NANA_SIGNUP = 'https://nanaimage.ai/text-to-image';
        const NANA_DAILY  = 'https://nanaimage.ai/pricing';
        const SLOT_COUNT  = 4;

        let accessToken = null;
        let baseGmail   = null;
        let tokenRefreshTimer = null;

        // Per-slot state
        // { alias, suffix, status: 'idle'|'ready'|'registered', code, credits, pollInterval, knownIds }
        let slots = [];

        // =============================================
        // INIT
        // =============================================
        function initSlots() {
            const saved = localStorage.getItem('dashSlots');
            if (saved) {
                slots = JSON.parse(saved);
                // restore polling structures (can't serialise Set/interval)
                slots.forEach(s => { s.knownIds = new Set(s.knownIdsArr || []); s.pollInterval = null; });
            } else {
                slots = Array.from({length: SLOT_COUNT}, (_, i) => ({
                    id: i + 1,
                    alias: null,
                    suffix: null,
                    status: 'idle',
                    code: null,
                    credits: 0,
                    knownIds: new Set(),
                    knownIdsArr: [],
                    pollInterval: null
                }));
            }
        }

        function saveSlots() {
            const toSave = slots.map(s => ({...s, knownIds: undefined, pollInterval: undefined, knownIdsArr: [...s.knownIds]}));
            localStorage.setItem('dashSlots', JSON.stringify(toSave));
        }

        // =============================================
        // RENDER
        // =============================================
        function render() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';
            let total = 0;
            slots.forEach((s, i) => {
                total += s.credits;
                grid.appendChild(buildSlotEl(s, i));
            });
            document.getElementById('totalCredits').textContent = total;
        }

        function buildSlotEl(s, i) {
            const div = document.createElement('div');
            div.className = 'slot' + (s.status === 'idle' ? '' : s.status === 'registered' ? ' done' : ' active');
            div.id = `slot-${i}`;

            const statusLabel = s.status === 'idle' ? 'idle' : s.status === 'ready' ? 'ready' : 'registered';

            const emailDisplay = s.alias
                ? `<div class="email-box" title="${s.alias}">${s.alias}</div>`
                : `<div class="email-box placeholder">No email yet</div>`;

            const codeContent = s.code
                ? `<span class="code-value" onclick="copyText('${s.code}', ${i})">${s.code}</span>`
                : `<span class="code-waiting">Waiting for code…</span><div class="code-dot"></div>`;

            const signupBtn = s.alias
                ? `<a href="${NANA_SIGNUP}?email=${encodeURIComponent(s.alias)}" target="_blank" class="login-link-btn" onclick="markUsed(${i})">
                        <i class="fa-solid fa-user-plus"></i> ثبت‌نام با این ایمیل
                   </a>`
                : `<button class="login-link-btn disabled" disabled>
                        <i class="fa-solid fa-user-plus"></i> اول ایمیل بساز
                   </button>`;

            const creditBtn = s.status === 'registered'
                ? `<a href="${NANA_DAILY}" target="_blank" class="login-link-btn green">
                        <i class="fa-solid fa-coins"></i> گرفتن کردیت روزانه
                   </a>`
                : `<button class="login-link-btn disabled" disabled>
                        <i class="fa-solid fa-coins"></i> گرفتن کردیت روزانه
                   </button>`;

            div.innerHTML = `
                <div class="slot-header">
                    <div class="slot-num">
                        <div class="slot-num-badge">${s.id}</div>
                        Account ${s.id}
                    </div>
                    <div class="slot-status ${s.status === 'idle' ? 'idle' : s.status === 'ready' ? 'ready' : 'registered'}">${statusLabel}</div>
                </div>

                <div class="email-row">
                    ${emailDisplay}
                    <button class="icon-btn" id="genBtn-${i}" title="Generate new email" onclick="generateAlias(${i})">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                    <button class="icon-btn" title="Copy email" onclick="copyEmail(${i})" ${s.alias ? '' : 'disabled style="opacity:0.4;pointer-events:none;"'}>
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>

                <div class="code-area">
                    <div>
                        <div class="code-label">Verification Code</div>
                        ${codeContent}
                    </div>
                    ${s.code ? `<button class="icon-btn" title="Copy code" onclick="copyText('${s.code}', ${i})"><i class="fa-regular fa-copy"></i></button>` : ''}
                </div>

                ${signupBtn}
                ${creditBtn}

                <div class="credits-row">
                    <span>Credits:</span>
                    <div class="credits-badge"><i class="fa-solid fa-bolt" style="font-size:9px;"></i> ${s.credits}/6</div>
                    <button onclick="addCredit(${i})" style="background:transparent;border:none;color:var(--text-secondary);cursor:pointer;font-size:11px;padding:2px 6px;font-family:inherit;" title="Manually add credit">+1</button>
                    <button onclick="removeCredit(${i})" style="background:transparent;border:none;color:var(--text-secondary);cursor:pointer;font-size:11px;padding:2px 6px;font-family:inherit;" title="Manually remove credit">-1</button>
                </div>
            `;

            return div;
        }

        // =============================================
        // ALIAS GENERATION
        // =============================================
        function genSuffix(len = 7) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let r = '';
            for (let i = 0; i < len; i++) r += chars[Math.floor(Math.random() * chars.length)];
            return r;
        }

        function generateAlias(i) {
            if (!baseGmail) { showToast('Login first', '⚠'); return; }

            // Stop any existing poll
            if (slots[i].pollInterval) { clearInterval(slots[i].pollInterval); slots[i].pollInterval = null; }

            const btn = document.getElementById(`genBtn-${i}`);
            if (btn) btn.classList.add('spin');

            const suffix   = genSuffix();
            const local    = baseGmail.split('@')[0];
            const domain   = baseGmail.split('@')[1];
            const alias    = `${local}+${suffix}@${domain}`;

            slots[i].suffix   = suffix;
            slots[i].alias    = alias;
            slots[i].code     = null;
            slots[i].status   = 'ready';
            slots[i].knownIds = new Set();
            slots[i].credits  = 0;

            saveSlots();
            render();

            // Start polling for this slot
            startPoll(i);

            setTimeout(() => {
                const b = document.getElementById(`genBtn-${i}`);
                if (b) b.classList.remove('spin');
            }, 500);
        }

        // Generate all 4 at once
        function generateAll() {
            for (let i = 0; i < SLOT_COUNT; i++) generateAlias(i);
        }

        // =============================================
        // INBOX POLLING PER SLOT
        // =============================================
        function startPoll(i) {
            if (slots[i].pollInterval) clearInterval(slots[i].pollInterval);
            slots[i].pollInterval = setInterval(() => pollSlot(i), 5000);
        }

        async function pollSlot(i) {
            if (!accessToken || !slots[i].alias) return;
            try {
                const q   = encodeURIComponent(`to:${slots[i].alias}`);
                const res = await fetch(
                    `https://www.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=5`,
                    { headers: { Authorization: `Bearer ${accessToken}` } }
                );
                if (res.status === 401) { showReauth(); return; }
                const data = await res.json();
                for (const msg of (data.messages || [])) {
                    if (!slots[i].knownIds.has(msg.id)) {
                        slots[i].knownIds.add(msg.id);
                        fetchCode(i, msg.id);
                    }
                }
            } catch(e) {}
        }

        async function fetchCode(i, msgId) {
            try {
                const res = await fetch(
                    `https://www.googleapis.com/gmail/v1/users/me/messages/${msgId}?format=full`,
                    { headers: { Authorization: `Bearer ${accessToken}` } }
                );
                const msgData = await res.json();
                const headers   = msgData.payload.headers || [];
                const subject   = (headers.find(h => h.name === 'Subject') || {}).value || '';

                let body = '';
                function exBody(part) {
                    if (part.mimeType === 'text/plain' && part.body?.data)
                        body += atob(part.body.data.replace(/-/g,'+').replace(/_/g,'/'));
                    if (part.mimeType === 'text/html' && part.body?.data && !body) {
                        const html = atob(part.body.data.replace(/-/g,'+').replace(/_/g,'/'));
                        body += html.replace(/<[^>]*>/g,' ');
                    }
                    if (part.parts) part.parts.forEach(exBody);
                }
                if (msgData.payload.parts) msgData.payload.parts.forEach(exBody);
                else if (msgData.payload.body?.data)
                    body = atob(msgData.payload.body.data.replace(/-/g,'+').replace(/_/g,'/'));

                // Filter non-verification
                if (!isVerification(subject, body)) return;

                const code = extractCode(subject + ' ' + body);
                if (code && !slots[i].code) {
                    slots[i].code = code;
                    // Auto-copy
                    navigator.clipboard.writeText(code).catch(()=>{});
                    saveSlots();
                    render();
                    showToast(`Slot ${i+1}: کد ${code} کپی شد!`, '⚡');
                }
            } catch(e) {}
        }

        // =============================================
        // FILTER + EXTRACT (same logic as index.html)
        // =============================================
        function isVerification(subject, body) {
            const full = (subject + ' ' + body).toLowerCase();
            const blocks = [/welcome\s+to\b/i,/welcome\s+aboard/i,/account\s+(has\s+been\s+)?(created|registered|activated|confirmed)/i,/you('ve|re| have)\s+(successfully\s+)?(signed\s+up|registered|joined|created)/i,/thanks?\s+for\s+(joining|signing\s+up|registering|creating)/i,/your\s+account\s+is\s+(ready|active|set\s+up)/i,/unsubscribe/i,/newsletter/i,/\bsale\b.*\b(off|discount|deal)\b/i,/\b(limited\s+time|exclusive\s+offer|special\s+offer|flash\s+sale)\b/i];
            for (const p of blocks) if (p.test(full)) return false;
            const hasNum  = /\b\d{4,8}\b/.test(full);
            const hasAlph = /\b[a-z0-9]{5,12}\b/i.test(full) && /(?:code|token|otp|pin|verify|confirmation|key)/i.test(full);
            const hasLink = /https?:\/\/[^\s"'<>]+(?:verify|confirm|activate|login|signin|auth|magic|token|access)[^\s"'<>]*/i.test(body);
            const hasSub  = /(?:verify|verification|confirm|otp|one.time|passcode|login\s+code|sign.in\s+code|access\s+code|security\s+code|your\s+code)/i.test(subject);
            return hasNum || hasAlph || hasLink || hasSub;
        }

        function extractCode(text) {
            const patterns = [
                /(?:verification|confirm|code|OTP|PIN|passcode)[^\d]*(\d{4,8})/i,
                /(\d{4,8})(?:[^\d]|$).*(?:verification|confirm|code)/i,
                /\b(\d{6})\b/,
                /\b(\d{4,8})\b/,
            ];
            for (const p of patterns) {
                const m = text.match(p);
                if (m) {
                    const n = parseInt(m[1] || m[0]);
                    if (n >= 1000 && n <= 99999999 && !(n >= 2020 && n <= 2030)) return m[1] || m[0];
                }
            }
            return null;
        }

        // =============================================
        // MANUAL ACTIONS
        // =============================================
        function copyEmail(i) {
            if (!slots[i].alias) return;
            navigator.clipboard.writeText(slots[i].alias).then(() => showToast('Email Copied!', '✓'));
        }

        function copyText(text, i) {
            navigator.clipboard.writeText(text).then(() => showToast(`Code ${text} Copied!`, '⚡'));
        }

        function markUsed(i) {
            // Called when user clicks signup link — mark as registered after short delay
            setTimeout(() => {
                if (slots[i].status === 'ready') {
                    slots[i].status = 'registered';
                    slots[i].credits = 5; // 5 signup credits
                    saveSlots();
                    render();
                }
            }, 3000);
        }

        function addCredit(i) {
            slots[i].credits = Math.min(slots[i].credits + 1, 99);
            saveSlots(); render();
        }
        function removeCredit(i) {
            slots[i].credits = Math.max(slots[i].credits - 1, 0);
            saveSlots(); render();
        }

        function resetAll() {
            if (!confirm('همه اکانت‌ها پاک بشن؟')) return;
            slots.forEach(s => {
                if (s.pollInterval) clearInterval(s.pollInterval);
            });
            localStorage.removeItem('dashSlots');
            initSlots();
            render();
        }

        // =============================================
        // AUTH — same robust pattern as index.html
        // =============================================
        function doLogin() {
            const saved = localStorage.getItem('gBaseEmail');
            const client = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                prompt: saved ? '' : 'select_account',
                login_hint: saved || undefined,
                callback: (response) => {
                    if (response.error) { showToast('Login Failed', '✕'); return; }
                    accessToken = response.access_token;
                    const expiry = Date.now() + response.expires_in * 1000;
                    localStorage.setItem('gAccessToken', accessToken);
                    localStorage.setItem('gTokenExpiry', expiry.toString());
                    scheduleRefresh(response.expires_in - 300);
                    loadProfile(false);
                }
            });
            client.requestAccessToken();
        }

        async function loadProfile(isRestore) {
            try {
                const res  = await fetch('https://www.googleapis.com/gmail/v1/users/me/profile', { headers: { Authorization: `Bearer ${accessToken}` } });
                if (res.status === 401) { clearAuth(); return; }
                const data = await res.json();
                baseGmail  = data.emailAddress;
                localStorage.setItem('gBaseEmail', baseGmail);
                showDash();
            } catch(e) { showToast('Profile error', '✕'); }
        }

        function showDash() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashScreen').style.display  = 'block';
            document.getElementById('userPill').style.display    = 'flex';
            document.getElementById('userPillEmail').textContent  = baseGmail;

            initSlots();
            render();

            // Resume polling for ready/registered slots
            slots.forEach((s, i) => {
                if (s.alias && (s.status === 'ready' || s.status === 'registered') && !s.code) startPoll(i);
            });
        }

        function scheduleRefresh(sec) {
            if (tokenRefreshTimer) clearTimeout(tokenRefreshTimer);
            tokenRefreshTimer = setTimeout(doSilentRefresh, Math.max(sec, 10) * 1000);
        }

        function doSilentRefresh() {
            if (!baseGmail) return;
            google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID, scope: SCOPES,
                prompt: '', login_hint: baseGmail,
                callback: (r) => {
                    if (r.error) { showReauth(); return; }
                    accessToken = r.access_token;
                    const expiry = Date.now() + r.expires_in * 1000;
                    localStorage.setItem('gAccessToken', accessToken);
                    localStorage.setItem('gTokenExpiry', expiry.toString());
                    scheduleRefresh(r.expires_in - 300);
                    hideReauth();
                }
            }).requestAccessToken();
        }

        function reauthNow() {
            google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID, scope: SCOPES,
                prompt: '', login_hint: baseGmail,
                callback: (r) => {
                    if (r.error) { showToast('Re-login needed', '🔑'); clearAuth(); return; }
                    accessToken = r.access_token;
                    const expiry = Date.now() + r.expires_in * 1000;
                    localStorage.setItem('gAccessToken', accessToken);
                    localStorage.setItem('gTokenExpiry', expiry.toString());
                    scheduleRefresh(r.expires_in - 300);
                    hideReauth();
                    showToast('Session Restored!', '⚡');
                }
            }).requestAccessToken();
        }

        function showReauth() { document.getElementById('reauthBar').style.display = 'flex'; }
        function hideReauth() { document.getElementById('reauthBar').style.display = 'none'; }

        function clearAuth() {
            accessToken = null; baseGmail = null;
            localStorage.removeItem('gAccessToken');
            localStorage.removeItem('gTokenExpiry');
            document.getElementById('dashScreen').style.display  = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('userPill').style.display    = 'none';
        }

        // =============================================
        // AUTO-RESTORE
        // =============================================
        window.addEventListener('load', () => {
            const savedToken  = localStorage.getItem('gAccessToken');
            const savedExpiry = localStorage.getItem('gTokenExpiry');
            const savedEmail  = localStorage.getItem('gBaseEmail');
            if (!savedEmail) return;

            baseGmail = savedEmail;
            const secondsLeft = savedExpiry ? Math.floor((parseInt(savedExpiry) - Date.now()) / 1000) : 0;

            if (savedToken && secondsLeft > 60) {
                accessToken = savedToken;
                scheduleRefresh(secondsLeft - 300);
                showDash();
            } else {
                // Show dash optimistically, refresh in background
                showDash();
                google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID, scope: SCOPES,
                    prompt: '', login_hint: savedEmail,
                    callback: (r) => {
                        if (r.error) { showReauth(); return; }
                        accessToken = r.access_token;
                        const expiry = Date.now() + r.expires_in * 1000;
                        localStorage.setItem('gAccessToken', accessToken);
                        localStorage.setItem('gTokenExpiry', expiry.toString());
                        scheduleRefresh(r.expires_in - 300);
                        hideReauth();
                    }
                }).requestAccessToken();
            }
        });

        // =============================================
        // TOAST
        // =============================================
        function showToast(msg, icon = '✓') {
            document.getElementById('toastMsg').textContent  = msg;
            document.getElementById('toastIcon').textContent = icon;
            const t = document.getElementById('toast');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
