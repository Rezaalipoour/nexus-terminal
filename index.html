<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Gmail Mail</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='4' width='20' height='16' rx='2'></rect><path d='M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'></path></svg>" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --bg-body: #09090b;
            --card-bg: rgba(24, 24, 27, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --box-bg: rgba(0, 0, 0, 0.4);
            --btn-border: rgba(255, 255, 255, 0.08);
            --code-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.06);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #4f46e5;
            --box-bg: rgba(241, 245, 249, 0.8);
            --btn-border: rgba(0, 0, 0, 0.08);
            --code-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        /* Background Table Blur */
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: linear-gradient(var(--card-border) 1px, transparent 1px),
                              linear-gradient(90deg, var(--card-border) 1px, transparent 1px);
            background-size: 50px 50px;
            filter: blur(2px);
        }

        .container { width: 100%; max-width: 440px; padding: 20px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(24px);
            display: flex; flex-direction: column; gap: 18px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; font-weight: 500; letter-spacing: 0.5px; }
        .header h1 span { color: var(--accent); font-weight: 600; }

        .theme-btn {
            background: transparent; border: none; color: var(--text-secondary);
            cursor: pointer; transition: color 0.2s ease;
        }

        .login-section { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 0; }
        .google-login-btn {
            background: var(--box-bg); border: 1px solid var(--btn-border);
            color: var(--text-primary); padding: 12px 24px; border-radius: 14px;
            cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .main-section { display: none; flex-direction: column; gap: 18px; }
        .main-section.visible { display: flex; }

        .email-display-group {
            background: var(--box-bg); border: 1px solid var(--btn-border);
            border-radius: 16px; padding: 8px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
        }

        .email-text { font-size: 15px; font-weight: 500; }
        .email-text.loading { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .action-icon-btn {
            background: var(--btn-border); border: none; width: 42px; height: 42px;
            border-radius: 12px; color: var(--text-primary); cursor: pointer;
        }

        .controls { display: flex; gap: 10px; }
        .btn {
            flex: 1; background: transparent; border: 1px solid var(--btn-border);
            color: var(--text-primary); padding: 12px; border-radius: 12px; cursor: pointer;
        }

        .inbox-list { display: flex; flex-direction: column; gap: 12px; max-height: 250px; overflow-y: auto; }
        .message { background: var(--box-bg); border: 1px solid var(--btn-border); border-radius: 16px; padding: 12px; }
        .msg-sender { font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
        .extracted-code {
            background: var(--code-bg); color: var(--accent); border-radius: 12px;
            padding: 8px 20px; font-size: 26px; font-weight: 700; letter-spacing: 8px; cursor: pointer; text-align: center;
        }

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: var(--bg-body); padding: 10px 20px; border-radius: 20px;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body data-theme="dark">
    <div class="bg-grid"></div>
    <div id="toast">Copied!</div>

    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Nexus<span>Mail</span></h1>
                <button class="theme-btn" onclick="toggleTheme()"><i class="fa-regular fa-sun" id="themeIcon"></i></button>
            </div>

            <div class="login-section" id="loginSection">
                <button class="google-login-btn" onclick="startGoogleLogin()">Login with Google</button>
            </div>

            <div class="main-section" id="mainSection">
                <div class="email-display-group" onclick="copyEmail()">
                    <div class="email-text" id="emailDisplay">Loading...</div>
                    <button class="action-icon-btn"><i class="fa-regular fa-copy"></i></button>
                </div>
                <div class="controls">
                    <button class="btn" onclick="forceRefresh()">Refresh</button>
                    <button class="btn" onclick="generateNewAlias()">New</button>
                </div>
                <div class="inbox-list" id="inboxContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '159808029273-ml37999iis48lr4ev5m2u9vesj62fouv.apps.googleusercontent.com';
        let accessToken = localStorage.getItem('gAccessToken') || null;

        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = type === 'code' ? 880 : 440;
            gain.gain.exponentialRampToValueAtTime(0.1, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
        }

        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        async function startGoogleLogin() {
            const tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/gmail.readonly',
                callback: (res) => {
                    accessToken = res.access_token;
                    localStorage.setItem('gAccessToken', accessToken);
                    onLogin();
                }
            });
            tokenClient.requestAccessToken();
        }

        function onLogin() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainSection').classList.add('visible');
            generateNewAlias();
        }

        function generateNewAlias() {
            const suffix = Math.random().toString(36).substring(2, 8);
            const email = `user+${suffix}@gmail.com`;
            document.getElementById('emailDisplay').innerText = email;
        }

        function copyEmail() {
            playSound('click');
            navigator.clipboard.writeText(document.getElementById('emailDisplay').innerText);
            showToast('Email Copied');
        }

        function renderMessage(code) {
            playSound('code');
            const inbox = document.getElementById('inboxContainer');
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<div class="extracted-code" onclick="copyText('${code}')">${code}</div>`;
            inbox.prepend(div);
        }

        function copyText(code) {
            playSound('click');
            navigator.clipboard.writeText(code);
            showToast('Code Copied');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }

        window.onload = () => { if(accessToken) onLogin(); };
    </script>
</body>
</html>
