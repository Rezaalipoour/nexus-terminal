<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusMail — Premium Client</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230071e3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='4' width='20' height='16' rx='3'/><path d='M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'/></svg>"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─────────────────────────────────────────
   DESIGN TOKENS — SOPHISTICATED DARK
───────────────────────────────────────── */
:root {
  --bg-main: #0a0a0c;
  --bg-panel: #121215;
  --bg-surface: #1a1a1e;
  --bg-surface-hover: #222227;
  
  --accent: #0071e3;
  --accent-dim: rgba(0, 113, 227, 0.08);
  --accent-mid: rgba(0, 113, 227, 0.15);
  
  --border: rgba(255, 255, 255, 0.04);
  --border-hover: rgba(255, 255, 255, 0.12);
  
  --text-primary: #f5f5f7;
  --text-secondary: #86868b;
  --text-muted: #424245;
  
  --success: #30d158;
  --error: #ff453a;
  --radius-lg: 16px;
  --radius-md: 10px;
}

/* ─────────────────────────────────────────
   DESIGN TOKENS — MUTED LIGHT (Soft & Clean)
───────────────────────────────────────── */
[data-theme="light"] {
  --bg-main: #f5f5f7;
  --bg-panel: #ffffff;
  --bg-surface: #fbfbfd;
  --bg-surface-hover: #f2f2f7;
  
  --accent: #0071e3;
  --accent-dim: rgba(0, 113, 227, 0.06);
  --accent-mid: rgba(0, 113, 227, 0.12);
  
  --border: rgba(0, 0, 0, 0.05);
  --border-hover: rgba(0, 0, 0, 0.12);
  
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-muted: #86868b;
  
  --success: #34c759;
  --error: #ff3b30;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-main);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  transition: background 0.5s cubic-bezier(0.25, 1, 0.5, 1), color 0.3s;
  overflow: hidden;
}

/* ─────────────────────────────────────────
   APP CONTAINER (All elements constrained inside)
───────────────────────────────────────── */
.app {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
}

/* ─────────────────────────────────────────
   HEADER SECTION
───────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-mark {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}

.logo-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.4px;
}

.logo-name span {
  color: var(--text-secondary);
  font-weight: 500;
}

.theme-btn {
  width: 36px;
  height: 36px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.theme-btn:hover {
  border-color: var(--border-hover);
  color: var(--text-primary);
  transform: scale(1.04);
}

/* ─────────────────────────────────────────
   MAIN PANEL
───────────────────────────────────────── */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  position: relative;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
  transition: background 0.5s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s;
}

[data-theme="light"] .panel {
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.04);
}

/* ─────────────────────────────────────────
   LOGIN VIEW
───────────────────────────────────────── */
.login-view {
  padding: 48px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.login-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--accent);
  margin-bottom: 24px;
}

.login-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.4px;
  margin-bottom: 8px;
}

.login-sub {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 32px;
}

.g-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 14px 24px;
  background: var(--text-primary);
  border: none;
  border-radius: var(--radius-md);
  color: var(--bg-panel);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
}

.g-btn:hover {
  opacity: 0.95;
  transform: translateY(-1px);
}

.g-icon { width: 16px; height: 16px; }

/* ─────────────────────────────────────────
   STATUS SYSTEM
───────────────────────────────────────── */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-surface);
}

.s-left {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
}

#statusEmail {
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
}
.live-dot.off { background: var(--error); }

.signout-btn {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  background: none;
  border: none;
  cursor: pointer;
  transition: color 0.2s;
}
.signout-btn:hover { color: var(--error); }

/* ─────────────────────────────────────────
   MAIN BODY & WORKSPACE
───────────────────────────────────────── */
.main-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ── Muted Email Component ── */
.email-display {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
}

.email-display:hover {
  border-color: var(--border-hover);
  background: var(--bg-surface-hover);
}

.email-text {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: -0.1px;
}
.email-text.loading { color: var(--text-muted); }

.copy-btn {
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
}
.email-display:hover .copy-btn { color: var(--accent); }

/* ── Actions Matrix ── */
.actions { display: flex; gap: 8px; }

.act-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
}

.act-btn:hover {
  background: var(--bg-surface-hover);
  border-color: var(--border-hover);
}
.act-btn i { font-size: 11px; color: var(--text-secondary); }
.act-btn.spinning i { animation: spin 0.6s linear infinite; }

/* ─────────────────────────────────────────
   THE INBOX TABLE RE-ENGINEERED
───────────────────────────────────────── */
.inbox-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
}

.inbox-label {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
}

.scan-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--accent);
}

.scan-pip {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse-light 1.8s infinite;
}

@keyframes pulse-light {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

.inbox {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 80px;
  max-height: 260px;
  overflow-y: auto;
}
.inbox::-webkit-scrollbar { width: 0px; }

.empty {
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--text-muted);
  gap: 8px;
}

/* ── Premium Message Rows ── */
.msg {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
}

.msg:hover {
  border-color: var(--border-hover);
  background: var(--bg-surface-hover);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg-sender {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
}

.code-block {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
  font-family: 'Inter', sans-serif;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 4px;
  color: var(--accent);
  transition: all 0.2s;
  user-select: none;
}

.msg:hover .code-block {
  border-color: var(--accent-mid);
  background: var(--accent-dim);
}

.no-code {
  font-size: 13px;
  color: var(--text-secondary);
}

/* ─────────────────────────────────────────
   CONSTRAINED NOTIFICATIONS & UI TOKENS
───────────────────────────────────────── */
.token-warn {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: rgba(255, 69, 58, 0.06);
  border: 1px solid rgba(255, 69, 58, 0.15);
  border-radius: var(--radius-md);
  font-size: 12.5px;
  color: var(--error);
}
.token-warn.visible { display: flex; }
.reauth {
  margin-left: auto;
  background: none;
  border: none;
  color: var(--error);
  font-weight: 600;
  cursor: pointer;
  text-decoration: underline;
}

/* Constrained Internal Toast */
#toast {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--text-primary);
  color: var(--bg-panel);
  font-size: 12px;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 20px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 10;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="3"/>
          <path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
      </div>
      <span class="logo-name">Nexus<span>Mail</span></span>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
      <i class="fa-regular fa-moon" id="themeIcon"></i>
    </button>
  </div>

  <div class="panel">
    
    <div id="toast"></div>

    <div class="login-view" id="loginView">
      <div class="login-icon">
        <i class="fa-regular fa-envelope"></i>
      </div>
      <h2 class="login-title">Connect your inbox</h2>
      <p class="login-sub">Link Gmail to catch verification codes the instant they arrive.</p>
      <button class="g-btn" onclick="startLogin()">
        <svg class="g-icon" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>
    </div>

    <div id="mainView" style="display:none;">

      <div class="status-bar">
        <div class="s-left">
          <div class="live-dot" id="statusDot"></div>
          <span id="statusEmail">—</span>
        </div>
        <button class="signout-btn" onclick="logout()">Sign out</button>
      </div>

      <div class="main-body">

        <div class="token-warn" id="tokenWarning">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>Session expired</span>
          <button class="reauth" onclick="silentRefresh()">Refresh</button>
        </div>

        <div class="email-display" onclick="copyEmail()" title="Copy alias">
          <div class="email-text loading" id="emailDisplay">Generating inbox address...</div>
          <div class="copy-btn">
            <i class="fa-regular fa-copy" id="copyIcon"></i>
          </div>
        </div>

        <div class="actions">
          <button class="act-btn" id="refreshBtn" onclick="doRefresh()">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Refresh</span>
          </button>
          <button class="act-btn" onclick="newEmail()">
            <i class="fa-solid fa-plus"></i>
            <span>New Address</span>
          </button>
        </div>

        <div class="inbox-header">
          <span class="inbox-label">Incoming Messages</span>
          <div class="scan-status">
            <div class="scan-pip"></div>
            <span>MONITORING</span>
          </div>
        </div>

        <div class="inbox" id="inbox">
          <div class="empty">
            <i class="fa-regular fa-clock"></i>
            <span>Listening for incoming codes...</span>
          </div>
        </div>

      </div>
    </div>

  </div></div><script>
const CLIENT_ID = '159808029273-ml37999iis48lr4ev5m2u9vesj62fouv.apps.googleusercontent.com';
const SCOPES    = 'https://www.googleapis.com/auth/gmail.readonly';

let accessToken   = null;
let tokenExpiry   = 0;
let baseGmail     = null;
let currentAlias  = null;
let currentSuffix = null;
let pollTimer     = null;
let refreshTimer  = null;
let knownIds      = new Set();
let firstCopied   = false;
let tokenClient   = null;

/* ── Theme Architecture ── */
function toggleTheme() {
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  document.body.setAttribute('data-theme', next);
  document.getElementById('themeIcon').className = isDark ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
  localStorage.setItem('theme', next);
}
(function initTheme() {
  const t = localStorage.getItem('theme') || 'dark';
  document.body.setAttribute('data-theme', t);
  document.getElementById('themeIcon').className = t === 'dark' ? 'fa-regular fa-moon' : 'fa-regular fa-sun';
})();

/* ── Deep Minimal UI Sound Node ── */
function playNotification() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // A clean, organic double-tap tone instead of a harsh digital beep
    [{ freq:440, start:0, dur:0.06, vol:0.12 }, { freq:554.37, start:0.04, dur:0.12, vol:0.08 }]
    .forEach(n => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = n.freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + n.start);
      gain.gain.linearRampToValueAtTime(n.vol, ctx.currentTime + n.start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.start + n.dur);
      osc.start(ctx.currentTime + n.start);
      osc.stop(ctx.currentTime + n.start + n.dur + 0.02);
    });
  } catch(e) {}
}

/* ── Auth Layer ── */
function initTokenClient() {
  if (tokenClient) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES, prompt: '',
    callback: handleTokenResponse
  });
}

function handleTokenResponse(resp) {
  if (resp.error) {
    document.getElementById('tokenWarning').classList.add('visible');
    setStatus(false); return;
  }
  accessToken = resp.access_token;
  tokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
  localStorage.setItem('gToken', accessToken);
  localStorage.setItem('gExpiry', tokenExpiry);
  document.getElementById('tokenWarning').classList.remove('visible');
  scheduleTokenRefresh();
}

function startLogin() {
  const tc = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES, prompt: 'select_account',
    callback: async (resp) => {
      if (resp.error) { showToast('Authentication cancelled'); return; }
      accessToken = resp.access_token;
      tokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
      localStorage.setItem('gToken', accessToken);
      localStorage.setItem('gExpiry', tokenExpiry);
      await fetchProfile();
      initTokenClient(); scheduleTokenRefresh();
    }
  });
  tc.requestAccessToken({ prompt: 'select_account' });
}

function silentRefresh() {
  if (!tokenClient) initTokenClient();
  tokenClient.requestAccessToken({ prompt: '' });
}

function scheduleTokenRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  const ms = tokenExpiry - Date.now();
  if (ms > 0) refreshTimer = setTimeout(silentRefresh, ms);
}

async function fetchProfile() {
  try {
    const r = await fetch('https://www.googleapis.com/gmail/v1/users/me/profile', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const d = await r.json();
    baseGmail = d.emailAddress;
    localStorage.setItem('gEmail', baseGmail);
    document.getElementById('statusEmail').innerText = baseGmail;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display  = 'block';
    setStatus(true); newEmail();
  } catch(e) { showToast('Profile initialization failed'); }
}

function logout() {
  clearInterval(pollTimer); clearTimeout(refreshTimer);
  accessToken = tokenClient = null;
  ['gToken','gExpiry','gEmail'].forEach(k => localStorage.removeItem(k));
  document.getElementById('mainView').style.display  = 'none';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('inbox').innerHTML = emptyState();
}

window.addEventListener('load', () => {
  const tok = localStorage.getItem('gToken');
  const exp = parseInt(localStorage.getItem('gExpiry') || '0');
  const em  = localStorage.getItem('gEmail');
  if (tok && em && Date.now() < exp) {
    accessToken = tok; tokenExpiry = exp; baseGmail = em;
    document.getElementById('statusEmail').innerText = em;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display  = 'block';
    setStatus(true); initTokenClient(); scheduleTokenRefresh(); newEmail();
  }
});

/* ── Engine Logic ── */
function randStr(n=6) {
  const c='abcdefghijklmnopqrstuvwxyz0123456789';
  return Array.from({length:n},()=>c[Math.random()*c.length|0]).join('');
}

function newEmail() {
  if (!baseGmail) return;
  clearInterval(pollTimer); knownIds.clear(); firstCopied = false;
  currentSuffix = randStr(6);
  const [local,domain] = baseGmail.split('@');
  currentAlias = `${local}+${currentSuffix}@${domain}`;
  const el = document.getElementById('emailDisplay');
  el.innerText = currentAlias; el.classList.remove('loading');
  document.getElementById('inbox').innerHTML = emptyState();
  pollTimer = setInterval(poll, 5000);
}

async function poll() {
  if (!accessToken || !currentAlias) return;
  if (Date.now() > tokenExpiry) { silentRefresh(); return; }
  try {
    const q   = encodeURIComponent(`to:${currentAlias}`);
    const res = await fetch(
      `https://www.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=15`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (res.status === 401) { silentRefresh(); return; }
    const data = await res.json();
    for (const m of (data.messages || [])) {
      if (!knownIds.has(m.id)) {
        knownIds.add(m.id);
        if (document.querySelector('.empty')) document.getElementById('inbox').innerHTML = '';
        fetchMsg(m.id);
      }
    }
  } catch(e) {}
}

async function fetchMsg(id) {
  try {
    const res = await fetch(
      `https://www.googleapis.com/gmail/v1/users/me/messages/${id}?format=full`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    const msg  = await res.json();
    const hdrs = msg.payload.headers || [];
    const from = (hdrs.find(h=>h.name==='From')||{}).value||'';
    const subj = (hdrs.find(h=>h.name==='Subject')||{}).value||'';
    let body = '';
    function exB(p) {
      if (p.mimeType==='text/plain'&&p.body?.data)
        body+=atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/'));
      else if (p.mimeType==='text/html'&&p.body?.data&&!body)
        body+=atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/')).replace(/<[^>]*>/g,' ');
      if (p.parts) p.parts.forEach(exB);
    }
    if (msg.payload.parts) msg.payload.parts.forEach(exB);
    else if (msg.payload.body?.data)
      body=atob(msg.payload.body.data.replace(/-/g,'+').replace(/_/g,'/'));
    const code   = extractCode(subj+' '+body);
    const sender = from.replace(/<.*>/,'').trim()||from.split('@')[0];
    renderMsg(sender,code);
    if (code && !firstCopied) {
      firstCopied=true;
      navigator.clipboard.writeText(code).catch(()=>{});
      showToast('Code copied automatically'); 
      playNotification();
    }
  } catch(e) {}
}

function extractCode(text) {
  const pats = [
    /(?:verification|confirm|code|otp|pin)[^\d]*(\d{4,8})/i,
    /(\d{4,8})(?:[^\d]|$).*(?:verification|confirm|code|otp|pin)/i,
    /\b(\d{6})\b/, /\b(\d{4,8})\b/
  ];
  for (const p of pats) {
    const m = text.match(p);
    if (m) {
      const code=m[1]||m[0]; const n=parseInt(code);
      if (n>=1000&&n<=99999999&&!(n>=2020&&n<=2030)) return code;
    }
  }
  return null;
}

function renderMsg(sender, code) {
  const inbox = document.getElementById('inbox');
  const card  = document.createElement('div');
  card.className = 'msg';
  card.setAttribute('onclick', 'playNotification()'); // Sound trigger on row click
  let html = `<div class="msg-sender">${esc(sender)}</div>`;
  if (code) {
    html += `<div class="code-block" onclick="copyCode(event, '${code}')">${code}</div>`;
  } else {
    html += `<div class="no-code">// Secure content parsed — No explicit code found</div>`;
  }
  card.innerHTML = html;
  inbox.prepend(card);
}

function emptyState() {
  return `<div class="empty"><i class="fa-regular fa-clock"></i> <span>Awaiting messages...</span></div>`;
}

async function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning'); await poll();
  setTimeout(()=>btn.classList.remove('spinning'),600);
}

function copyEmail() {
  if (!currentAlias) return;
  navigator.clipboard.writeText(currentAlias).then(()=>{
    showToast('Email address copied');
    const icon=document.getElementById('copyIcon');
    icon.className='fa-solid fa-check';
    setTimeout(()=>icon.className='fa-regular fa-copy',1400);
  });
}

function copyCode(e, code) {
  e.stopPropagation(); // Prevents double sound execution
  navigator.clipboard.writeText(code).then(()=>{
    showToast('Code copied to clipboard');
    playNotification();
  });
}

function setStatus(ok) {
  document.getElementById('statusDot').className = ok ? 'live-dot' : 'live-dot off';
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.innerText=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
