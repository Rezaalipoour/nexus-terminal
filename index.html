<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Temp Mail</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='4' width='20' height='16' rx='2'></rect><path d='M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'></path></svg>" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #09090b;
            --card-bg: rgba(24, 24, 27, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --box-bg: rgba(0, 0, 0, 0.4);
            --btn-border: rgba(255, 255, 255, 0.08);
            --code-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.06);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #4f46e5;
            --box-bg: rgba(241, 245, 249, 0.8);
            --btn-border: rgba(0, 0, 0, 0.08);
            --code-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex; flex-direction: column; gap: 18px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; font-weight: 500; letter-spacing: 0.5px; }
        .header h1 span { color: var(--accent); font-weight: 600; }

        .theme-btn {
            background: transparent; border: none;
            color: var(--text-secondary); font-size: 18px;
            cursor: pointer; transition: color 0.2s ease;
        }
        .theme-btn:hover { color: var(--accent); }

        /* Domain selector */
        .domain-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .domain-chip {
            background: var(--box-bg);
            border: 1px solid var(--btn-border);
            border-radius: 10px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        .domain-chip:hover { border-color: var(--accent); color: var(--text-primary); }
        .domain-chip.active {
            border-color: var(--accent);
            background: rgba(99,102,241,0.12);
            color: var(--accent);
            font-weight: 600;
        }

        .email-display-group {
            background: var(--box-bg);
            border: 1px solid var(--btn-border);
            border-radius: 16px;
            padding: 8px 8px 8px 18px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.1s ease;
        }
        .email-display-group:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
        }
        .email-display-group:active { transform: scale(0.98); }

        .email-text {
            font-size: 15px; font-weight: 500; letter-spacing: 0.2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--text-primary);
            flex: 1;
            margin-right: 8px;
        }

        .email-text.loading { color: var(--text-secondary); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .action-icon-btn {
            background: var(--btn-border); border: none;
            width: 42px; height: 42px;
            border-radius: 12px;
            color: var(--text-primary); cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 16px;
            flex-shrink: 0;
            pointer-events: none;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .email-display-group:hover .action-icon-btn {
            background: var(--accent); color: #fff;
        }

        .controls { display: flex; gap: 10px; }
        .btn {
            flex: 1; background: transparent; border: 1px solid var(--btn-border);
            color: var(--text-primary); padding: 12px; border-radius: 12px;
            font-family: inherit; font-size: 13px; font-weight: 400; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 6px;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .btn:hover { background: var(--btn-border); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .spin i { animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .divider { height: 1px; background: var(--btn-border); width: 100%; margin: 2px 0; }

        .inbox-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 1.5px;
        }

        .radar { display: flex; align-items: center; gap: 6px; }
        .dot {
            width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
            animation: blink 2s infinite;
        }
        .dot.inactive { background: var(--text-secondary); animation: none; opacity: 0.5; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; box-shadow: 0 0 8px var(--accent); } }

        .inbox-list {
            display: flex; flex-direction: column; gap: 12px;
            min-height: 80px;
            max-height: 300px;
            overflow-y: auto; padding-right: 4px;
        }

        .inbox-list::-webkit-scrollbar { width: 4px; }
        .inbox-list::-webkit-scrollbar-thumb { background: var(--btn-border); border-radius: 4px; }

        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 80px; gap: 8px; color: var(--text-secondary); font-size: 13px; font-weight: 300;
        }

        .message {
            background: var(--box-bg);
            border: 1px solid var(--btn-border);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeUp 0.3s ease forwards;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .msg-sender {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: left;
            width: 100%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding-left: 2px;
        }

        .msg-subject {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 400;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding-left: 2px;
        }

        .extracted-code {
            background: var(--code-bg);
            color: var(--accent);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 12px;
            padding: 8px 20px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 8px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: all 0.2s ease;
            will-change: transform;
        }

        .extracted-code:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .extracted-code:active {
            transform: scale(0.97);
            box-shadow: none;
        }

        /* Raw message view (no code found) */
        .raw-message {
            background: var(--code-bg);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.6;
            max-height: 80px;
            overflow-y: auto;
        }

        /* Timer bar */
        .timer-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .timer-bar-bg {
            flex: 1;
            height: 3px;
            background: var(--btn-border);
            border-radius: 4px;
            overflow: hidden;
        }
        .timer-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 1s linear;
        }
        .timer-bar-fill.warning { background: #f59e0b; }
        .timer-bar-fill.critical { background: #ef4444; }

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--text-primary); color: var(--bg-body);
            font-size: 13px; font-weight: 600;
            padding: 10px 20px; border-radius: 20px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: var(--shadow); z-index: 100;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body data-theme="dark">

    <div id="toast">Copied!</div>

    <div class="container">
        <div class="card">

            <div class="header">
                <h1>Nexus<span>Mail</span></h1>
                <button class="theme-btn" onclick="toggleTheme()" title="Switch Theme">
                    <i class="fa-regular fa-sun" id="themeIcon"></i>
                </button>
            </div>

            <!-- Domain Chips -->
            <div class="domain-row" id="domainRow">
                <!-- filled by JS -->
            </div>

            <div class="email-display-group" onclick="copyEmail()">
                <div class="email-text loading" id="emailDisplay">Connecting...</div>
                <button class="action-icon-btn" id="copyBtn">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>

            <!-- Expiry timer -->
            <div class="timer-row" id="timerRow" style="display:none">
                <span id="timerLabel">60:00</span>
                <div class="timer-bar-bg">
                    <div class="timer-bar-fill" id="timerFill" style="width:100%"></div>
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="refreshBtn" onclick="forceRefresh()">
                    <i class="fa-solid fa-rotate-right"></i> Refresh
                </button>
                <button class="btn" id="newEmailBtn" onclick="createNewEmail()">
                    <i class="fa-solid fa-plus"></i> New Email
                </button>
            </div>

            <div class="divider"></div>

            <div class="inbox-header">
                <span>Verification Codes</span>
                <div class="radar">
                    <div class="dot inactive" id="radarDot"></div>
                    <span id="scanStatus" style="font-size: 9px;">Starting...</span>
                </div>
            </div>

            <div class="inbox-list" id="inboxContainer">
                <div class="empty-state">
                    <span>Awaiting incoming codes...</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // =========================================================
        //  GuerrillaMailAPI — public, no-key, stable since 2006
        //  API base: https://api.guerrillamail.com/ajax.php
        //  All available domains returned dynamically by the API
        // =========================================================

        const GM_API = "https://api.guerrillamail.com/ajax.php";

        // All known GuerrillaMail domains (the API also returns them)
        const FALLBACK_DOMAINS = [
            "guerrillamailblock.com",
            "grr.la",
            "guerrillamail.info",
            "guerrillamail.biz",
            "guerrillamail.de",
            "guerrillamail.net",
            "guerrillamail.org",
            "spam4.me",
            "sharklasers.com",
            "guerrillamail.com"
        ];

        let sessionId   = "";   // PHPSESSID cookie value
        let sidToken    = "";   // sid_token from API
        let currentEmail = "";
        let currentDomain = "";
        let emailTimestamp = 0;
        let knownIds    = new Set();
        let checkInterval = null;
        let timerInterval = null;
        let availableDomains = [...FALLBACK_DOMAINS];
        let selectedDomainIdx = 0;

        // =========================================================
        //  INIT
        // =========================================================
        window.addEventListener('DOMContentLoaded', () => {
            createNewEmail();
        });

        // =========================================================
        //  GM API HELPER — maintains PHPSESSID cookie in header
        // =========================================================
        async function gmFetch(params) {
            const url = new URL(GM_API);
            url.searchParams.set("ip", "127.0.0.1");
            url.searchParams.set("agent", "Mozilla_Firefox");
            for (const [k, v] of Object.entries(params)) {
                url.searchParams.set(k, v);
            }

            const headers = { "Accept": "application/json" };
            if (sessionId) headers["Cookie"] = `PHPSESSID=${sessionId}`;

            const res = await fetch(url.toString(), {
                method: "GET",
                credentials: "omit",
                headers
            });

            // Grab updated PHPSESSID from response if present
            const setCookie = res.headers.get("set-cookie") || "";
            const match = setCookie.match(/PHPSESSID=([^;]+)/);
            if (match) sessionId = match[1];

            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        // =========================================================
        //  BUILD DOMAIN CHIPS
        // =========================================================
        function buildDomainChips() {
            const row = document.getElementById('domainRow');
            row.innerHTML = '';
            availableDomains.slice(0, 6).forEach((d, i) => {
                const chip = document.createElement('button');
                chip.className = 'domain-chip' + (i === selectedDomainIdx ? ' active' : '');
                chip.textContent = '@' + d.split('.')[0];
                chip.title = '@' + d;
                chip.onclick = () => {
                    selectedDomainIdx = i;
                    document.querySelectorAll('.domain-chip').forEach((c, j) => {
                        c.className = 'domain-chip' + (j === i ? ' active' : '');
                    });
                    createNewEmail(availableDomains[i]);
                };
                row.appendChild(chip);
            });
        }

        // =========================================================
        //  CREATE NEW EMAIL  — uses GuerrillaMailAPI
        // =========================================================
        async function createNewEmail(forceDomain) {
            const display  = document.getElementById('emailDisplay');
            const status   = document.getElementById('scanStatus');
            const dot      = document.getElementById('radarDot');
            const inbox    = document.getElementById('inboxContainer');
            const timerRow = document.getElementById('timerRow');

            // Reset
            if (checkInterval)  clearInterval(checkInterval);
            if (timerInterval)  clearInterval(timerInterval);
            knownIds.clear();
            currentEmail = "";
            sidToken = "";
            sessionId = "";

            display.className  = "email-text loading";
            display.innerText  = "Connecting...";
            status.innerText   = "Loading...";
            dot.className      = "dot inactive";
            timerRow.style.display = "none";
            inbox.innerHTML    = `<div class="empty-state"><span>Setting up mailbox...</span></div>`;

            try {
                // Step 1: get a new email address from GuerrillaMailAPI
                const data = await gmFetch({ f: "get_email_address", lang: "en" });

                // data.email_addr, data.sid_token, data.email_timestamp
                // data.domain_list — array of available domains
                sidToken       = data.sid_token || "";
                currentEmail   = data.email_addr || "";
                emailTimestamp = data.email_timestamp || Math.floor(Date.now() / 1000);

                // Populate domains from API
                if (data.domain_list && data.domain_list.length > 0) {
                    availableDomains = data.domain_list;
                }

                // If a specific domain was requested, switch to it
                if (forceDomain && forceDomain !== currentEmail.split('@')[1]) {
                    const randomUser = Math.random().toString(36).substring(2, 10);
                    const switchData = await gmFetch({
                        f: "set_email_user",
                        email_user: randomUser,
                        lang: "en",
                        sid_token: sidToken
                    });
                    if (switchData.email_addr) {
                        currentEmail   = switchData.email_addr;
                        emailTimestamp = switchData.email_timestamp || emailTimestamp;
                    }
                }

                // Build chips
                buildDomainChips();

                // Update UI
                display.className = "email-text";
                display.innerText = currentEmail;
                status.innerText  = "Scanning";
                dot.className     = "dot";
                inbox.innerHTML   = `<div class="empty-state"><span>Waiting for codes...</span></div>`;
                timerRow.style.display = "flex";

                // Start expiry countdown (60 min from emailTimestamp)
                startTimer();

                // Poll every 5 seconds
                checkInterval = setInterval(checkInbox, 5000);

            } catch (e) {
                console.error("Setup error:", e);
                display.className = "email-text loading";
                display.innerText = "Failed to connect";
                status.innerText  = "Error";
                dot.className     = "dot inactive";
                inbox.innerHTML   = `<div class="empty-state"><span>Connection failed. Try Refresh or New Email.</span></div>`;
            }
        }

        // =========================================================
        //  COUNTDOWN TIMER
        // =========================================================
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            updateTimer();
        }

        function updateTimer() {
            const fill  = document.getElementById('timerFill');
            const label = document.getElementById('timerLabel');
            const now   = Math.floor(Date.now() / 1000);
            const elapsed = now - emailTimestamp;
            const remaining = Math.max(0, 3600 - elapsed);

            const pct = (remaining / 3600) * 100;
            fill.style.width = pct + "%";
            fill.className = "timer-bar-fill" +
                (pct < 15 ? " critical" : pct < 30 ? " warning" : "");

            const m = Math.floor(remaining / 60);
            const s = remaining % 60;
            label.textContent = `${m}:${String(s).padStart(2, '0')}`;

            if (remaining === 0) {
                clearInterval(timerInterval);
                clearInterval(checkInterval);
                document.getElementById('scanStatus').innerText = "Expired";
                document.getElementById('radarDot').className = "dot inactive";
            }
        }

        // =========================================================
        //  CHECK INBOX  — uses check_email then fetch_email
        // =========================================================
        async function checkInbox() {
            if (!sidToken) return;

            try {
                // seq=0 always fetches latest 20
                const data = await gmFetch({ f: "check_email", seq: 0, sid_token: sidToken });

                const list = data.list || [];
                if (list.length === 0) return;

                for (const msg of list) {
                    const id = String(msg.mail_id);
                    if (knownIds.has(id)) continue;
                    knownIds.add(id);

                    // Fetch full email body
                    const full = await gmFetch({ f: "fetch_email", email_id: id, sid_token: sidToken });

                    const from    = full.mail_from  || msg.mail_from  || "Unknown";
                    const subject = full.mail_subject || msg.mail_subject || "";
                    const body    = full.mail_body   || full.mail_text || "";

                    // Decode HTML entities in subject/body
                    const rawText = decodeEntities(subject + " " + stripHtml(body));
                    const code    = extractCodeNumber(rawText);

                    const inboxEl = document.getElementById('inboxContainer');
                    if (inboxEl.querySelector('.empty-state')) inboxEl.innerHTML = '';

                    if (code) {
                        renderCode(code, from, subject);
                    } else {
                        renderRaw(subject || "(no subject)", from, stripHtml(body).substring(0, 120));
                    }
                }

            } catch (e) {
                console.error("Inbox error:", e);
            }
        }

        // =========================================================
        //  HELPERS
        // =========================================================
        function stripHtml(html) {
            if (!html) return "";
            return html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function decodeEntities(str) {
            const el = document.createElement('textarea');
            el.innerHTML = str;
            return el.value;
        }

        // =========================================================
        //  EXTRACT VERIFICATION CODE
        //  Matches 4-8 digit codes, avoids years
        // =========================================================
        function extractCodeNumber(text) {
            if (!text) return null;

            const patterns = [
                /(?:verification|verify|otp|code|کد|رمز|pin|token|passcode|activate)[^\d]{0,30}(\d{4,8})/i,
                /(\d{4,8})(?:[^\d]{0,20})(?:is your|verification|code|کد|token)/i,
                /\b([A-Z]{2,4}[0-9]{4,6}|[0-9]{4,6}[A-Z]{2,4})\b/,  // Alphanumeric like AB1234
                /\b([A-Z0-9]{6,8})\b(?=[^\w]|$)/,                      // Generic alphanum
                /\b(\d{6})\b/,
                /\b(\d{4})\b/,
                /\b(\d{5})\b/,
                /\b(\d{7,8})\b/,
            ];

            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match) {
                    const c = match[1];
                    if (/^(19|20)\d{2}$/.test(c)) continue;  // Skip years
                    if (/^0+$/.test(c)) continue;             // Skip all-zeros
                    return c;
                }
            }
            return null;
        }

        // =========================================================
        //  RENDER — code card (highlighted, clickable)
        // =========================================================
        function renderCode(code, sender, subject) {
            const inbox = document.getElementById('inboxContainer');
            const card  = document.createElement('div');
            card.className = 'message';

            const fromEl = document.createElement('div');
            fromEl.className = 'msg-sender';
            fromEl.innerText = sender;

            const subEl = document.createElement('div');
            subEl.className = 'msg-subject';
            subEl.innerText = subject;

            const codeEl = document.createElement('div');
            codeEl.className = 'extracted-code';
            codeEl.innerText = code;
            codeEl.title = "Click to copy";
            codeEl.onclick = () => copyToClipboard(code);

            card.appendChild(fromEl);
            if (subject) card.appendChild(subEl);
            card.appendChild(codeEl);
            inbox.insertBefore(card, inbox.firstChild);
        }

        // =========================================================
        //  RENDER — raw card (no code detected)
        // =========================================================
        function renderRaw(subject, sender, excerpt) {
            const inbox = document.getElementById('inboxContainer');
            const card  = document.createElement('div');
            card.className = 'message';

            const fromEl = document.createElement('div');
            fromEl.className = 'msg-sender';
            fromEl.innerText = sender;

            const rawEl = document.createElement('div');
            rawEl.className = 'raw-message';
            rawEl.innerText = subject + (excerpt ? '\n' + excerpt : '');

            card.appendChild(fromEl);
            card.appendChild(rawEl);
            inbox.insertBefore(card, inbox.firstChild);
        }

        // =========================================================
        //  FORCE REFRESH
        // =========================================================
        async function forceRefresh() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spin');
            btn.disabled = true;
            await checkInbox();
            setTimeout(() => {
                btn.classList.remove('spin');
                btn.disabled = false;
            }, 800);
        }

        // =========================================================
        //  COPY EMAIL
        // =========================================================
        function copyEmail() {
            if (!currentEmail || currentEmail === "Connecting..." || currentEmail === "Failed to connect") return;
            copyToClipboard(currentEmail);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("Copied!");
            }).catch(() => {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                showToast("Copied!");
            });
        }

        // =========================================================
        //  TOAST
        // =========================================================
        let toastTimer;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // =========================================================
        //  THEME TOGGLE
        // =========================================================
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                icon.className = 'fa-regular fa-moon';
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.className = 'fa-regular fa-sun';
            }
        }
    </script>
</body>
</html>
